<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Landfill | Ratdoodle</title>
<link rel="stylesheet" href="/shared/item-features.css?v=items1">
<style>*{box-sizing:border-box}body{margin:0;background:#bcc8cc;color:#0007e6;font:18px/1.6 Arial,sans-serif;text-align:center}a{color:inherit}nav{display:flex;justify-content:flex-end;gap:18px;padding:15px 20px}main{width:calc(100% - 30px);max-width:850px;margin:25px auto 60px}h1{font-size:clamp(30px,6vw,44px);margin:20px 0 30px}.hero{display:block;width:100%;height:auto}.description{max-width:600px;margin:20px auto}.inventory-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;max-width:600px;margin:25px auto}.inventory-card{border:2px solid #0007e6;padding:12px;overflow-wrap:anywhere}.inventory-card img{width:100%;height:120px;object-fit:contain}.inventory-card button{display:block;margin:8px auto 0;padding:8px;font:16px Arial,sans-serif;color:inherit;background:white;border:2px solid #0007e6;cursor:pointer}.inventory-card small{font-size:13px}#status{min-height:28px}</style></head>
<body><nav><a href="/account/">Account</a><a href="/">Home</a></nav><main><h1>Landfill</h1><img class="hero" src="./landfill.png" alt="The landfill"><p class="description">Someone's trash might be your treasure. Claim an item, or hide it back in the landfill. Items disappear after 24 hours.</p><p id="status" role="status">Looking through the landfill…</p><button id="refresh" type="button">Refresh</button><div id="landfillItems" class="inventory-grid"></div></main>
<script src="/shared/item-features.js?v=items1"></script>
<script>
(()=>{'use strict';const list=document.getElementById('landfillItems'),status=document.getElementById('status'),refresh=document.getElementById('refresh');let busy=false,acting=false;const keys=new Map(),el=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n;};
async function act(row,action,buttons){if(acting)return;acting=true;buttons.forEach(b=>b.disabled=true);refresh.disabled=true;const k=action+':'+row.id;if(!keys.has(k))keys.set(k,crypto.randomUUID().replace(/-/g,''));status.textContent='Please wait…';try{const data=await RatdoodleItems.request('/items/landfill/'+action,{landfillId:row.id,requestId:keys.get(k)});if(action==='claim')RatdoodleItems.showItem(data.item,'Item received!');status.textContent=action==='claim'?'Added to your inventory!':'The item is hidden.';await load(true);}catch(error){status.textContent=error.message;buttons.forEach(b=>b.disabled=false);}finally{acting=false;refresh.disabled=false;}}
async function load(keepMessage=false){if(busy||acting&&!keepMessage||document.hidden)return;busy=true;refresh.disabled=true;try{const data=await RatdoodleItems.request('/items/landfill');list.replaceChildren();for(const row of data.items||[]){const card=el('div');card.className='inventory-card';const image=el('img');image.src=row.item.image;image.alt=row.item.title;card.append(image,el('p',row.item.title),el('small','Disappears '+new Date(row.expiresAt).toLocaleString()));const hide=el('button','hide in landfill'),claim=el('button','claim');hide.type=claim.type='button';const buttons=[hide,claim];hide.onclick=()=>act(row,'hide',buttons);claim.onclick=()=>act(row,'claim',buttons);card.append(hide,claim);list.append(card);}if(!keepMessage)status.textContent=data.items.length?'':'No items are visible in the landfill right now.';}catch(error){status.textContent=error.message;}finally{busy=false;refresh.disabled=acting;}}
refresh.onclick=()=>load();load();setInterval(()=>load(),30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load();});
})();
</script></body></html>
