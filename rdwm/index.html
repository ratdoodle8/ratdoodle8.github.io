<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Socials</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 14px 60px;

            background-color: #bcc8cc;
            color: #0007E6;

            font-family: Arial, sans-serif;
            text-align: center;
        }

        main {
            width: 100%;
            max-width: 400px;

            margin: 0 auto;
        }

        h1,
        p,
        a {
            color: #0007E6;
        }

        h1 {
            margin: 0 0 15px;

            font-size: 32px;
        }

        .email {
            margin: 0 0 30px;

            font-size: 14px;

            overflow-wrap: anywhere;
        }


        /* ============================================= */
        /* BUTTONS                                       */
        /* ============================================= */

        .social-button {
            display: block;

            width: 100%;

            margin: 0 auto 12px;
            padding: 13px 18px;

            background-color: white;
            color: #0007E6;

            border-radius: 25px;

            text-decoration: none;

            font-weight: bold;
        }

        .social-button:hover {
            transform: scale(1.04);
        }


        /* ============================================= */
        /* MOBILE                                        */
        /* ============================================= */

        @media (max-width: 500px) {

            body {
                padding-left: 14px;
                padding-right: 14px;
            }

            h1 {
                font-size: 27px;
            }

        }

    </style>

</head>


<body>

    <main>

        <h1>
            Ratdoodle's World (Music)
        </h1>


        <p class="email">
            mostly instrumental experimental beats<br>and soundscapes created by Ratdoodle!
        </p>

        <h1>
            Albums
        </h1>

        <a
            class="social-button"
            href="https://youtu.be/L1iI6pDzV_4?si=ywR5OcwFmNzY2qDx"
            rel="noopener noreferrer"
        >
            RDW - LIFESTAR 2010
        </a>

        <a
            class="social-button"
            href="https://youtu.be/1XJ0Q1jVGN4?si=5B4X4N-Uj_RagzSu"
            rel="noopener noreferrer"
        >
            RDW - Doodle and the Golden Dragon
        </a>

        <a
            class="social-button"
            href="https://youtu.be/y6oD9EDWF5c?si=_Opg_wdZGwtT9n7x"
            rel="noopener noreferrer"
        >
            RDW - Alchemy Potluck
        </a>

        <h1>
            Singles
        </h1>

<p class="email">
            I will update this asap lol
        </p>




        <a
            class="social-button"
            href="/music"
        >
            Explore discography!
        </a>


    </main>

</body>

</html>
