<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guide</title><style>*{box-sizing:border-box}body{margin:0;padding:70px 20px 30px;background:#bcc8cc;color:#0007E6;font:16px Arial,sans-serif;text-align:center}a{color:inherit}.home{position:absolute;top:16px;right:16px;border:1px solid;padding:8px 14px;text-decoration:none}main{max-width:400px;margin:auto}h1{font-size:24px;font-weight:normal}#status{font-size:12px;line-height:1.5}input{width:100%;padding:10px;background:transparent;border:1px solid #0007E6;color:inherit;font:inherit;margin:15px 0}ul{list-style:none;padding:0;margin:0;text-align:left}li{padding:10px;border-bottom:1px solid #0007e633;overflow-wrap:anywhere}li a{display:block}#count{font-size:13px}a:focus-visible,input:focus-visible{outline:2px solid;outline-offset:3px}</style></head><body><a class="home" href="/homereal">Home</a><main><h1>Guide</h1><p id="status" role="status">Finding pages…</p><input id="search" type="search" placeholder="Find a page…" aria-label="Find a page"><p id="count"></p><ul id="pages"></ul></main><script>
// To include every unlinked page too, set this to your public GitHub repository: owner/repository.
const REPOSITORY='';
const pages=new Map(),seen=new Set();let updating=false;
const status=document.querySelector('#status'),list=document.querySelector('#pages'),search=document.querySelector('#search');
const excluded=/\.(?:png|jpe?g|gif|webp|svg|ico|pdf|zip|mp[34]|wav|ogg|json|css|js|txt|xml|woff2?|ttf|map)$/i;
function normalize(value){try{const u=new URL(value,location.origin);if(u.origin!==location.origin||excluded.test(u.pathname))return null;u.search='';u.hash='';u.pathname=u.pathname.replace(/\/index\.html$/i,'/').replace(/\/$/,'')||'/';return u.pathname;}catch{return null;}}
function add(path,title){const p=normalize(path);if(p)pages.set(p,title||pages.get(p)||p);}
function render(){const q=search.value.trim().toLowerCase();list.replaceChildren();const rows=[...pages].sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true}));for(const [path,title] of rows){if(!(path+' '+title).toLowerCase().includes(q))continue;const li=document.createElement('li'),a=document.createElement('a');a.href=path;a.textContent=path;li.append(a);list.append(li);}document.querySelector('#count').textContent=pages.size+' pages';}
async function get(url){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);try{const r=await fetch(url,{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error('Unavailable');return r;}finally{clearTimeout(timer);}}
async function sitemap(url,depth=0){if(depth>3)return;try{const r=await get(url),xml=new DOMParser().parseFromString(await r.text(),'application/xml');for(const node of xml.querySelectorAll('url > loc'))add(node.textContent);for(const node of xml.querySelectorAll('sitemap > loc')){const u=new URL(node.textContent,location.origin);if(u.origin===location.origin)await sitemap(u.href,depth+1);}}catch{}}
async function repository(){const meta=await(await get('https://api.github.com/repos/'+REPOSITORY)).json();const tree=await(await get('https://api.github.com/repos/'+REPOSITORY+'/git/trees/'+encodeURIComponent(meta.default_branch)+'?recursive=1')).json();if(tree.truncated)throw Error('Repository list incomplete');pages.clear();for(const f of tree.tree||[]){if(f.type!=='blob'||!f.path.endsWith('.html'))continue;const path='/'+f.path;add(path.replace(/\/index\.html$/,'/'));}add('/guide');}
async function crawl(){seen.clear();const queue=['/','/homereal',...pages.keys()];let fetched=0;while(queue.length&&fetched<400){const batch=queue.splice(0,3).filter(p=>!seen.has(p));batch.forEach(p=>seen.add(p));await Promise.all(batch.map(async path=>{fetched++;try{const r=await get(path);if(!r.headers.get('content-type')?.includes('text/html'))return;const doc=new DOMParser().parseFromString(await r.text(),'text/html');add(path,doc.title);for(const a of doc.querySelectorAll('a[href]')){const p=normalize(new URL(a.getAttribute('href'),new URL(r.url)));if(p&&!seen.has(p)&&!queue.includes(p))queue.push(p);}}catch{}}));render();}return queue.length===0;}
async function update(){if(updating||document.hidden)return;updating=true;try{if(REPOSITORY){await repository();status.textContent='All HTML pages · updates every minute';}else{await sitemap('/sitemap.xml');const complete=await crawl();status.textContent=(complete?'Linked pages and sitemap':'Linked pages · scan limit reached')+' · updates every minute';}render();}catch{status.textContent='Could not refresh. Trying again shortly.';}finally{updating=false;}}
add('/guide','Guide');search.addEventListener('input',render);document.addEventListener('visibilitychange',()=>{if(!document.hidden)update();});update();setInterval(update,60000);
</script></body></html>
