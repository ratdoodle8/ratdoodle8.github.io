<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Archive Tags</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            background-color: #bcc8cc;
            color: #0007E6;

            font-family: Arial, sans-serif;

            text-align: center;

            margin: 0;
            padding: 30px 10px;
        }

        h1,
        p {
            color: #0007E6;
        }


        /* ============================================= */
        /* PAGE                                         */
        /* ============================================= */

        main {
            width: 100%;
            max-width: 400px;

            margin: 0 auto;
        }

        .description {
            width: 90%;

            margin: 10px auto 25px;

            line-height: 1.5;
        }


        /* ============================================= */
        /* TAG LIST                                     */
        /* ============================================= */

        #tag-list {
            width: 100%;

            display: flex;
            flex-direction: column;

            gap: 8px;

            margin: 25px auto;
        }


        /* ============================================= */
        /* TAG                                          */
        /* ============================================= */

        .tag-item {
            display: block;

            width: 100%;

            background-color: white;
            color: #0007E6;

            padding: 12px 16px;

            border-radius: 20px;

            text-decoration: none;

            overflow-wrap: anywhere;
        }


        /* ============================================= */
        /* TAG COUNT                                    */
        /* ============================================= */

        .tag-count {
            font-size: 11px;

            opacity: 0.7;

            margin-left: 5px;
        }


        /* ============================================= */
        /* BUTTON                                       */
        /* ============================================= */

        .back-button {
            display: inline-block;

            background-color: white;
            color: #0007E6;

            text-decoration: none;

            padding: 14px 24px;

            margin: 30px auto;

            border-radius: 25px;
        }

        .back-button:hover,
        .tag-item:hover {
            transform: scale(1.03);
        }


        /* ============================================= */
        /* STATUS                                       */
        /* ============================================= */

        #status {
            margin: 20px auto;
        }

    </style>

</head>


<body>

    <main>

        <h1>
            Archive Tags
        </h1>

        <p class="description">
            All tags currently used by the archive.
        </p>


        <p id="status">
            Loading tags...
        </p>


        <div id="tag-list"></div>


        <a
            class="back-button"
            href="/"
        >
            Home
        </a>

    </main>


    <script>

        // ======================================================
        // Load all archive tags
        // ======================================================

        async function loadArchiveTags() {

            const tagList =
                document.getElementById(
                    "tag-list"
                );

            const status =
                document.getElementById(
                    "status"
                );


            try {

                const response =
                    await fetch(
                        "/shared/arcinfo.json"
                    );


                if (!response.ok) {

                    throw new Error(
                        "Could not load arcinfo.json"
                    );

                }


                const archiveData =
                    await response.json();


                const images =
                    archiveData.images || {};


                // ==================================================
                // Count every tag
                // ==================================================

                const tagCounts = {};


                Object.values(images)
                    .forEach(
                        imageInformation => {

                            const tags =
                                Array.isArray(
                                    imageInformation.tags
                                )
                                    ? imageInformation.tags
                                    : [];


                            tags.forEach(
                                tag => {

                                    if (
                                        typeof tag !==
                                        "string"
                                    ) {
                                        return;
                                    }


                                    const cleanedTag =
                                        tag.trim();


                                    if (!cleanedTag) {
                                        return;
                                    }


                                    if (
                                        !tagCounts[
                                            cleanedTag
                                        ]
                                    ) {

                                        tagCounts[
                                            cleanedTag
                                        ] = 0;

                                    }


                                    tagCounts[
                                        cleanedTag
                                    ] += 1;

                                }
                            );

                        }
                    );


                // ==================================================
                // Alphabetical list
                // ==================================================

                const tags =
                    Object.keys(
                        tagCounts
                    )
                    .sort(
                        (a, b) =>
                            a.localeCompare(
                                b,
                                undefined,
                                {
                                    sensitivity:
                                        "base"
                                }
                            )
                    );


                tagList.innerHTML =
                    "";


                if (
                    tags.length === 0
                ) {

                    status.textContent =
                        "No archive tags found.";

                    return;

                }


                status.textContent =
                    `${tags.length} tags`;


                // ==================================================
                // Create tag buttons
                // ==================================================

                tags.forEach(
                    tag => {

                        const tagItem =
                            document.createElement(
                                "div"
                            );


                        tagItem.className =
                            "tag-item";


                        const tagName =
                            document.createElement(
                                "span"
                            );


                        tagName.textContent =
                            tag;


                        const tagCount =
                            document.createElement(
                                "span"
                            );


                        tagCount.className =
                            "tag-count";


                        tagCount.textContent =
                            `(${tagCounts[tag]})`;


                        tagItem.appendChild(
                            tagName
                        );


                        tagItem.appendChild(
                            tagCount
                        );


                        tagList.appendChild(
                            tagItem
                        );

                    }
                );


            } catch (error) {

                console.error(
                    error
                );


                status.textContent =
                    "Archive tags could not be loaded.";

            }

        }


        loadArchiveTags();

    </script>

</body>

</html>
