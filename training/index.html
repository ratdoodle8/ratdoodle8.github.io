<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>Weebie Training</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      background: #bcc8cc;
      color: #0007E6;
      overflow-x: hidden;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 10000;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #bcc8cc;
      color: #0007E6;

      font-size: 18px;
    }


    /* =========================================
       PAGE
    ========================================= */

    #page {
      width: 100%;
      max-width: 500px;
      min-height: 100svh;

      margin: 0 auto;

      display: grid;

      grid-template-rows:
        minmax(195px, 0.78fr)
        minmax(255px, 1fr)
        minmax(220px, 0.9fr);
    }


    /* =========================================
       TOP THIRD
    ========================================= */

    #topSection {
      position: relative;
      min-height: 195px;
      overflow: hidden;
    }

    h1 {
      position: absolute;

      top: 14px;
      left: 0;
      right: 0;

      z-index: 5;

      margin: 0;

      text-align: center;

      font-size: 26px;
    }


    /* LARGE / HIGH / RIGHT */

    #gif1 {
      position: absolute;

      width: 58%;
      max-width: 285px;

      right: 3%;
      top: 50px;

      object-fit: contain;

      user-select: none;
      pointer-events: none;
    }


    /* SMALL / LOW / LEFT */

    #gif2 {
      position: absolute;

      width: 30%;
      max-width: 145px;

      left: 6%;
      bottom: 0;

      object-fit: contain;

      user-select: none;
      pointer-events: none;
    }


    /* =========================================
       MIDDLE THIRD
    ========================================= */

    #middleSection {
      position: relative;
      min-height: 255px;
      overflow: visible;
    }


    /* =========================================
       WEEBIE
       LARGE / HIGH / RIGHT
    ========================================= */

    #weebieArea {
      position: absolute;

      width: 62%;
      max-width: 310px;

      right: 1%;
      top: 0;

      text-align: center;
    }

    #weebieName {
      margin: 0 0 2px;

      font-size: 19px;
      font-weight: bold;

      min-height: 23px;
    }

    #weebieImage {
      position: relative;

      width: 100%;
      aspect-ratio: 1 / 1;

      margin: 0 auto;
    }

    .weebie-layer {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;

      -webkit-mask-position: center;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-size: contain;

      mask-position: center;
      mask-repeat: no-repeat;
      mask-size: contain;

      pointer-events: none;
    }

    #pushupColor1 {
      z-index: 1;
    }

    #pushupColor2 {
      z-index: 2;
    }

    #pushupOutline {
      z-index: 3;
    }


    /* =========================================
       5000 PUSHUP PROGRESS BAR
    ========================================= */

    #progressArea {
      width: 86%;

      margin:
        -14px
        auto
        0;

      position: relative;
      z-index: 20;
    }

    #progressBar {
      position: relative;

      width: 100%;
      height: 19px;

      border: 2px solid #0007E6;

      background: white;

      overflow: hidden;
    }

    #progressFill {
      position: absolute;

      left: 0;
      top: 0;
      bottom: 0;

      width: 0%;

      background: #0007E6;
    }

    #progressText {
      position: absolute;

      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      color: black;

      font-size: 10px;
      font-weight: bold;

      pointer-events: none;
    }


    /* =========================================
       PUSHUP INFO
       SMALL / LOW / LEFT
    ========================================= */

    #pushupInfo {
      position: absolute;

      width: 31%;

      left: 6%;
      bottom: 18px;

      border: 2px solid #0007E6;

      padding: 11px 6px;

      background: #bcc8cc;

      text-align: center;
    }

    #currentPushups {
      font-size: clamp(30px, 10vw, 48px);
      font-weight: bold;
      line-height: 1;
    }

    #currentLabel {
      margin-top: 4px;

      font-size: 10px;
      font-weight: bold;
    }

    #dailyPushups {
      margin-top: 12px;

      font-size: 16px;
      font-weight: bold;
    }

    #dailyLabel {
      margin-top: 2px;

      font-size: 10px;
    }

    #lifetimePushups {
      margin-top: 12px;
      font-size: 14px;
      font-weight: bold;
    }

    #lifetimeLabel {
      margin-top: 2px;
      font-size: 9px;
      line-height: 1.25;
    }

    #status {
      min-height: 14px;

      margin-top: 5px;

      font-size: 11px;
      font-weight: bold;
    }


    /* =========================================
       BOTTOM THIRD
       BUTTON ONLY
    ========================================= */

    #bottomSection {
      position: relative;

      min-height: 240px;

      display: flex;
      align-items: stretch;
      justify-content: center;

      padding:
        8px
        14px
        max(12px, env(safe-area-inset-bottom));
    }

    #trainingButton {
      width: 100%;
      min-height: 100%;

      margin: 0;

      border: 4px solid #0007E6;
      border-radius: 28px;

      background: white;
      color: #0007E6;

      font-family: Arial, sans-serif;

      cursor: pointer;

      user-select: none;
      -webkit-user-select: none;

      touch-action: manipulation;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #trainingButton:active,
    #trainingButton.pressed {
      background: #f3f3f3;
    }

    #buttonText {
      font-size: clamp(28px, 8vw, 42px);
      font-weight: bold;
    }

    #buttonSubtext {
      margin-top: 7px;

      font-size: 14px;
      font-weight: bold;
    }


    /* =========================================
       CONFETTI
    ========================================= */

    .confetti {
      position: fixed;

      width: 9px;
      height: 14px;

      left: 50%;
      top: 50%;

      z-index: 9999;

      pointer-events: none;

      animation:
        confettiBurst
        1100ms
        ease-out
        forwards;
    }

    @keyframes confettiBurst {
      0% {
        transform:
          translate(-50%, -50%)
          rotate(0deg);

        opacity: 1;
      }

      100% {
        transform:
          translate(
            calc(-50% + var(--x)),
            calc(-50% + var(--y))
          )
          rotate(var(--r));

        opacity: 0;
      }
    }


    /* =========================================
       SMALL PHONE ADJUSTMENT
    ========================================= */

    @media (max-height: 720px) {

      #page {
        grid-template-rows:
          180px
          235px
          minmax(205px, 1fr);
      }

      #topSection {
        min-height: 180px;
      }

      #middleSection {
        min-height: 235px;
        overflow: visible;
      }

      #bottomSection {
        min-height: 205px;
        padding-top: 18px;
      }

      #gif1 {
        top: 44px;
      }

      #gif2 {
        bottom: 0;
      }

      #progressArea {
        margin-top: -18px;
        position: relative;
        z-index: 30;
      }

      #gif1 {
        width: 53%;
      }

      #weebieArea {
        width: 58%;
      }
    }
  </style>
</head>


<body>

  <div id="loading">
    Loading...
  </div>


  <div id="page">


    <!-- =====================================
         TOP THIRD
    ====================================== -->

    <section id="topSection">

      <h1>
        Weebie Training
      </h1>


      <!-- LARGE / HIGH / RIGHT -->

      <img
        id="gif1"
        src="/shared/gif1.gif"
        alt=""
        draggable="false"
      >


      <!-- SMALL / LOW / LEFT -->

      <img
        id="gif2"
        src="/shared/gif2.gif"
        alt=""
        draggable="false"
      >

    </section>



    <!-- =====================================
         MIDDLE THIRD
    ====================================== -->

    <section id="middleSection">


      <!-- SMALL / LOW / LEFT -->

      <div id="pushupInfo">

        <div id="currentPushups">
          0
        </div>

        <div id="currentLabel">
          CURRENT
        </div>


        <div id="dailyPushups">
          0
        </div>

        <div id="dailyLabel">
          PUSHUPS TODAY
        </div>


        <div id="lifetimePushups">
          0
        </div>

        <div id="lifetimeLabel">
          LIFETIME PUSHUPS
        </div>


        <div id="status"></div>

      </div>



      <!-- LARGE / HIGH / RIGHT -->

      <div id="weebieArea">

        <div id="weebieName">
        </div>


        <div id="weebieImage">

          <div
            id="pushupColor1"
            class="weebie-layer"
          ></div>

          <div
            id="pushupColor2"
            class="weebie-layer"
          ></div>

          <div
            id="pushupOutline"
            class="weebie-layer"
          ></div>

        </div>


        <!-- CURRENT / 5000 PROGRESS -->

        <div id="progressArea">

          <div id="progressBar">

            <div id="progressFill">
            </div>

            <div id="progressText">
              0 / 5,000
            </div>

          </div>

        </div>

      </div>

    </section>



    <!-- =====================================
         BOTTOM THIRD
    ====================================== -->

    <section id="bottomSection">

      <button
        id="trainingButton"
        type="button"
        aria-label="Do pushup"
      >

        <div id="buttonText">
          PUSH
        </div>

        <div id="buttonSubtext">
          Hold or tap
        </div>

      </button>

    </section>

  </div>



  <script>

    const API =
      "https://ratdoodle-accounts.ratdoodle8.workers.dev";


    const PUSHUPS_REQUIRED =
      5000;


    /* =====================================
       SAME COLORS AS ACCOUNT PAGE
    ====================================== */

    const COLORS = {

      "Teal":
        "#24B5A5",

      "Tan":
        "#C9A875",

      "Red":
        "#E04444",

      "Pink":
        "#ee89f0",

      "Blue":
        "#4A8FE7",

      "Lime Green":
        "#8FD14F",

      "White":
        "#F5F5F5",

      "Purple":
        "#ed15ff",

      "Silver":
        "#B8BEC4"

    };


    const loading =
      document.getElementById(
        "loading"
      );


    const trainingButton =
      document.getElementById(
        "trainingButton"
      );


    const currentPushupsElement =
      document.getElementById(
        "currentPushups"
      );


    const dailyPushupsElement =
      document.getElementById(
        "dailyPushups"
      );


    const lifetimePushupsElement =
      document.getElementById(
        "lifetimePushups"
      );


    const lifetimeLabelElement =
      document.getElementById(
        "lifetimeLabel"
      );


    const status =
      document.getElementById(
        "status"
      );


    const weebieName =
      document.getElementById(
        "weebieName"
      );


    const pushupColor1 =
      document.getElementById(
        "pushupColor1"
      );


    const pushupColor2 =
      document.getElementById(
        "pushupColor2"
      );


    const pushupOutline =
      document.getElementById(
        "pushupOutline"
      );


    const progressFill =
      document.getElementById(
        "progressFill"
      );


    const progressText =
      document.getElementById(
        "progressText"
      );


    let confirmedDailyPushups =
      0;


    let confirmedLifetimePushups =
      0;


    let lifetimeStartedAt =
      null;


    let pendingPushups =
      0;


    let sending =
      false;


    let loaded =
      false;


    let currentWeebie =
      null;


    let currentXP =
      0;



    /* =====================================
       AUTH
    ====================================== */

    function getSessionToken() {

      return localStorage.getItem(
        "rd_session"
      );

    }


    function authHeaders(
      includeJson = false
    ) {

      const headers = {};


      const token =
        getSessionToken();


      if (token) {

        headers[
          "Authorization"
        ] =
          "Bearer " +
          token;

      }


      if (includeJson) {

        headers[
          "Content-Type"
        ] =
          "application/json";

      }


      return headers;

    }



    /* =====================================
       PUSHUP DISPLAY
    ====================================== */

    function displayedDailyPushups() {

      return (
        confirmedDailyPushups +
        pendingPushups
      );

    }


    function formatLifetimeDate(value) {

      if (!value) {
        return "";
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return "";
      }

      return date.toLocaleDateString(
        undefined,
        {
          month: "long",
          day: "numeric",
          year: "numeric"
        }
      );

    }


    function renderPushups() {

      const total =
        displayedDailyPushups();


      /*
        CURRENT RESETS EVERY 5000.
      */

      const current =
        total %
        PUSHUPS_REQUIRED;


      currentPushupsElement.textContent =
        current.toLocaleString();


      /*
        DAILY TOTAL NEVER RESETS AT
        A 5000 MILESTONE.

        It only resets with the daily
        server reset.
      */

      dailyPushupsElement.textContent =
        total.toLocaleString();


      const lifetimeTotal =
        confirmedLifetimePushups +
        pendingPushups;


      lifetimePushupsElement.textContent =
        lifetimeTotal.toLocaleString();


      const formattedLifetimeDate =
        formatLifetimeDate(
          lifetimeStartedAt
        );


      lifetimeLabelElement.textContent =
        formattedLifetimeDate
          ? "LIFETIME PUSHUPS SINCE " +
            formattedLifetimeDate.toUpperCase()
          : "LIFETIME PUSHUPS";


      renderProgressBar();

    }



    /* =====================================
       CURRENT / 5000 BAR
    ====================================== */

    function renderProgressBar() {

      const total =
        displayedDailyPushups();


      const current =
        total %
        PUSHUPS_REQUIRED;


      const percentage =
        (
          current /
          PUSHUPS_REQUIRED
        ) *
        100;


      progressFill.style.width =
        percentage +
        "%";


      progressText.textContent =
        current.toLocaleString() +
        " / " +
        PUSHUPS_REQUIRED.toLocaleString();

    }



    /* =====================================
       WEEBIE IMAGE
    ====================================== */

    function setMask(
      element,
      url
    ) {

      element.style.webkitMaskImage =
        'url("' +
        url +
        '")';


      element.style.maskImage =
        'url("' +
        url +
        '")';

    }


    function getEyelashes() {

      if (!currentWeebie) {
        return "Yes";
      }


      /*
        Supports both the newer centralized
        stat and the legacy top-level value.
      */

      return (
        currentWeebie.eyelashes ||
        currentWeebie.stats?.eyelashes ||
        "Yes"
      );

    }



    /* =====================================
       UP POSITION

       THIS IS NOW THE PRESSED POSITION.
    ====================================== */

    function showPushupUp() {

      if (!currentWeebie) {
        return;
      }


      const primaryHex =
        COLORS[
          currentWeebie.primary_color
        ] ||
        "#F5F5F5";


      const secondaryHex =
        COLORS[
          currentWeebie.secondary_color
        ] ||
        "#F5F5F5";


      pushupColor1.style.backgroundColor =
        primaryHex;


      pushupColor2.style.backgroundColor =
        secondaryHex;


      setMask(
        pushupColor1,
        "/shared/Weebie-PushupUpColor-1.png"
      );


      setMask(
        pushupColor2,
        "/shared/Weebie-PushupUpColor-2.png"
      );


      pushupOutline.style.backgroundImage =
        'url("/shared/Weebie-Pushup-2.png")';

    }



    /* =====================================
       DOWN POSITION

       THIS IS NOW THE NORMAL /
       RELEASED POSITION.
    ====================================== */

    function showPushupDown() {

      if (!currentWeebie) {
        return;
      }


      const primaryHex =
        COLORS[
          currentWeebie.primary_color
        ] ||
        "#F5F5F5";


      const secondaryHex =
        COLORS[
          currentWeebie.secondary_color
        ] ||
        "#F5F5F5";


      pushupColor1.style.backgroundColor =
        primaryHex;


      pushupColor2.style.backgroundColor =
        secondaryHex;


      setMask(
        pushupColor1,
        "/shared/Weebie-PushupColor-1.png"
      );


      /*
        NO EYELASHES
      */

      if (
        getEyelashes() ===
        "No"
      ) {

        setMask(
          pushupColor2,
          "/shared/Weebie-PushupColor-2a.png"
        );


        pushupOutline.style.backgroundImage =
          'url("/shared/Weebie-Pushup-1a.png")';

      }


      /*
        EYELASHES
        Also used as the default.
      */

      else {

        setMask(
          pushupColor2,
          "/shared/Weebie-PushupColor-2.png"
        );


        pushupOutline.style.backgroundImage =
          'url("/shared/Weebie-Pushup-1.png")';

      }

    }



    /* =====================================
       CONFETTI
    ====================================== */

    function confettiBurst() {

      const colors = [
        "#0007E6",
        "#ff4d6d",
        "#ffd60a",
        "#00c853",
        "#9c27b0",
        "#ff7a00"
      ];


      for (
        let i = 0;
        i < 45;
        i++
      ) {

        const piece =
          document.createElement(
            "div"
          );


        piece.className =
          "confetti";


        piece.style.background =
          colors[
            Math.floor(
              Math.random() *
              colors.length
            )
          ];


        const angle =
          Math.random() *
          Math.PI *
          2;


        const distance =
          100 +
          Math.random() *
          240;


        const x =
          Math.cos(
            angle
          ) *
          distance;


        const y =
          Math.sin(
            angle
          ) *
          distance;


        piece.style.setProperty(
          "--x",
          x + "px"
        );


        piece.style.setProperty(
          "--y",
          y + "px"
        );


        piece.style.setProperty(
          "--r",
          (
            Math.random() *
            720 -
            360
          ) +
          "deg"
        );


        document.body.appendChild(
          piece
        );


        setTimeout(
          () => {

            piece.remove();

          },
          1200
        );

      }

    }



    /* =====================================
       ONE PUSHUP
    ====================================== */

    function handlePushup() {

      if (!loaded) {
        return;
      }


      const before =
        displayedDailyPushups();


      pendingPushups++;


      const after =
        before + 1;


      renderPushups();


      /*
        CELEBRATE EVERY COMPLETED
        5000 PUSHUPS.
      */

      if (
        Math.floor(
          after /
          PUSHUPS_REQUIRED
        )
        >
        Math.floor(
          before /
          PUSHUPS_REQUIRED
        )
      ) {

        confettiBurst();

      }


      if (
        pendingPushups >=
        50
      ) {

        flushPushups();

      }

    }



    /* =====================================
       SAVE PUSHUPS
    ====================================== */

    async function flushPushups() {

      if (
        sending ||
        pendingPushups <= 0
      ) {

        return;

      }


      sending =
        true;


      const amount =
        Math.min(
          pendingPushups,
          100
        );


      pendingPushups -=
        amount;


      try {

        const response =
          await fetch(
            API +
            "/training",
            {
              method:
                "POST",

              credentials:
                "include",

              headers:
                authHeaders(
                  true
                ),

              body:
                JSON.stringify(
                  {
                    taps:
                      amount
                  }
                )
            }
          );


        const data =
          await response.json();


        if (
          response.status ===
          401
        ) {

          localStorage.removeItem(
            "rd_session"
          );


          window.location.href =
            "/login/";


          return;

        }


        if (
          data.passwordResetRequired
        ) {

          pendingPushups +=
            amount;


          window.location.href =
            "/account/";


          return;

        }


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Unable to save pushups."
          );

        }


        confirmedDailyPushups =
          Number(
            data.dailyTaps ||
            0
          );


        confirmedLifetimePushups =
          Number(
            data.lifetimeTaps ||
            0
          );


        lifetimeStartedAt =
          data.lifetimeStartedAt ||
          null;


        confirmedLifetimePushups =
          Number(
            data.lifetimeTaps ||
            0
          );


        lifetimeStartedAt =
          data.lifetimeStartedAt ||
          lifetimeStartedAt;


        if (
          data.totalXP !==
          undefined
        ) {

          currentXP =
            Number(
              data.totalXP ||
              0
            );

        }


        if (
          Number(
            data.xpAwarded ||
            0
          ) >
          0
        ) {

          status.textContent =
            "+" +
            data.xpAwarded +
            " XP";


          setTimeout(
            () => {

              status.textContent =
                "";

            },
            1200
          );

        }


        renderPushups();

      }

      catch (error) {

        pendingPushups +=
          amount;


        console.error(
          error
        );


        status.textContent =
          "Saving...";


        renderPushups();

      }

      finally {

        sending =
          false;


        if (
          pendingPushups >=
          50
        ) {

          flushPushups();

        }

      }

    }



    /* =====================================
       LOAD ACCOUNT / WEEBIE
    ====================================== */

    async function loadWeebie() {

      const response =
        await fetch(
          API +
          "/account",
          {
            method:
              "GET",

            credentials:
              "include",

            headers:
              authHeaders()
          }
        );


      const data =
        await response.json();


      if (
        !data.loggedIn
      ) {

        localStorage.removeItem(
          "rd_session"
        );


        window.location.href =
          "/login/";


        return false;

      }


      if (
        data.passwordResetRequired
      ) {

        window.location.href =
          "/account/";


        return false;

      }


      if (!data.weebie) {

        window.location.href =
          "/account/";


        return false;

      }


      currentWeebie =
        data.weebie;


      weebieName.textContent =
        currentWeebie.name;


      currentXP =
        Number(
          currentWeebie.xp ||
          currentWeebie.stats?.xp ||
          0
        );


      /*
        NORMAL STATE IS NOW DOWN.
      */

      showPushupDown();


      return true;

    }



    /* =====================================
       LOAD TRAINING
    ====================================== */

    async function loadTraining() {

      try {

        const weebieReady =
          await loadWeebie();


        if (!weebieReady) {
          return;
        }


        const response =
          await fetch(
            API +
            "/training",
            {
              method:
                "GET",

              credentials:
                "include",

              headers:
                authHeaders()
            }
          );


        const data =
          await response.json();


        if (
          response.status ===
          401
        ) {

          localStorage.removeItem(
            "rd_session"
          );


          window.location.href =
            "/login/";


          return;

        }


        if (
          data.passwordResetRequired
        ) {

          window.location.href =
            "/account/";


          return;

        }


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Unable to load training."
          );

        }


        confirmedDailyPushups =
          Number(
            data.dailyTaps ||
            0
          );


        pendingPushups =
          0;


        if (
          data.totalXP !==
          undefined
        ) {

          currentXP =
            Number(
              data.totalXP ||
              0
            );

        }


        loaded =
          true;


        renderPushups();


        loading.style.display =
          "none";

      }

      catch (error) {

        console.error(
          error
        );


        loading.textContent =
          "Unable to load training.";

      }

    }



    /* =====================================
       BUTTON

       PRESS:
       WEEBIE GOES UP
       + ONE PUSHUP

       RELEASE:
       WEEBIE GOES DOWN
    ====================================== */

    function pressButton(
      event
    ) {

      if (!loaded) {
        return;
      }


      event.preventDefault();


      trainingButton.classList.add(
        "pressed"
      );


      showPushupUp();


      handlePushup();

    }


    function releaseButton() {

      trainingButton.classList.remove(
        "pressed"
      );


      showPushupDown();

    }


    trainingButton.addEventListener(
      "pointerdown",
      pressButton
    );


    trainingButton.addEventListener(
      "pointerup",
      releaseButton
    );


    trainingButton.addEventListener(
      "pointercancel",
      releaseButton
    );


    trainingButton.addEventListener(
      "pointerleave",
      releaseButton
    );


    /*
      Extra release protection so the Weebie
      cannot remain stuck in the UP pose if
      the pointer leaves the button strangely.
    */

    window.addEventListener(
      "pointerup",
      releaseButton
    );


    window.addEventListener(
      "pointercancel",
      releaseButton
    );


    window.addEventListener(
      "blur",
      releaseButton
    );



    /* =====================================
       REGULAR SAVE
    ====================================== */

    setInterval(
      () => {

        flushPushups();

      },
      1000
    );



    /* =====================================
       SAVE WHEN LEAVING
    ====================================== */

    document.addEventListener(
      "visibilitychange",
      () => {

        if (
          document.visibilityState ===
          "hidden"
        ) {

          releaseButton();

          flushPushups();

        }

      }
    );


    window.addEventListener(
      "pagehide",
      () => {

        releaseButton();

        flushPushups();

      }
    );



    /* =====================================
       START
    ====================================== */

    loadTraining();

  </script>

</body>
</html>
