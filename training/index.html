<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>Weebie Training</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      background: #bcc8cc;
      color: #0007E6;
      overflow-x: hidden;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 10000;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #bcc8cc;
      color: #0007E6;

      font-size: 18px;
    }


    /* =========================================
       PAGE
    ========================================= */

    #page {
      width: 100%;
      max-width: 500px;
      min-height: 100svh;

      margin: 0 auto;

      display: grid;

      grid-template-rows:
        minmax(225px, 0.88fr)
        minmax(255px, 1fr)
        minmax(220px, 0.9fr);
    }


    /* =========================================
       TOP THIRD
    ========================================= */

    #topSection {
      position: relative;
      min-height: 225px;
      overflow: visible;
    }

    h1 {
      position: absolute;

      top: 14px;
      left: 0;
      right: 0;

      z-index: 5;

      margin: 0;

      text-align: center;

      font-size: 26px;
    }


    /* LARGE / HIGH / RIGHT */

    #gif1 {
      position: absolute;

      width: 58%;
      max-width: 285px;

      right: 3%;
      top: 50px;

      object-fit: contain;

      user-select: none;
      pointer-events: none;
    }


    /* BURST + POWER HUD */

    #comboBars {
      position: absolute;
      width: 48%;
      max-width: 235px;
      right: 8%;
      top: 132px;
      z-index: 40;
      font-family: "Comic Sans MS", "Arial Rounded MT Bold", Arial, sans-serif;
    }

    .combo-stat-row {
      display: flex;
      gap: 6px;
      margin-bottom: 5px;
    }

    .spike-stat {
      flex: 1;
      min-width: 0;
      min-height: 48px;
      padding: 8px 7px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: white;
      color: #0007E6;
      text-align: center;
      clip-path: polygon(
        50% 0%, 58% 10%, 68% 3%, 73% 15%,
        85% 10%, 87% 23%, 100% 25%, 93% 38%,
        100% 50%, 92% 59%, 98% 73%, 85% 75%,
        82% 90%, 69% 84%, 59% 100%, 50% 90%,
        40% 100%, 31% 84%, 18% 90%, 15% 75%,
        2% 73%, 8% 59%, 0% 50%, 7% 38%,
        0% 25%, 13% 23%, 15% 10%, 27% 15%,
        32% 3%, 42% 10%
      );
    }

    .spike-number {
      font-size: 19px;
      line-height: 0.95;
      font-weight: 900;
      white-space: nowrap;
    }

    .spike-label {
      margin-top: 3px;
      font-size: 8px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: .4px;
    }

    .meter-block {
      margin-top: 4px;
    }

    .meter-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 0 2px 2px;
      font-size: 10px;
      font-weight: 900;
    }

    .combo-bar {
      position: relative;
      width: 100%;
      height: 15px;
      border: 2px solid #0007E6;
      border-radius: 8px;
      background: white;
      overflow: hidden;
    }

    .combo-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: #0007E6;
    }

    #powerTicks {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: repeating-linear-gradient(
        to right,
        transparent 0,
        transparent calc(10% - 1px),
        rgba(0,0,0,.45) calc(10% - 1px),
        rgba(0,0,0,.45) 10%
      );
    }

    /* EXTRA LIGHTWEIGHT GAME-BAR VISUALS */

    #burstBar,
    #powerBar {
      overflow: visible;
      border-width: 3px;
      box-shadow:
        2px 2px 0 #0007E6,
        -1px -1px 0 white;
    }

    #burstBar::before,
    #powerBar::before {
      content: "";
      position: absolute;
      inset: 2px;
      z-index: 3;
      pointer-events: none;
      border-radius: 999px;
      border-top: 2px solid rgba(255,255,255,.85);
    }

    #burstBar::after,
    #powerBar::after {
      content: "✦";
      position: absolute;
      right: -12px;
      top: 50%;
      z-index: 6;
      transform: translateY(-50%) rotate(12deg);
      color: #0007E6;
      background: white;
      border: 2px solid #0007E6;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      clip-path: polygon(
        50% 0%, 61% 28%, 85% 15%, 72% 39%,
        100% 50%, 72% 61%, 85% 85%, 61% 72%,
        50% 100%, 39% 72%, 15% 85%, 28% 61%,
        0% 50%, 28% 39%, 15% 15%, 39% 28%
      );
    }

    #burstFill,
    #powerFill {
      height: 100%;
      border-radius: 999px;
      overflow: hidden;
    }

    #burstFill::after,
    #powerFill::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          -45deg,
          rgba(255,255,255,.35) 0 5px,
          transparent 5px 10px
        );
      animation: barStripeSlide 500ms linear infinite;
    }

    #burstBar {
      transform: rotate(-1deg);
    }

    #powerBar {
      transform: rotate(1deg);
    }

    #burstBar .combo-fill {
      background:
        linear-gradient(
          90deg,
          #0007E6 0%,
          #5260ff 65%,
          #ffffff 100%
        );
    }

    #powerBar .combo-fill {
      background:
        linear-gradient(
          90deg,
          #0007E6 0%,
          #8c39ff 55%,
          #ff4fd8 100%
        );
    }

    #powerTicks {
      overflow: hidden;
      border-radius: 999px;
    }

    .meter-heading {
      position: relative;
      z-index: 8;
      text-shadow:
        1px 1px 0 white,
        -1px -1px 0 white,
        1px -1px 0 white,
        -1px 1px 0 white;
    }

    @keyframes barStripeSlide {
      from {
        background-position: 0 0;
      }
      to {
        background-position: 14px 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #burstFill::after,
      #powerFill::after {
        animation: none;
      }
    }


    /* VISIBILITY / POSITION FIXES ONLY */

    #gif1,
    #gif2 {
      mix-blend-mode: multiply;
    }

    /*
      Dedicated HUD strip.
      It no longer shares the GIF's absolute-positioned space,
      so the bars cannot sit behind the image.
    */
    #comboBars {
      top: auto;
      right: auto;
      left: 4%;
      bottom: 2px;
      width: 92%;
      max-width: none;
      z-index: 100;
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 10px;
      row-gap: 2px;
      align-items: end;
    }

    #comboBars .combo-stat-row {
      grid-column: 1 / -1;
      width: 52%;
      max-width: 245px;
      justify-self: end;
      margin-right: 3%;
      margin-bottom: 0;
    }

    #comboBars .meter-block {
      width: 100%;
      min-width: 0;
      margin-top: 0;
    }

    #comboBars .combo-bar {
      width: 100%;
      min-width: 0;
    }

    #weebieName {
      transform: translateY(12px);
    }

    /* SMALL / LOW / LEFT */

    #gif2 {
      position: absolute;

      width: 30%;
      max-width: 145px;

      left: 6%;
      bottom: 0;

      object-fit: contain;

      user-select: none;
      pointer-events: none;
    }


    /* =========================================
       MIDDLE THIRD
    ========================================= */

    #middleSection {
      position: relative;
      min-height: 255px;
      overflow: visible;
    }


    /* =========================================
       WEEBIE
       LARGE / HIGH / RIGHT
    ========================================= */

    #weebieArea {
      position: absolute;

      width: 62%;
      max-width: 310px;

      right: 1%;
      top: 0;

      text-align: center;
    }

    #weebieName {
      margin: 0 0 2px;

      font-size: 19px;
      font-weight: bold;

      min-height: 23px;
    }

    #weebieImage {
      position: relative;

      width: 100%;
      aspect-ratio: 1 / 1;

      margin: 0 auto;
    }

    .weebie-layer {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;

      -webkit-mask-position: center;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-size: contain;

      mask-position: center;
      mask-repeat: no-repeat;
      mask-size: contain;

      pointer-events: none;
    }

    #pushupColor1 {
      z-index: 1;
    }

    #pushupColor2 {
      z-index: 2;
    }

    #pushupOutline {
      z-index: 3;
    }


    /* =========================================
       5000 PUSHUP PROGRESS BAR
    ========================================= */

    #progressArea {
      width: 86%;

      margin:
        -14px
        auto
        0;

      position: relative;
      z-index: 20;
    }

    #progressBar {
      position: relative;

      width: 100%;
      height: 19px;

      border: 2px solid #0007E6;

      background: white;

      overflow: hidden;
    }

    #progressFill {
      position: absolute;

      left: 0;
      top: 0;
      bottom: 0;

      width: 0%;

      background: #0007E6;
    }

    #progressText {
      position: absolute;

      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      color: black;

      font-size: 10px;
      font-weight: bold;

      pointer-events: none;
    }


    /* =========================================
       PUSHUP INFO
       SMALL / LOW / LEFT
    ========================================= */

    #pushupInfo {
      position: absolute;

      width: 31%;

      left: 6%;
      bottom: 18px;

      border: 2px solid #0007E6;

      padding: 11px 6px;

      background: #bcc8cc;

      text-align: center;
    }

    #currentPushups {
      font-size: clamp(30px, 10vw, 48px);
      font-weight: bold;
      line-height: 1;
    }

    #currentLabel {
      margin-top: 4px;

      font-size: 10px;
      font-weight: bold;
    }

    #dailyPushups {
      margin-top: 12px;

      font-size: 16px;
      font-weight: bold;
    }

    #dailyLabel {
      margin-top: 2px;

      font-size: 10px;
    }

    #lifetimePushups {
      margin-top: 12px;
      font-size: 14px;
      font-weight: bold;
    }

    #lifetimeLabel {
      margin-top: 2px;
      font-size: 9px;
      line-height: 1.25;
    }

    #status {
      min-height: 14px;

      margin-top: 5px;

      font-size: 11px;
      font-weight: bold;
    }


    /* =========================================
       BOTTOM THIRD
       BUTTON ONLY
    ========================================= */

    #bottomSection {
      position: relative;

      min-height: 240px;

      display: flex;
      align-items: stretch;
      justify-content: center;

      padding:
        8px
        14px
        max(12px, env(safe-area-inset-bottom));
    }

    #trainingButton {
      width: 100%;
      min-height: 100%;

      margin: 0;

      border: 4px solid #0007E6;
      border-radius: 28px;

      background: white;
      color: #0007E6;

      font-family: Arial, sans-serif;

      cursor: pointer;

      user-select: none;
      -webkit-user-select: none;

      touch-action: manipulation;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #trainingButton:active,
    #trainingButton.pressed {
      background: #f3f3f3;
    }

    #buttonText {
      font-size: clamp(28px, 8vw, 42px);
      font-weight: bold;
    }

    #buttonSubtext {
      margin-top: 7px;

      font-size: 14px;
      font-weight: bold;
    }


    /* =========================================
       CONFETTI
    ========================================= */

    .confetti {
      position: fixed;

      width: 9px;
      height: 14px;

      left: 50%;
      top: 50%;

      z-index: 9999;

      pointer-events: none;

      animation:
        confettiBurst
        1100ms
        ease-out
        forwards;
    }

    @keyframes confettiBurst {
      0% {
        transform:
          translate(-50%, -50%)
          rotate(0deg);

        opacity: 1;
      }

      100% {
        transform:
          translate(
            calc(-50% + var(--x)),
            calc(-50% + var(--y))
          )
          rotate(var(--r));

        opacity: 0;
      }
    }


    /* =========================================
       SMALL PHONE ADJUSTMENT
    ========================================= */

    @media (max-height: 720px) {

      #page {
        grid-template-rows:
          215px
          220px
          minmax(205px, 1fr);
      }

      #topSection {
        min-height: 215px;
        overflow: visible;
      }

      #middleSection {
        min-height: 220px;
        overflow: visible;
      }

      #bottomSection {
        min-height: 205px;
        padding-top: 18px;
      }

      #gif1 {
        top: 44px;
      }

      #gif2 {
        bottom: 0;
      }

      #progressArea {
        margin-top: -18px;
        position: relative;
        z-index: 30;
      }

      #gif1 {
        width: 53%;
      }

      #comboBars {
        left: 3%;
        bottom: 2px;
        width: 94%;
        grid-template-columns: 1fr 1fr;
        column-gap: 8px;
      }

      #comboBars .combo-stat-row {
        width: 50%;
        margin-right: 2%;
      }

      .spike-stat {
        min-height: 44px;
        padding: 7px 5px;
      }

      .spike-number {
        font-size: 17px;
      }

      #weebieArea {
        width: 58%;
      }
    }
  
    /* REQUESTED POSITION / SIZE TWEAKS */
    #pushupInfo { transform: translateY(10px); }
    #weebieImage {
      width: 106%;
      margin-left: -3%;
      transform: translateY(-8px);
      overflow: visible;
    }
    #weebieName {
      transform: translateY(17px);
      position: relative;
      z-index: 35;
    }
    #comboBars .meter-block { transform: translateY(7px); }
    #comboBars .combo-stat-row {
      width: 58%;
      max-width: 275px;
      transform: translateY(-5px);
    }
    #gif2 {
      width: 42%;
      max-width: 205px;
      left: 1%;
      bottom: 10px;
      z-index: 6;
    }
    #gif1 { z-index: 7; }
    #progressBar { overflow: visible; }
    #progressFill { overflow: hidden; }
    #xpTicks {
      position:absolute; inset:0; z-index:4; pointer-events:none;
      background:linear-gradient(to right,
        transparent 19.6%,rgba(0,0,0,.55) 19.6%,rgba(0,0,0,.55) 20.4%,transparent 20.4%,
        transparent 39.6%,rgba(0,0,0,.55) 39.6%,rgba(0,0,0,.55) 40.4%,transparent 40.4%,
        transparent 59.6%,rgba(0,0,0,.55) 59.6%,rgba(0,0,0,.55) 60.4%,transparent 60.4%,
        transparent 79.6%,rgba(0,0,0,.55) 79.6%,rgba(0,0,0,.55) 80.4%,transparent 80.4%);
    }
    #progressText {
      z-index:5;
      font-family:"Comic Sans MS","Arial Rounded MT Bold",Arial,sans-serif;
      text-shadow:1px 1px 0 white,-1px -1px 0 white,1px -1px 0 white,-1px 1px 0 white;
    }
    #middleSection,#weebieArea { overflow:visible; }


    /* RIGID HIGH-CONTRAST LIVE EDGE FOR BURST + POWER */
    #burstFill,
    #powerFill {
      position: relative;
      overflow: visible;
    }

    #burstFill::after,
    #powerFill::after {
      content: "";
      position: absolute;
      top: -3px;
      right: -2px;
      width: 5px;
      height: calc(100% + 6px);
      background: #111;
      border-left: 1px solid #fff;
      border-right: 1px solid #fff;
      box-shadow: 1px 0 0 #0007E6;
      z-index: 20;
      pointer-events: none;
    }

    #burstFill[style*="width: 0"],
    #powerFill[style*="width: 0"] {
      overflow: hidden;
    }


    /* ===== FINAL REQUESTED OVERRIDES ===== */

    /* BURST: same fill appearance as POWER.
       The filled portion itself has a clean, rigid endpoint. */
    #burstBar .combo-fill,
    #powerBar .combo-fill {
      background: linear-gradient(
        90deg,
        #0007E6 0%,
        #8c39ff 55%,
        #ff4fd8 100%
      ) !important;
      border-radius: 999px 0 0 999px !important;
      overflow: hidden !important;
    }

    /* Remove moving stripes / artificial edge graphics.
       Width itself is now the exact hard edge. */
    #burstFill::after,
    #powerFill::after {
      display: none !important;
      content: none !important;
    }

    /* Make Weebie clearly larger without resizing its surrounding layout. */
    #weebieImage {
      width: 120% !important;
      margin-left: -10% !important;
      transform: translateY(-14px) !important;
      overflow: visible !important;
    }

    /* Move ONLY the Weebie name farther down. */
    #weebieName {
      transform: translateY(31px) !important;
      position: relative;
      z-index: 40;
    }

    /* XP reward visual at the physical end of the existing 5K bar. */
    #progressArea {
      overflow: visible !important;
    }

    #progressBar {
      overflow: visible !important;
    }

    #progressFill {
      overflow: hidden !important;
    }

    #xpReward {
      position: absolute;
      right: -28px;
      top: 50%;
      width: 48px;
      height: 48px;
      transform: translateY(-50%) rotate(6deg);
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      color: #0007E6;
      font-family: "Comic Sans MS", "Arial Rounded MT Bold", Arial, sans-serif;
      font-size: 13px;
      font-weight: 900;
      line-height: 1;
      text-align: center;
      clip-path: polygon(
        50% 0%, 59% 16%, 72% 4%, 76% 22%,
        92% 14%, 87% 33%, 100% 41%, 83% 50%,
        100% 60%, 84% 68%, 92% 86%, 75% 79%,
        71% 97%, 59% 85%, 50% 100%, 41% 85%,
        28% 97%, 25% 79%, 8% 86%, 16% 68%,
        0% 60%, 17% 50%, 0% 41%, 13% 33%,
        8% 14%, 24% 22%, 28% 4%, 41% 16%
      );
      filter: drop-shadow(1px 1px 0 #0007E6);
      pointer-events: none;
    }

    /* Bottom button slightly smaller; no other element is resized by this. */
    #trainingButton {
      width: 94% !important;
      min-height: 90% !important;
      align-self: center !important;
    }

    @media (max-width: 420px) {
      #weebieImage {
        width: 118% !important;
        margin-left: -9% !important;
      }

      #xpReward {
        right: -25px;
        width: 44px;
        height: 44px;
        font-size: 12px;
      }

      #trainingButton {
        width: 94% !important;
        min-height: 88% !important;
      }
    }


/* ===== EXACT POSITION/SIZE CHANGES ===== */

/* Move ONLY the top edge of the bottom button down ~70px.
   Bottom stays where it was, so nothing else reflows. */
#trainingButton {
  transform: translateY(70px) !important;
  height: calc(100% - 70px) !important;
  min-height: 0 !important;
}

/* Move ONLY the pushup-stat text block down 100px. */
#pushupInfo {
  transform: translateY(110px) !important;
}

/* Burst + Power: identical dimensions and chunkier. */
#burstBar,
#powerBar {
  height: 22px !important;
  min-height: 22px !important;
}

#burstFill,
#powerFill {
  height: 100% !important;
  border-radius: 999px 0 0 999px !important;
}

/* Pebble: another ~10% larger, overlap explicitly allowed. */
#weebieImage {
  width: 132% !important;
  margin-left: -16% !important;
  transform: translateY(-14px) !important;
  overflow: visible !important;
}

/* Combo + multiplier bubbles: roughly DOUBLE height. */
#comboBars .spike-stat {
  min-height: 88px !important;
  height: 88px !important;
  padding: 10px 7px !important;
  box-sizing: border-box !important;
}

#comboBars .spike-number {
  font-size: 22px !important;
  line-height: 1 !important;
}

#comboBars .combo-stat-row {
  align-items: center !important;
}


/* ===== LATEST REQUESTED VISUAL CHANGES ===== */

/* Left pushup stats block: solid background. */
#pushupInfo {
  background: #bcc8cc !important;
  opacity: 1 !important;
}

/* Weebie name: moved above left stats block and made HUGE.
   Absolute positioning prevents it from moving anything else. */
#weebieName {
  position: absolute !important;
  left: 4% !important;
  top: 2px !important;
  width: 48% !important;
  margin: 0 !important;
  transform: none !important;
  z-index: 80 !important;
  font-family: "Comic Sans MS", "Arial Rounded MT Bold", Arial, sans-serif !important;
  font-size: clamp(38px, 11vw, 62px) !important;
  line-height: .88 !important;
  font-weight: 900 !important;
  letter-spacing: -2px !important;
  text-align: left !important;
  color: #0007E6 !important;
  text-shadow:
    2px 2px 0 white,
    -2px -2px 0 white,
    2px -2px 0 white,
    -2px 2px 0 white !important;
  pointer-events: none !important;
}

/* Both bars: narrower and substantially taller, still identical. */
#comboBars .meter-block {
  width: 82% !important;
  justify-self: center !important;
}

#burstBar,
#powerBar {
  width: 100% !important;
  height: 30px !important;
  min-height: 30px !important;
}

/* Bubbles: same position/shape, but taller. */
#comboBars .spike-stat {
  min-height: 108px !important;
  height: 108px !important;
}

/* Bubble text only: bigger, rounder, more cartoon-like. */
#comboBars .spike-label {
  font-family: "Comic Sans MS", "Arial Rounded MT Bold", Arial, sans-serif !important;
  font-size: 15px !important;
  line-height: 1 !important;
  font-weight: 900 !important;
  letter-spacing: .8px !important;
  transform: rotate(-2deg);
}

#comboBars .spike-number {
  font-family: "Comic Sans MS", "Arial Rounded MT Bold", Arial, sans-serif !important;
  font-size: 30px !important;
  line-height: .95 !important;

        "progressFill"
      );


    const progressText =
      document.getElementById(
        "progressText"
      );


    let confirmedDailyPushups =
      0;


    let confirmedLifetimePushups =
      0;


    let lifetimeStartedAt =
      null;


    let pendingPushups =
      0;

    let multiplierRemainder =
      0;


    let sending =
      false;


    let loaded =
      false;


    let currentWeebie =
      null;


    let currentXP =
      0;



    /* =====================================
       AUTH
    ====================================== */

    function getSessionToken() {

      return localStorage.getItem(
        "rd_session"
      );

    }


    function authHeaders(
      includeJson = false
    ) {

      const headers = {};


      const token =
        getSessionToken();


      if (token) {

        headers[
          "Authorization"
        ] =
          "Bearer " +
          token;

      }


      if (includeJson) {

        headers[
          "Content-Type"
        ] =
          "application/json";

      }


      return headers;

    }



    /* =====================================
       PUSHUP DISPLAY
    ====================================== */

    function displayedDailyPushups() {

      return (
        confirmedDailyPushups +
        pendingPushups
      );

    }


    function formatLifetimeDate(value) {

      if (!value) {
        return "";
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return "";
      }

      return date.toLocaleDateString(
        undefined,
        {
          month: "long",
          day: "numeric",
          year: "numeric"
        }
      );

    }


    function renderPushups() {

      const total =
        displayedDailyPushups();


      /*
        CURRENT RESETS EVERY 5000.
      */

      const current =
        total %
        PUSHUPS_REQUIRED;


      currentPushupsElement.textContent =
        current.toLocaleString();


      /*
        DAILY TOTAL NEVER RESETS AT
        A 5000 MILESTONE.

        It only resets with the daily
        server reset.
      */

      dailyPushupsElement.textContent =
        total.toLocaleString();


      const lifetimeTotal =
        confirmedLifetimePushups +
        pendingPushups;


      lifetimePushupsElement.textContent =
        lifetimeTotal.toLocaleString();


      const formattedLifetimeDate =
        formatLifetimeDate(
          lifetimeStartedAt
        );


      lifetimeLabelElement.textContent =
        formattedLifetimeDate
          ? "LIFETIME PUSHUPS SINCE " +
            formattedLifetimeDate.toUpperCase()
          : "LIFETIME PUSHUPS";


      renderProgressBar();

    }



    /* =====================================
       CURRENT / 5000 BAR
    ====================================== */

    function renderProgressBar() {

      const total =
        displayedDailyPushups();


      const current =
        total %
        PUSHUPS_REQUIRED;


      const percentage =
        (
          current /
          PUSHUPS_REQUIRED
        ) *
        100;


      progressFill.style.width =
        percentage +
        "%";


      progressText.textContent =
        current.toLocaleString() +
        " / " +
        PUSHUPS_REQUIRED.toLocaleString();

    }



    /* =====================================
       WEEBIE IMAGE
    ====================================== */

    function setMask(
      element,
      url
    ) {

      element.style.webkitMaskImage =
        'url("' +
        url +
        '")';


      element.style.maskImage =
        'url("' +
        url +
        '")';

    }


    function getEyelashes() {

      if (!currentWeebie) {
        return "Yes";
      }


      /*
        Supports both the newer centralized
        stat and the legacy top-level value.
      */

      return (
        currentWeebie.eyelashes ||
        currentWeebie.stats?.eyelashes ||
        "Yes"
      );

    }



    /* =====================================
       UP POSITION

       THIS IS NOW THE PRESSED POSITION.
    ====================================== */

    function showPushupUp() {

      if (!currentWeebie) {
        return;
      }


      const primaryHex =
        COLORS[
          currentWeebie.primary_color
        ] ||
        "#F5F5F5";


      const secondaryHex =
        COLORS[
          currentWeebie.secondary_color
        ] ||
        "#F5F5F5";


      pushupColor1.style.backgroundColor =
        primaryHex;


      pushupColor2.style.backgroundColor =
        secondaryHex;


      setMask(
        pushupColor1,
        "/shared/Weebie-PushupUpColor-1.png"
      );


      setMask(
        pushupColor2,
        "/shared/Weebie-PushupUpColor-2.png"
      );


      pushupOutline.style.backgroundImage =
        'url("/shared/Weebie-Pushup-2.png")';

    }



    /* =====================================
       DOWN POSITION

       THIS IS NOW THE NORMAL /
       RELEASED POSITION.
    ====================================== */

    function showPushupDown() {

      if (!currentWeebie) {
        return;
      }


      const primaryHex =
        COLORS[
          currentWeebie.primary_color
        ] ||
        "#F5F5F5";


      const secondaryHex =
        COLORS[
          currentWeebie.secondary_color
        ] ||
        "#F5F5F5";


      pushupColor1.style.backgroundColor =
        primaryHex;


      pushupColor2.style.backgroundColor =
        secondaryHex;


      setMask(
        pushupColor1,
        "/shared/Weebie-PushupColor-1.png"
      );


      /*
        NO EYELASHES
      */

      if (
        getEyelashes() ===
        "No"
      ) {

        setMask(
          pushupColor2,
          "/shared/Weebie-PushupColor-2a.png"
        );


        pushupOutline.style.backgroundImage =
          'url("/shared/Weebie-Pushup-1a.png")';

      }


      /*
        EYELASHES
        Also used as the default.
      */

      else {

        setMask(
          pushupColor2,
          "/shared/Weebie-PushupColor-2.png"
        );


        pushupOutline.style.backgroundImage =
          'url("/shared/Weebie-Pushup-1.png")';

      }

    }



    /* =====================================
       CONFETTI
    ====================================== */

    function confettiBurst() {

      const colors = [
        "#0007E6",
        "#ff4d6d",
        "#ffd60a",
        "#00c853",
        "#9c27b0",
        "#ff7a00"
      ];


      for (
        let i = 0;
        i < 45;
        i++
      ) {

        const piece =
          document.createElement(
            "div"
          );


        piece.className =
          "confetti";


        piece.style.background =
          colors[
            Math.floor(
              Math.random() *
              colors.length
            )
          ];


        const angle =
          Math.random() *
          Math.PI *
          2;


        const distance =
          100 +
          Math.random() *
          240;


        const x =
          Math.cos(
            angle
          ) *
          distance;


        const y =
          Math.sin(
            angle
          ) *
          distance;


        piece.style.setProperty(
          "--x",
          x + "px"
        );


        piece.style.setProperty(
          "--y",
          y + "px"
        );


        piece.style.setProperty(
          "--r",
          (
            Math.random() *
            720 -
            360
          ) +
          "deg"
        );


        document.body.appendChild(
          piece
        );


        setTimeout(
          () => {

            piece.remove();

          },
          1200
        );

      }

    }



    /* =====================================
       BURST / COMBO / POWER
    ====================================== */

    function getPower() {

      return Math.min(
        100,
        Math.floor(combo / 10)
      );

    }


    function getMultiplier() {

      return 1 +
        (
          getPower() /
          50
        );

    }


    function renderPowerBar() {

      const power =
        getPower();

      const multiplier =
        getMultiplier();

      powerFill.style.width =
        power + "%";

      powerNumber.textContent =
        power + " / 100";

      multiplierBubble.textContent =
        multiplier.toFixed(2) +
        "x";

      comboNumber.textContent =
        combo.toLocaleString();


      updateComboPowerEffects();
    }


    function breakCombo() {

      combo = 0;
      burstActive = false;
      burstStartedAt = 0;

      burstFill.style.width =
        "0%";

      burstNumber.textContent =
        "0%";

      renderPowerBar();

    }


    function animateBurst(now) {

      if (!burstActive) {
        burstAnimationFrame = null;
        return;
      }

      const elapsed =
        now - burstStartedAt;

      const remaining =
        Math.max(
          0,
          1 -
          (
            elapsed /
            BURST_DURATION_MS
          )
        );

      const burstPercent =
        Math.ceil(
          remaining * 100
        );

      burstFill.style.width =
        (remaining * 100) +
        "%";

      burstNumber.textContent =
        burstPercent + "%";

      if (remaining <= 0) {
        breakCombo();
        burstAnimationFrame = null;
        return;
      }

      burstAnimationFrame =
        requestAnimationFrame(
          animateBurst
        );

    }



    function updateComboPowerEffects() {
      const comboStrength = Math.min(1, getPower() / 100);
      const power = getPower();
      const powerStrength = power / 100;

      /* Gradually darken/red-shift BOTH bubbles and their numbers. */
      const bubbleR = Math.round(255 - 45 * comboStrength);
      const bubbleG = Math.round(255 - 220 * comboStrength);
      const bubbleB = Math.round(255 - 225 * comboStrength);
      const textR = Math.round(20 + 215 * comboStrength);
      const textG = Math.round(7 - 5 * comboStrength);
      const textB = Math.round(230 - 220 * comboStrength);

      document.querySelectorAll("#comboBars .spike-stat").forEach((el) => {
        el.style.backgroundColor = `rgb(${bubbleR},${bubbleG},${bubbleB})`;
        el.style.filter = `saturate(${1 + comboStrength * 1.7}) contrast(${1 + comboStrength * .25})`;
      });

      document.querySelectorAll("#comboBars .spike-number").forEach((el) => {
        el.style.color = `rgb(${textR},${textG},${textB})`;
      });

      const powerBlock = document.querySelector("#powerBar")?.closest(".meter-block");
      if (powerBlock) {
        powerBlock.style.setProperty("--ps10", `${(.33 + powerStrength * 3.89).toFixed(2)}px`);
        powerBlock.classList.toggle("power-shaking", power > 0);
      }
    }

    function triggerComboPowerShake() {
      const page = document.getElementById("page");
      if (!page) return;

      const strength = Math.min(1, combo / 200);
      page.style.setProperty("--sx10", `${(1.1 + strength * 5).toFixed(2)}px`);
      page.style.setProperty("--sy10", `${(.67 + strength * 3.33).toFixed(2)}px`);
      page.style.setProperty("--sr10", `${(.17 + strength * 1.11).toFixed(2)}deg`);
      page.style.setProperty("--st10", `${Math.round(450 + strength * 540)}ms`);

      page.classList.remove("combo-power-hit");
      void page.offsetWidth;
      page.classList.add("combo-power-hit");
    }


    function registerComboTap() {

      const now =
        performance.now();

      if (
        burstActive &&
        (
          now - burstStartedAt
        ) <
        BURST_DURATION_MS
      ) {
        combo++;
      }

      else {
        combo = 1;
      }

      updateComboPowerEffects();
      triggerComboPowerShake();

      burstStartedAt =
        now;

      burstActive =
        true;

      burstFill.style.width =
        "100%";

      burstNumber.textContent =
        "100%";

      renderPowerBar();

      if (
        burstAnimationFrame === null
      ) {
        burstAnimationFrame =
          requestAnimationFrame(
            animateBurst
          );
      }

    }


    /* =====================================
       ONE PUSHUP
    ====================================== */



    function triggerSubtleFovStretch() {
      const area = document.getElementById("weebieArea");
      if (!area) return;

      const strength = Math.min(1, combo / 500);
      area.style.setProperty("--fov-x", (1.002 + strength * 0.010).toFixed(4));
      area.style.setProperty("--fov-y", (0.998 - strength * 0.006).toFixed(4));
      area.style.setProperty("--fov-time", Math.round(180 + strength * 80) + "ms");

      area.classList.remove("fov-hit");
      void area.offsetWidth;
      area.classList.add("fov-hit");
    }

    function triggerWeebieCrazyShake() {
      const art = document.getElementById("weebieImage");
      if (!art) return;
      art.classList.remove("weebie-crazy-hit");
      void art.offsetWidth;
      art.classList.add("weebie-crazy-hit");
    }

    function handlePushup() {

      if (!loaded) {
        return;
      }


      const before =
        displayedDailyPushups();


      registerComboTap();
      triggerWeebieCrazyShake();
      triggerSubtleFovStretch();

      /*
        Multiplier now affects ACTUAL pushups.
        Fractional bonus is accumulated until it becomes
        a whole pushup, so the server still receives integers.
      */
      const pushupValue =
        getMultiplier() +
        multiplierRemainder;

      const pushupsEarned =
        Math.floor(pushupValue);

      multiplierRemainder =
        pushupValue -
        pushupsEarned;

      pendingPushups +=
        pushupsEarned;


      const after =
        before +
        pushupsEarned;


      renderPushups();


      /*
        CELEBRATE EVERY COMPLETED
        5000 PUSHUPS.
      */

      if (
        Math.floor(
          after /
          PUSHUPS_REQUIRED
        )
        >
        Math.floor(
          before /
          PUSHUPS_REQUIRED
        )
      ) {

        confettiBurst();

      }


      if (
        pendingPushups >=
        50
      ) {

        flushPushups();

      }

    }



    /* =====================================
       SAVE PUSHUPS
    ====================================== */

    async function flushPushups() {

      if (
        sending ||
        pendingPushups <= 0
      ) {

        return;

      }


      sending =
        true;


      const amount =
        Math.min(
          pendingPushups,
          100
        );


      pendingPushups -=
        amount;


      try {

        const response =
          await fetch(
            API +
            "/training",
            {
              method:
                "POST",

              credentials:
                "include",

              headers:
                authHeaders(
                  true
                ),

              body:
                JSON.stringify(
                  {
                    taps:
                      amount
                  }
                )
            }
          );


        const data =
          await response.json();


        if (
          response.status ===
          401
        ) {

          localStorage.removeItem(
            "rd_session"
          );


          window.location.href =
            "/login/";


          return;

        }


        if (
          data.passwordResetRequired
        ) {

          pendingPushups +=
            amount;


          window.location.href =
            "/account/";


          return;

        }


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Unable to save pushups."
          );

        }


        confirmedDailyPushups =
          Number(
            data.dailyTaps ||
            0
          );


        confirmedLifetimePushups =
          Number(
            data.lifetimeTaps ||
            0
          );


        lifetimeStartedAt =
          data.lifetimeStartedAt ||
          null;


        confirmedLifetimePushups =
          Number(
            data.lifetimeTaps ||
            0
          );


        lifetimeStartedAt =
          data.lifetimeStartedAt ||
          lifetimeStartedAt;


        if (
          data.totalXP !==
          undefined
        ) {

          currentXP =
            Number(
              data.totalXP ||
              0
            );

        }


        if (
          Number(
            data.xpAwarded ||
            0
          ) >
          0
        ) {

          status.textContent =
            "+" +
            data.xpAwarded +
            " XP";


          setTimeout(
            () => {

              status.textContent =
                "";

            },
            1200
          );

        }


        renderPushups();

      }

      catch (error) {

        pendingPushups +=
          amount;


        console.error(
          error
        );


        status.textContent =
          "Saving...";


        renderPushups();

      }

      finally {

        sending =
          false;


        if (
          pendingPushups >=
          50
        ) {

          flushPushups();

        }

      }

    }



    /* =====================================
       LOAD ACCOUNT / WEEBIE
    ====================================== */

    async function loadWeebie() {

      const response =
        await fetch(
          API +
          "/account",
          {
            method:
              "GET",

            credentials:
              "include",

            headers:
              authHeaders()
          }
        );


      const data =
        await response.json();


      if (
        !data.loggedIn
      ) {

        localStorage.removeItem(
          "rd_session"
        );


        window.location.href =
          "/login/";


        return false;

      }


      if (
        data.passwordResetRequired
      ) {

        window.location.href =
          "/account/";


        return false;

      }


      if (!data.weebie) {

        window.location.href =
          "/account/";


        return false;

      }


      currentWeebie =
        data.weebie;


      weebieName.textContent =
        currentWeebie.name;


      currentXP =
        Number(
          currentWeebie.xp ||
          currentWeebie.stats?.xp ||
          0
        );


      /*
        NORMAL STATE IS NOW DOWN.
      */

      showPushupDown();


      return true;

    }



    /* =====================================
       LOAD TRAINING
    ====================================== */

    async function loadTraining() {

      try {

        const weebieReady =
          await loadWeebie();


        if (!weebieReady) {
          return;
        }


        const response =
          await fetch(
            API +
            "/training",
            {
              method:
                "GET",

              credentials:
                "include",

              headers:
                authHeaders()
            }
          );


        const data =
          await response.json();


        if (
          response.status ===
          401
        ) {

          localStorage.removeItem(
            "rd_session"
          );


          window.location.href =
            "/login/";


          return;

        }


        if (
          data.passwordResetRequired
        ) {

          window.location.href =
            "/account/";


          return;

        }


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Unable to load training."
          );

        }


        confirmedDailyPushups =
          Number(
            data.dailyTaps ||
            0
          );


        pendingPushups =
          0;


        if (
          data.totalXP !==
          undefined
        ) {

          currentXP =
            Number(
              data.totalXP ||
              0
            );

        }


        loaded =
          true;


        renderPushups();


        loading.style.display =
          "none";

      }

      catch (error) {

        console.error(
          error
        );


        loading.textContent =
          "Unable to load training.";

      }

    }



    /* =====================================
       BUTTON

       PRESS:
       WEEBIE GOES UP
       + ONE PUSHUP

       RELEASE:
       WEEBIE GOES DOWN
    ====================================== */

    function pressButton(
      event
    ) {

      if (!loaded) {
        return;
      }


      event.preventDefault();


      trainingButton.classList.add(
        "pressed"
      );


      showPushupUp();


      handlePushup();

    }


    function releaseButton() {

      trainingButton.classList.remove(
        "pressed"
      );


      showPushupDown();

    }


    trainingButton.addEventListener(
      "pointerdown",
      pressButton
    );


    trainingButton.addEventListener(
      "pointerup",
      releaseButton
    );


    trainingButton.addEventListener(
      "pointercancel",
      releaseButton
    );


    trainingButton.addEventListener(
      "pointerleave",
      releaseButton
    );


    /*
      Extra release protection so the Weebie
      cannot remain stuck in the UP pose if
      the pointer leaves the button strangely.
    */

    window.addEventListener(
      "pointerup",
      releaseButton
    );


    window.addEventListener(
      "pointercancel",
      releaseButton
    );


    window.addEventListener(
      "blur",
      releaseButton
    );



    /* =====================================
       REGULAR SAVE
    ====================================== */

    setInterval(
      () => {

        flushPushups();

      },
      1000
    );



    /* =====================================
       SAVE WHEN LEAVING
    ====================================== */

    document.addEventListener(
      "visibilitychange",
      () => {

        if (
          document.visibilityState ===
          "hidden"
        ) {

          releaseButton();

          flushPushups();

        }

      }
    );


    window.addEventListener(
      "pagehide",
      () => {

        releaseButton();

        flushPushups();

      }
    );



    /* =====================================
       START
    ====================================== */

    renderPowerBar();
    breakCombo();
    loadTraining();

  
    function pinWeebieNameToFarLeft() {
      const name = document.getElementById("weebieName");
      const box = document.getElementById("pushupInfo");
      if (!name || !box) return;
      const r = box.getBoundingClientRect();
      const h = name.getBoundingClientRect().height;
      name.style.top = Math.max(0, r.top - h - 2) + "px";
      name.style.left = "0px";
    }

    /* reference layout controls Weebie name position */
    /* dynamic Weebie-name resize pin disabled */
    /* dynamic Weebie-name scroll pin disabled */

</script>
