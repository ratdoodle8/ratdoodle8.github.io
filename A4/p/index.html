<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Character Archive</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #bcc8cc;
            color: #0007E6;
            font-family: Arial, sans-serif;
            text-align: center;

            margin: 0;
            padding: 30px 10px;
        }

        h1,
        h2,
        p {
            color: #0007E6;
        }


        /* ============================================= */
        /* ARCHIVE DESCRIPTION                           */
        /* ============================================= */

        .archive-description {
            width: 90%;
            max-width: 400px;

            margin: 10px auto 30px;

            line-height: 1.5;
        }


        /* ============================================= */
        /* 3 COLUMN IMAGE GRID                          */
        /* ============================================= */

        #archive-images {
            width: 100%;
            max-width: 400px;

            margin: 30px auto;

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 8px;

            align-items: start;
        }


        /* ============================================= */
        /* EACH ARCHIVE ENTRY                           */
        /* ============================================= */

        .image-entry {
            width: 100%;
            min-width: 0;

            margin: 0;
            padding: 0;
        }

        .image-title {
            font-size: 13px;

            margin: 0 0 5px;

            overflow-wrap: anywhere;
        }

        .image-paragraph {
            font-size: 11px;

            margin: 0 0 6px;

            overflow-wrap: anywhere;
        }


        /* ============================================= */
        /* GRID IMAGE                                   */
        /* ============================================= */

        .archive-image {
            width: 100% !important;
            max-width: 300px !important;

            aspect-ratio: 1 / 1;

            height: auto !important;

            object-fit: cover;
            object-position: center;

            display: block;

            margin: 0 auto;

            border-radius: 7px;

            cursor: pointer;
        }

        .archive-image:hover {
            opacity: 0.9;
        }


        /* ============================================= */
        /* BACK BUTTON                                  */
        /* ============================================= */

        .back-button {
            display: inline-block;

            background-color: white;
            color: #0007E6;

            text-decoration: none;

            padding: 14px 24px;

            margin: 30px auto;

            border-radius: 25px;
        }

        .back-button:hover {
            transform: scale(1.05);
        }


        /* ============================================= */
        /* IMAGE OVERLAY                                */
        /* ============================================= */

        #image-overlay {
            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.75);

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            z-index: 9999;

            overflow-y: auto;
        }

        #image-overlay.open {
            display: flex;
        }


        /* ============================================= */
        /* OVERLAY BOX                                  */
        /* ============================================= */

        .overlay-box {
            position: relative;

            width: min(900px, 100%);

            max-height: calc(100vh - 40px);

            overflow-y: auto;

            background-color: #bcc8cc;

            padding: 22px;

            border-radius: 10px;

            text-align: center;
        }


        /* ============================================= */
        /* CLOSE BUTTON                                 */
        /* ============================================= */

        .overlay-close {
            position: absolute;

            top: 8px;
            right: 12px;

            border: 0;
            background: transparent;

            color: #0007E6;

            font-size: 30px;
            line-height: 1;

            cursor: pointer;
        }


        /* ============================================= */
        /* OVERLAY TEXT                                 */
        /* ============================================= */

        #overlay-title {
            margin:
                5px
                35px
                8px;

            font-size: 20px;
        }

        #overlay-paragraph {
            width: 100%;

            margin:
                0
                auto
                15px;

            line-height: 1.4;

            overflow-wrap: anywhere;
        }

        #overlay-date {
            width: 100%;

            margin:
                0
                auto
                15px;

            font-size: 12px;

            overflow-wrap: anywhere;
        }


        /* ============================================= */
        /* LARGE OVERLAY IMAGE                          */
        /* ============================================= */

        #overlay-image {
            display: block;

            width: 100%;
            height: auto;

            max-height: 70vh;

            object-fit: contain;

            margin: 0 auto;

            border-radius: 7px;
        }


        /* ============================================= */
        /* ARROWS                                       */
        /* ============================================= */

        .overlay-navigation {
            width: 100%;

            display: flex;

            justify-content: center;
            align-items: center;

            gap: 35px;

            margin-top: 15px;
        }

        .overlay-arrow {
            border: none;

            background: white;
            color: #0007E6;

            width: 55px;
            height: 42px;

            border-radius: 22px;

            font-size: 26px;

            cursor: pointer;
        }

        .overlay-arrow:hover {
            transform: scale(1.08);
        }

        .overlay-arrow:disabled {
            opacity: 0.35;
            cursor: default;
            transform: none;
        }


        /* ============================================= */
        /* MOBILE                                       */
        /* ============================================= */

        @media (max-width: 600px) {

            #image-overlay {
                padding: 10px;
            }

            .overlay-box {
                width: 100%;

                padding:
                    20px
                    12px;
            }

            #overlay-image {
                width: 100%;
            }
        }

    </style>
</head>


<body>

    <main id="page">
        <p>Loading...</p>
    </main>


    <!-- ============================================= -->
    <!-- IMAGE OVERLAY                                 -->
    <!-- ============================================= -->

    <div
        id="image-overlay"
        aria-hidden="true"
    >

        <div class="overlay-box">

            <button
                class="overlay-close"
                id="overlay-close"
                type="button"
                aria-label="Close image"
            >
                ×
            </button>

            <h2 id="overlay-title"></h2>

            <p id="overlay-paragraph"></p>

            <p id="overlay-date"></p>

            <img
                id="overlay-image"
                src=""
                alt=""
            >

            <div class="overlay-navigation">

                <button
                    class="overlay-arrow"
                    id="overlay-previous"
                    type="button"
                    aria-label="Previous image"
                >
                    ←
                </button>

                <button
                    class="overlay-arrow"
                    id="overlay-next"
                    type="button"
                    aria-label="Next image"
                >
                    →
                </button>

            </div>

        </div>

    </div>


    <script>

        // ======================================================
        // Detect character from /A1/p/
        // ======================================================

        const pathParts =
            window.location.pathname
                .split("/")
                .filter(Boolean);

        const pFolderIndex =
            pathParts.lastIndexOf("p");

        const characterID =
            pFolderIndex > 0
                ? pathParts[pFolderIndex - 1]
                : "";


        // ======================================================
        // Archive images currently visible on this page
        // ======================================================

        const visibleArchiveImages = [];

        let currentOverlayIndex = 0;


        // ======================================================
        // Check value
        // ======================================================

        function hasValue(value) {

            return (
                value !== undefined &&
                value !== null &&
                String(value).trim() !== ""
            );

        }        // ======================================================
        // Overlay elements
        // ======================================================

        const imageOverlay =
            document.getElementById(
                "image-overlay"
            );

        const overlayTitle =
            document.getElementById(
                "overlay-title"
            );

        const overlayParagraph =
            document.getElementById(
                "overlay-paragraph"
            );

        const overlayDate =
            document.getElementById(
                "overlay-date"
            );

        const overlayImage =
            document.getElementById(
                "overlay-image"
            );

        const overlayPrevious =
            document.getElementById(
                "overlay-previous"
            );

        const overlayNext =
            document.getElementById(
                "overlay-next"
            );

        const overlayClose =
            document.getElementById(
                "overlay-close"
            );


        // ======================================================
        // Display one image in overlay
        // ======================================================

        function displayOverlayImage(index) {

            if (
                index < 0 ||
                index >= visibleArchiveImages.length
            ) {
                return;
            }

            currentOverlayIndex =
                index;

            const item =
                visibleArchiveImages[index];

            const information =
                item.information;


            // TITLE

            if (
                hasValue(
                    information.title
                )
            ) {

                overlayTitle.textContent =
                    information.title;

                overlayTitle.hidden =
                    false;

            } else {

                overlayTitle.textContent =
                    "";

                overlayTitle.hidden =
                    true;
            }


            // PARAGRAPH

            if (
                hasValue(
                    information.paragraph
                )
            ) {

                overlayParagraph.textContent =
                    information.paragraph;

                overlayParagraph.hidden =
                    false;

            } else {

                overlayParagraph.textContent =
                    "";

                overlayParagraph.hidden =
                    true;
            }


            // DATE

            if (
                hasValue(
                    information.date
                )
            ) {

                overlayDate.textContent =
                    information.date;

                overlayDate.hidden =
                    false;

            } else {

                overlayDate.textContent =
                    "";

                overlayDate.hidden =
                    true;
            }


            // IMAGE

            overlayImage.src =
                item.src;

            overlayImage.alt =
                item.alt;


            // Disable arrow at beginning/end

            overlayPrevious.disabled =
                currentOverlayIndex === 0;

            overlayNext.disabled =
                currentOverlayIndex ===
                visibleArchiveImages.length - 1;

        }


        // ======================================================
        // Open overlay
        // ======================================================

        function openImageOverlay(index) {

            displayOverlayImage(
                index
            );

            imageOverlay.classList.add(
                "open"
            );

            imageOverlay.setAttribute(
                "aria-hidden",
                "false"
            );

            document.body.style.overflow =
                "hidden";

        }


        // ======================================================
        // Close overlay
        // ======================================================

        function closeImageOverlay() {

            imageOverlay.classList.remove(
                "open"
            );

            imageOverlay.setAttribute(
                "aria-hidden",
                "true"
            );

            document.body.style.overflow =
                "";

        }


        // ======================================================
        // Previous
        // ======================================================

        function previousOverlayImage() {

            if (
                currentOverlayIndex > 0
            ) {

                displayOverlayImage(
                    currentOverlayIndex - 1
                );

            }

        }


        // ======================================================
        // Next
        // ======================================================

        function nextOverlayImage() {

            if (
                currentOverlayIndex <
                visibleArchiveImages.length - 1
            ) {

                displayOverlayImage(
                    currentOverlayIndex + 1
                );

            }

        }


        // ======================================================
        // Overlay buttons
        // ======================================================

        overlayClose.addEventListener(
            "click",
            closeImageOverlay
        );

        overlayPrevious.addEventListener(
            "click",
            previousOverlayImage
        );

        overlayNext.addEventListener(
            "click",
            nextOverlayImage
        );


        // ======================================================
        // Clicking dark background closes overlay
        // ======================================================

        imageOverlay.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    imageOverlay
                ) {

                    closeImageOverlay();

                }

            }
        );


        // ======================================================
        // Keyboard controls
        // ======================================================

        document.addEventListener(
            "keydown",
            event => {

                if (
                    !imageOverlay.classList.contains(
                        "open"
                    )
                ) {
                    return;
                }

                if (
                    event.key === "Escape"
                ) {

                    closeImageOverlay();

                }

                if (
                    event.key === "ArrowLeft"
                ) {

                    previousOverlayImage();

                }

                if (
                    event.key === "ArrowRight"
                ) {

                    nextOverlayImage();

                }

            }
        );


        // ======================================================
        // Create one archive entry
        // ======================================================

        function createImageEntry(
            imageNumber,
            imageInformation,
            overlayIndex
        ) {

            const imageEntry =
                document.createElement(
                    "section"
                );

            imageEntry.className =
                "image-entry";


            // TITLE

            if (
                hasValue(
                    imageInformation.title
                )
            ) {

                const title =
                    document.createElement(
                        "h2"
                    );

                title.className =
                    "image-title";

                title.textContent =
                    imageInformation.title;

                imageEntry.appendChild(
                    title
                );

            }


            // PARAGRAPH

            if (
                hasValue(
                    imageInformation.paragraph
                )
            ) {

                const paragraph =
                    document.createElement(
                        "p"
                    );

                paragraph.className =
                    "image-paragraph";

                paragraph.textContent =
                    imageInformation.paragraph;

                imageEntry.appendChild(
                    paragraph
                );

            }


            // IMAGE

            const image =
                document.createElement(
                    "img"
                );

            image.className =
                "archive-image";

            image.src =
                new URL(
                    `../../shared/ARCIMAGE/${imageNumber}.png`,
                    document.baseURI
                ).href;

            image.alt =
                hasValue(
                    imageInformation.title
                )
                    ? imageInformation.title
                    : `${characterID} archive image ${imageNumber}`;

            image.loading =
                "lazy";


            // Open overlay when clicked

            image.addEventListener(
                "click",
                () => {

                    openImageOverlay(
                        overlayIndex
                    );

                }
            );


            imageEntry.appendChild(
                image
            );

            return imageEntry;

        }        // ======================================================
        // Load archive
        // ======================================================

        async function loadArchivePage() {

            const page =
                document.getElementById(
                    "page"
                );

            if (!characterID) {

                page.innerHTML = `
                    <h1>
                        Archive unavailable
                    </h1>

                    <p>
                        Character could not be detected.
                    </p>
                `;

                return;
            }


            try {

                const jsonURL =
                    new URL(
                        "../../shared/arcinfo.json",
                        document.baseURI
                    ).href;

                const response =
                    await fetch(
                        jsonURL
                    );

                if (!response.ok) {

                    throw new Error(
                        "Could not load arcinfo.json"
                    );

                }

                const archiveData =
                    await response.json();

                const characterArchive =
                    archiveData[
                        characterID
                    ] || {};

                const pageTitle =
                    hasValue(
                        characterArchive.title
                    )
                        ? characterArchive.title
                        : `${characterID} Archive`;

                document.title =
                    pageTitle;

                page.innerHTML =
                    "";


                // PAGE TITLE

                const title =
                    document.createElement(
                        "h1"
                    );

                title.textContent =
                    pageTitle;

                page.appendChild(
                    title
                );


                // PAGE DESCRIPTION

                if (
                    hasValue(
                        characterArchive.description
                    )
                ) {

                    const description =
                        document.createElement(
                            "p"
                        );

                    description.className =
                        "archive-description";

                    description.textContent =
                        characterArchive.description;

                    page.appendChild(
                        description
                    );

                }


                // IMAGE GRID

                const imageContainer =
                    document.createElement(
                        "section"
                    );

                imageContainer.id =
                    "archive-images";

                page.appendChild(
                    imageContainer
                );


                const allImages =
                    archiveData.images || {};

                const imageNumbers =
                    Object.keys(
                        allImages
                    )
                    .sort(
                        (a, b) =>
                            Number(a) -
                            Number(b)
                    );


                // Clear current list

                visibleArchiveImages.length =
                    0;


                // First determine which images
                // actually appear on this page.

                imageNumbers.forEach(
                    imageNumber => {

                        const imageInformation =
                            allImages[
                                imageNumber
                            ] || {};

                        const tags =
                            Array.isArray(
                                imageInformation.tags
                            )
                                ? imageInformation.tags
                                : [];

                        if (
                            !tags.includes(
                                characterID
                            )
                        ) {
                            return;
                        }


                        const imageSource =
                            new URL(
                                `../../shared/ARCIMAGE/${imageNumber}.png`,
                                document.baseURI
                            ).href;

                        const imageAlt =
                            hasValue(
                                imageInformation.title
                            )
                                ? imageInformation.title
                                : `${characterID} archive image ${imageNumber}`;


                        visibleArchiveImages.push({
                            imageNumber:
                                imageNumber,

                            information:
                                imageInformation,

                            src:
                                imageSource,

                            alt:
                                imageAlt
                        });

                    }
                );


                // Now create them in the exact
                // same order as the overlay arrows.

                visibleArchiveImages.forEach(
                    (
                        item,
                        index
                    ) => {

                        const imageEntry =
                            createImageEntry(
                                item.imageNumber,
                                item.information,
                                index
                            );

                        imageContainer.appendChild(
                            imageEntry
                        );

                    }
                );


                // BACK BUTTON

                const backButton =
                    document.createElement(
                        "a"
                    );

                backButton.className =
                    "back-button";

                backButton.href =
                    "../";

                backButton.textContent =
                    "Back to Character";

                page.appendChild(
                    backButton
                );


            } catch (error) {

                console.error(
                    error
                );

                page.innerHTML = `
                    <h1>
                        Archive unavailable
                    </h1>

                    <p>
                        The archive information could not be loaded.
                    </p>

                    <a
                        class="back-button"
                        href="../"
                    >
                        Back to Character
                    </a>
                `;

            }

        }


        loadArchivePage();

    </script>

</body>

</html>
