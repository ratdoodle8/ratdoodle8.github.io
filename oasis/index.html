<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oasis</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  font-family: Arial, sans-serif;
  background: #bcc8cc;
  color: #0007E6;
}

body {
  text-align: center;
  padding: 20px;
}

h1 {
  margin: 10px 0 6px;
}

#status {
  min-height: 22px;
  margin: 8px 0;
}

#releaseButton {
  font-family: Arial, sans-serif;
  font-size: 16px;
  padding: 10px 16px;
  cursor: pointer;
  margin-bottom: 15px;
}

#releaseButton:disabled {
  cursor: default;
  opacity: 0.5;
}

#oasis {
  position: relative;
  width: min(100%, 1000px);
  height: 560px;
  margin: 0 auto;
  overflow: hidden;
  border: 2px solid #0007E6;
  background: #bcc8cc;
}

#ground {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 16%;
  background: #8aa06e;
  border-top: 2px solid #0007E6;
  pointer-events: none;
}


/* =====================================================
   LIVING WEEBIES
===================================================== */

.weebie {
  position: absolute;
  width: 120px;
  height: 160px;
  left: 50%;
  bottom: 16%;
  transform: translateX(-50%);
  transform-origin: center bottom;
  pointer-events: none;
  will-change: left, transform;
}

.weebie-info {
  position: absolute;
  left: 50%;
  bottom: 122px;
  transform: translateX(-50%);
  width: 170px;
  z-index: 20;
  font-size: 14px;
  line-height: 1.15;
  text-shadow:
    1px 1px 0 #bcc8cc,
    -1px -1px 0 #bcc8cc,
    1px -1px 0 #bcc8cc,
    -1px 1px 0 #bcc8cc;
}

.weebie-name {
  font-weight: bold;
}

.weebie-timer {
  font-size: 12px;
  margin-top: 3px;
}

.weebie-body {
  position: absolute;
  width: 100px;
  height: 100px;
  left: 10px;
  bottom: 0;
  transform-origin: center bottom;
}

.weebie-layer {
  position: absolute;
  width: 100%;
  height: 100%;
  left: 0;
  top: 0;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
}

.color-layer {
  -webkit-mask-size: contain;
  -webkit-mask-position: center;
  -webkit-mask-repeat: no-repeat;

  mask-size: contain;
  mask-position: center;
  mask-repeat: no-repeat;
}

.color1,
.color2 {
  position: absolute;
  inset: 0;
}


/* =====================================================
   INTERACTION
===================================================== */

.meet .weebie-body {
  animation: meetAnimation 400ms ease-in-out;
}

@keyframes meetAnimation {
  0% {
    transform: translateY(0) rotate(0deg);
  }

  35% {
    transform: translateY(-13px) rotate(-5deg);
  }

  70% {
    transform: translateY(-5px) rotate(5deg);
  }

  100% {
    transform: translateY(0) rotate(0deg);
  }
}


/* =====================================================
   DEATH MARKER
===================================================== */

.death-marker {
  position: absolute;
  bottom: 15%;
  width: 140px;
  transform: translateX(-50%);
  color: red;
  text-align: center;
  pointer-events: none;
  z-index: 30;
}

.death-info {
  position: absolute;
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%);
  width: 180px;
  color: red;
  font-size: 13px;
  line-height: 1.25;
  font-weight: bold;
}

.death-skull {
  font-size: 22px;
  line-height: 22px;
  color: red;
}

.death-name {
  color: red;
}

.death-time {
  color: red;
}

.death-cooldown {
  color: red;
}

.death-x {
  position: absolute;
  left: 50%;
  bottom: -11px;
  transform: translateX(-50%);
  color: red;
  font-family: Arial, sans-serif;
  font-weight: bold;
  font-size: 34px;
  line-height: 34px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

  body {
    padding: 10px;
  }

  #oasis {
    height: 480px;
  }

  .weebie {
    width: 90px;
    height: 130px;
  }

  .weebie-body {
    width: 78px;
    height: 78px;
    left: 6px;
  }

  .weebie-info {
    bottom: 96px;
    width: 130px;
    font-size: 12px;
  }

  .weebie-timer {
    font-size: 11px;
  }

  .death-info {
    width: 140px;
    font-size: 11px;
  }

}
</style>
</head>

<body>

<h1>Oasis</h1>

<button id="releaseButton" type="button">
  Release your Weebie into the Oasis!
</button>

<div id="status"></div>

<div id="oasis">
  <div id="ground"></div>
</div>


<script>

const API =
  "https://ratdoodle-accounts.ratdoodle8.workers.dev";


const COLORS = {
  "Teal": "#24B5A5",
  "Tan": "#C9A875",
  "Red": "#E04444",
  "Pink": "#ee89f0",
  "Blue": "#4A8FE7",
  "Lime Green": "#8FD14F",
  "White": "#F5F5F5",
  "Purple": "#ed15ff",
  "Silver": "#B8BEC4"
};


const oasis =
  document.getElementById("oasis");

const releaseButton =
  document.getElementById("releaseButton");

const statusText =
  document.getElementById("status");


const actors =
  new Map();

const deathMarkers =
  new Map();


let serverOffset = 0;

let loggedIn = false;

let hasWeebie = false;

let myWeebieName = null;

let pollRunning = false;


/* =====================================================
   AUTH
===================================================== */

function getSessionToken() {

  return localStorage.getItem(
    "rd_session"
  );

}


function authHeaders(
  includeJson = false
) {

  const headers = {};

  const token =
    getSessionToken();


  if (token) {

    headers.Authorization =
      `Bearer ${token}`;

  }


  if (includeJson) {

    headers["Content-Type"] =
      "application/json";

  }


  return headers;

}


/* =====================================================
   ACCOUNT
===================================================== */

async function loadAccount() {

  try {

    const response =
      await fetch(
        `${API}/account`,
        {
          method: "GET",

          credentials:
            "include",

          headers:
            authHeaders()
        }
      );


    const data =
      await response.json();


    if (!data.loggedIn) {

      window.location.href =
        "/login/";

      return;

    }


    loggedIn = true;

    hasWeebie =
      !!data.weebie;


    if (!hasWeebie) {

      releaseButton.disabled =
        true;

      statusText.textContent =
        "You do not have a Weebie.";

      return;

    }


    myWeebieName =
      data.weebie.name;


    await loadOasis();

    startPolling();

  }

  catch (error) {

    console.error(error);

    statusText.textContent =
      "Unable to load account.";

  }

}


/* =====================================================
   RELEASE
===================================================== */

releaseButton.addEventListener(
  "click",
  async () => {

    if (
      !loggedIn ||
      !hasWeebie ||
      releaseButton.disabled
    ) {
      return;
    }


    releaseButton.disabled =
      true;

    statusText.textContent =
      "Releasing...";


    try {

      const response =
        await fetch(
          `${API}/oasis/release`,
          {
            method: "POST",

            credentials:
              "include",

            headers:
              authHeaders(true),

            body:
              JSON.stringify({})
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        if (
          data.state === "alive"
        ) {

          statusText.textContent =
            "Your Weebie is already in the Oasis.";

        }

        else if (
          data.state === "cooldown"
        ) {

          statusText.textContent =
            "Your Weebie is on cooldown.";

        }

        else {

          statusText.textContent =
            data.error ||
            "Release failed.";

        }


        await loadOasis();

        return;

      }


      statusText.textContent =
        "Weebie released!";


      await loadOasis();

    }

    catch (error) {

      console.error(error);

      statusText.textContent =
        "Release failed.";

    }

  }
);


/* =====================================================
   LOAD OASIS
===================================================== */

async function loadOasis() {

  try {

    const response =
      await fetch(
        `${API}/oasis`,
        {
          method: "GET",

          credentials:
            "include",

          headers:
            authHeaders()
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Unable to load Oasis."
      );

    }


    if (data.serverTime) {

      serverOffset =
        new Date(
          data.serverTime
        ).getTime() -
        Date.now();

    }


    syncWeebies(
      data.weebies || []
    );


    syncDeaths(
      data.deaths || []
    );


    updateMyReleaseState(
      data.weebies || [],
      data.deaths || []
    );

  }

  catch (error) {

    console.error(
      "Oasis update failed:",
      error
    );

  }

}


/* =====================================================
   OWNER RELEASE STATE
===================================================== */

function updateMyReleaseState(
  weebies,
  deaths
) {

  if (
    !loggedIn ||
    !hasWeebie
  ) {

    releaseButton.disabled =
      true;

    return;

  }


  const living =
    weebies.find(
      weebie =>
        weebie.name ===
        myWeebieName
    );


  if (living) {

    releaseButton.disabled =
      true;

    statusText.textContent =
      "Your Weebie is in the Oasis.";

    return;

  }


  const dead =
    deaths.find(
      death =>
        death.name ===
        myWeebieName
    );


  if (dead) {

    releaseButton.disabled =
      true;

    statusText.textContent =
      "Your Weebie is on cooldown.";

    return;

  }


  releaseButton.disabled =
    false;


  if (
    statusText.textContent ===
      "Your Weebie is in the Oasis." ||
    statusText.textContent ===
      "Your Weebie is on cooldown." ||
    statusText.textContent ===
      "Weebie released!" ||
    statusText.textContent ===
      "Releasing..."
  ) {

    statusText.textContent =
      "";

  }

}


/* =====================================================
   POLLING
===================================================== */

function startPolling() {

  if (pollRunning) {
    return;
  }


  pollRunning = true;


  setInterval(
    loadOasis,
    2000
  );

}


/* =====================================================
   LIVING WEEBIES
===================================================== */

function syncWeebies(
  weebies
) {

  const activeIds =
    new Set();


  for (
    const weebie
    of weebies
  ) {

    const id =
      String(
        weebie.id
      );


    activeIds.add(id);


    if (!actors.has(id)) {

      createActor(
        weebie
      );

    }


    const actor =
      actors.get(id);


    actor.data =
      weebie;


    updateActorAppearance(
      actor,
      weebie
    );

  }


  for (
    const [id, actor]
    of actors
  ) {

    if (
      !activeIds.has(id)
    ) {

      actor.element.remove();

      actors.delete(id);

    }

  }

}


/* =====================================================
   CREATE WEEBIE
===================================================== */

function createActor(
  weebie
) {

  const element =
    document.createElement(
      "div"
    );


  element.className =
    "weebie";


  const info =
    document.createElement(
      "div"
    );

  info.className =
    "weebie-info";


  const name =
    document.createElement(
      "div"
    );

  name.className =
    "weebie-name";


  const timer =
    document.createElement(
      "div"
    );

  timer.className =
    "weebie-timer";


  info.appendChild(
    name
  );

  info.appendChild(
    timer
  );


  const body =
    document.createElement(
      "div"
    );

  body.className =
    "weebie-body";


  const color1 =
    document.createElement(
      "div"
    );

  color1.className =
    "color-layer color1";


  const color2 =
    document.createElement(
      "div"
    );

  color2.className =
    "color-layer color2";


  const outline =
    document.createElement(
      "img"
    );

  outline.className =
    "weebie-layer";


  body.appendChild(
    color1
  );

  body.appendChild(
    color2
  );

  body.appendChild(
    outline
  );


  element.appendChild(
    info
  );

  element.appendChild(
    body
  );


  oasis.appendChild(
    element
  );


  actors.set(
    String(
      weebie.id
    ),
    {
      element,
      body,
      name,
      timer,
      color1,
      color2,
      outline,
      data: weebie,
      interactionUntil: 0
    }
  );

}


/* =====================================================
   WEEBIE APPEARANCE
===================================================== */

function updateActorAppearance(
  actor,
  weebie
) {

  actor.name.textContent =
    weebie.name ||
    "Weebie";


  const primary =
    COLORS[
      weebie.primaryColor
    ] ||
    weebie.primaryColor ||
    "#F5F5F5";


  const secondary =
    COLORS[
      weebie.secondaryColor
    ] ||
    weebie.secondaryColor ||
    "#F5F5F5";


  const eyelashes =
    String(
      weebie.eyelashes ||
      "Yes"
    ).toLowerCase() ===
    "yes";


  actor.color1.style.background =
    primary;


  actor.color1.style.webkitMaskImage =
    'url("/shared/Weebie-Color1.png")';

  actor.color1.style.maskImage =
    'url("/shared/Weebie-Color1.png")';


  const color2Image =
    eyelashes
      ? "/shared/Weebie-Color2.png"
      : "/shared/Weebie-Color2a.png";


  actor.color2.style.background =
    secondary;

  actor.color2.style.webkitMaskImage =
    `url("${color2Image}")`;

  actor.color2.style.maskImage =
    `url("${color2Image}")`;


  actor.outline.src =
    eyelashes
      ? "/shared/Weebie-Outline.png"
      : "/shared/Weebie-Outline2.png";

}


/* =====================================================
   DEATH MARKERS
===================================================== */

function syncDeaths(
  deaths
) {

  const activeIds =
    new Set();


  for (
    const death
    of deaths
  ) {

    const id =
      String(
        death.id
      );


    activeIds.add(id);


    if (
      !deathMarkers.has(id)
    ) {

      createDeathMarker(
        death
      );

    }


    const marker =
      deathMarkers.get(id);


    marker.data =
      death;


    marker.element.style.left =
      `${death.x}%`;


    marker.name.textContent =
      death.name;

  }


  for (
    const [id, marker]
    of deathMarkers
  ) {

    if (
      !activeIds.has(id)
    ) {

      marker.element.remove();

      deathMarkers.delete(
        id
      );

    }

  }

}


function createDeathMarker(
  death
) {

  const element =
    document.createElement(
      "div"
    );


  element.className =
    "death-marker";


  const info =
    document.createElement(
      "div"
    );

  info.className =
    "death-info";


  const skull =
    document.createElement(
      "div"
    );

  skull.className =
    "death-skull";

  skull.textContent =
    "☠";


  const name =
    document.createElement(
      "div"
    );

  name.className =
    "death-name";


  const time =
    document.createElement(
      "div"
    );

  time.className =
    "death-time";


  const cooldown =
    document.createElement(
      "div"
    );

  cooldown.className =
    "death-cooldown";


  const x =
    document.createElement(
      "div"
    );

  x.className =
    "death-x";

  x.textContent =
    "X";


  info.appendChild(
    skull
  );

  info.appendChild(
    name
  );

  info.appendChild(
    time
  );

  info.appendChild(
    cooldown
  );


  element.appendChild(
    info
  );

  element.appendChild(
    x
  );


  oasis.appendChild(
    element
  );


  deathMarkers.set(
    String(
      death.id
    ),
    {
      element,
      name,
      time,
      cooldown,
      data: death
    }
  );

}


/* =====================================================
   MOVEMENT
===================================================== */

function hash(
  number
) {

  const x =
    Math.sin(
      Number(number) *
      12.9898
    ) *
    43758.5453;


  return (
    x -
    Math.floor(x)
  );

}


function getHorizontalPosition(
  weebie,
  time
) {

  const phase =
    hash(
      weebie.id
    ) *
    Math.PI *
    2;


  const speed =
    0.00022 +
    (
      hash(
        Number(
          weebie.id
        ) +
        77
      ) *
      0.00018
    );


  return (
    10 +
    (
      80 *
      (
        (
          Math.sin(
            time *
            speed +
            phase
          ) +
          1
        ) /
        2
      )
    )
  );

}


function getJumpHeight(
  weebie,
  time
) {

  const id =
    Number(
      weebie.id
    );


  const cycleLength =
    2300 +
    (
      hash(
        id + 150
      ) *
      2600
    );


  const offset =
    hash(
      id + 300
    ) *
    cycleLength;


  const cycle =
    (
      time +
      offset
    ) %
    cycleLength;


  const jumpDuration =
    620;


  if (
    cycle >
    jumpDuration
  ) {

    return 0;

  }


  const progress =
    cycle /
    jumpDuration;


  return (
    Math.sin(
      progress *
      Math.PI
    ) *
    38
  );

}


/* =====================================================
   LIVING TIMER
===================================================== */

function updateLivingTimer(
  actor,
  now
) {

  const expires =
    new Date(
      actor.data.expiresAt
    ).getTime();


  const remaining =
    Math.max(
      0,
      expires - now
    );


  const totalSeconds =
    Math.ceil(
      remaining /
      1000
    );


  const minutes =
    Math.floor(
      totalSeconds /
      60
    );


  const seconds =
    totalSeconds %
    60;


  actor.timer.textContent =
    `${minutes}:${String(seconds).padStart(2, "0")}`;


  /*
    Hide the living Weebie immediately
    when its timer reaches zero.

    The next server update supplies the
    shared death marker.
  */

  if (
    remaining <= 0
  ) {

    actor.element.style.display =
      "none";

  }

  else {

    actor.element.style.display =
      "";

  }

}


/* =====================================================
   DEATH TIMER
===================================================== */

function updateDeathMarker(
  marker,
  now
) {

  const diedAt =
    new Date(
      marker.data.diedAt
    ).getTime();


  const cooldownUntil =
    new Date(
      marker.data.cooldownUntil
    ).getTime();


  const sinceDeath =
    Math.max(
      0,
      now - diedAt
    );


  const sinceSeconds =
    Math.floor(
      sinceDeath /
      1000
    );


  const sinceMinutes =
    Math.floor(
      sinceSeconds /
      60
    );


  const sinceRemainingSeconds =
    sinceSeconds %
    60;


  marker.time.textContent =
    `Died: ${sinceMinutes}:${String(
      sinceRemainingSeconds
    ).padStart(2, "0")} ago`;


  const cooldownRemaining =
    Math.max(
      0,
      cooldownUntil - now
    );


  const cooldownSeconds =
    Math.ceil(
      cooldownRemaining /
      1000
    );


  marker.cooldown.textContent =
    `Cooldown: ${cooldownSeconds}`;


  /*
    Remove the visuals locally as soon
    as cooldown reaches zero.

    Server cleanup will also remove the
    shared record.
  */

  if (
    cooldownRemaining <= 0
  ) {

    marker.element.remove();

    deathMarkers.delete(
      String(
        marker.data.id
      )
    );

  }

}


/* =====================================================
   INTERACTIONS
===================================================== */

function checkInteractions(
  positions,
  now
) {

  positions.sort(
    (a, b) =>
      a.x - b.x
  );


  for (
    let i = 0;
    i <
    positions.length - 1;
    i++
  ) {

    const first =
      positions[i];

    const second =
      positions[i + 1];


    const distance =
      Math.abs(
        first.x -
        second.x
      );


    if (
      distance > 7
    ) {
      continue;
    }


    const interactionWindow =
      Math.floor(
        now /
        2200
      );


    const pairSeed =
      (
        Number(
          first.actor.data.id
        ) *
        31
      ) +
      (
        Number(
          second.actor.data.id
        ) *
        17
      ) +
      interactionWindow;


    if (
      hash(pairSeed) <=
      0.70
    ) {
      continue;
    }


    if (
      now <
        first.actor.interactionUntil ||
      now <
        second.actor.interactionUntil
    ) {
      continue;
    }


    first.actor.interactionUntil =
      now + 1800;

    second.actor.interactionUntil =
      now + 1800;


    playInteraction(
      first.actor
    );

    playInteraction(
      second.actor
    );

  }

}


function playInteraction(
  actor
) {

  actor.element.classList.remove(
    "meet"
  );


  void actor.element.offsetWidth;


  actor.element.classList.add(
    "meet"
  );


  setTimeout(
    () => {

      actor.element.classList.remove(
        "meet"
      );

    },
    400
  );

}


/* =====================================================
   ANIMATION
===================================================== */

function animate() {

  const now =
    Date.now() +
    serverOffset;


  const positions = [];


  for (
    const actor
    of actors.values()
  ) {

    const weebie =
      actor.data;


    const expires =
      new Date(
        weebie.expiresAt
      ).getTime();


    if (
      now <
      expires
    ) {

      const x =
        getHorizontalPosition(
          weebie,
          now
        );


      const jump =
        getJumpHeight(
          weebie,
          now
        );


      actor.element.style.left =
        `${x}%`;


      actor.element.style.transform =
        `translateX(-50%) translateY(${-jump}px)`;


      positions.push({
        actor,
        x
      });

    }


    updateLivingTimer(
      actor,
      now
    );

  }


  for (
    const marker
    of deathMarkers.values()
  ) {

    updateDeathMarker(
      marker,
      now
    );

  }


  checkInteractions(
    positions,
