<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Report</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 14px 60px;

            background-color: #bcc8cc;
            color: #0007E6;

            font-family: Arial, sans-serif;
            text-align: center;
        }

        main {
            width: 100%;
            max-width: 400px;

            margin: 0 auto;
        }

        h1,
        p,
        label,
        a {
            color: #0007E6;
        }

        h1 {
            margin: 0 0 30px;
        }


        /* ============================================= */
        /* FORM                                          */
        /* ============================================= */

        form {
            width: 100%;
        }

        .field {
            width: 100%;

            margin-bottom: 22px;

            text-align: left;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;

            padding: 11px 12px;

            border: 0;

            border-radius: 8px;

            background-color: white;
            color: #0007E6;

            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        textarea {
            min-height: 220px;

            resize: vertical;

            line-height: 1.5;
        }

        input:focus,
        textarea:focus {
            outline: 2px solid #0007E6;
        }

        input[type="file"] {
            padding: 10px;
        }


        /* ============================================= */
        /* BUTTONS                                       */
        /* ============================================= */

        button,
        .button {
            display: inline-block;

            border: 0;

            background-color: white;
            color: #0007E6;

            padding: 13px 22px;

            border-radius: 25px;

            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;

            text-decoration: none;

            cursor: pointer;
        }

        button:hover,
        .button:hover {
            transform: scale(1.04);
        }

        button:disabled {
            opacity: 0.5;

            cursor: default;

            transform: none;
        }

        .button-row {
            display: flex;

            justify-content: center;
            flex-wrap: wrap;

            gap: 10px;

            margin-top: 25px;
        }


        /* ============================================= */
        /* STATUS                                        */
        /* ============================================= */

        #status {
            min-height: 22px;

            margin: 20px auto;

            line-height: 1.4;
        }

        #status.success {
            font-weight: bold;
        }

        #status.error {
            font-weight: bold;
        }


        /* ============================================= */
        /* NOTES                                         */
        /* ============================================= */

        .note {
            margin-top: 5px;

            font-size: 11px;

            opacity: 0.75;
        }

    </style>

</head>


<body>

    <main>

        <h1>
            REPORT
        </h1>


        <form id="report-form">


            <!-- ========================================= -->
            <!-- NAME / USERNAME                           -->
            <!-- ========================================= -->

            <div class="field">

                <label for="name">
                    Name / Username
                </label>

                <input
                    id="name"
                    name="name"
                    type="text"
                    autocomplete="off"
                >

                <p class="note">
                    Leave blank to be anonymous.
                </p>

            </div>


            <!-- ========================================= -->
            <!-- REPORT                                    -->
            <!-- ========================================= -->

            <div class="field">

                <label for="body">
                    Report
                </label>

                <textarea
                    id="body"
                    name="body"
                    required
                    minlength="1"
                ></textarea>

                <p class="note">
                    Describe the user, bug, or issue you are reporting.
                </p>

            </div>


            <!-- ========================================= -->
            <!-- IMAGE                                     -->
            <!-- ========================================= -->

            <div class="field">

                <label for="image">
                    Image
                </label>

                <input
                    id="image"
                    name="image"
                    type="file"
                    accept="image/*"
                >

                <p class="note">
                    Optional.
                </p>

            </div>


            <!-- ========================================= -->
            <!-- SUBMIT                                    -->
            <!-- ========================================= -->

            <button
                id="submit-button"
                type="submit"
            >
                Submit Report
            </button>


        </form>


        <p id="status"></p>


        <div class="button-row">

            <a
                class="button"
                href="/"
            >
                Home
            </a>

        </div>

    </main>


    <script>

        // ======================================================
        // EXISTING NEWS WORKER
        // ======================================================

        const WORKER_URL =
            "https://news-upload.ratdoodle8.workers.dev";


        // ======================================================
        // ELEMENTS
        // ======================================================

        const form =
            document.getElementById(
                "report-form"
            );

        const nameInput =
            document.getElementById(
                "name"
            );

        const bodyInput =
            document.getElementById(
                "body"
            );

        const imageInput =
            document.getElementById(
                "image"
            );

        const submitButton =
            document.getElementById(
                "submit-button"
            );

        const status =
            document.getElementById(
                "status"
            );


        // ======================================================
        // STATUS
        // ======================================================

        function showStatus(
            message,
            type = ""
        ) {

            status.textContent =
                message;

            status.className =
                type;

        }


        // ======================================================
        // SUBMIT REPORT
        // ======================================================

        form.addEventListener(
            "submit",
            async event => {

                event.preventDefault();


                const name =
                    nameInput.value.trim();

                const body =
                    bodyInput.value.trim();

                const image =
                    imageInput.files[0] || null;


                // BODY REQUIRED

                if (!body) {

                    showStatus(
                        "Enter a report.",
                        "error"
                    );

                    return;

                }


                submitButton.disabled =
                    true;

                submitButton.textContent =
                    "Submitting...";


                showStatus(
                    "Submitting report..."
                );


                try {

                    // ==========================================
                    // FORM DATA
                    // ==========================================

                    const formData =
                        new FormData();

                    formData.append(
                        "name",
                        name
                    );

                    formData.append(
                        "body",
                        body
                    );

                    if (image) {

                        formData.append(
                            "image",
                            image
                        );

                    }


                    // ==========================================
                    // SEND TO EXISTING NEWS WORKER
                    // ==========================================

                    const response =
                        await fetch(
                            WORKER_URL + "/report",
                            {
                                method: "POST",

                                body:
                                    formData
                            }
                        );


                    let result = {};


                    try {

                        result =
                            await response.json();

                    } catch {

                        // Worker did not return JSON.

                    }


                    if (!response.ok) {

                        throw new Error(
                            result.error ||
                            result.message ||
                            `Report failed with status ${response.status}.`
                        );

                    }


                    // ==========================================
                    // SUCCESS
                    // ==========================================

                    showStatus(
                        "Report submitted successfully.",
                        "success"
                    );


                    nameInput.value =
                        "";

                    bodyInput.value =
                        "";

                    imageInput.value =
                        "";


                } catch (error) {

                    console.error(
                        error
                    );


                    showStatus(
                        error.message ||
                        "Report failed.",
                        "error"
                    );


                } finally {

                    submitButton.disabled =
                        false;

                    submitButton.textContent =
                        "Submit Report";

                }

            }
        );

    </script>

</body>

</html>
