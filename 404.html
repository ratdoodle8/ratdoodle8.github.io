<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ratdoodle</title>

  <script>
    const path = window.location.pathname;

    if (path.startsWith("/user/")) {
      const username = path
        .substring("/user/".length)
        .replace(/\/+$/, "");

      if (username) {
        window.location.replace(
          "/user/?profile=" +
          encodeURIComponent(username)
        );
      }
    }
  </script>
</head>

<body>
  <h1>404</h1>
  <p>Page not found.</p>
</body>
</html>
