<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account | Ratdoodle</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      background: #bcc8cc;
      color: #0007E6;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .page {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }

    h1,
    h2 {
      margin-top: 0;
    }

    form,
    .panel {
      border: 2px solid #0007E6;
      padding: 20px;
      margin-top: 20px;
      background: #bcc8cc;
    }

    label {
      display: block;
      text-align: left;
      margin-top: 14px;
      margin-bottom: 5px;
    }

    input,
    select,
    button {
      width: 100%;
      font-family: Arial, sans-serif;
      font-size: 16px;
      padding: 10px;
    }

    input,
    select {
      border: 2px solid #0007E6;
      background: white;
      color: black;
    }

    button {
      margin-top: 18px;
      border: 2px solid #0007E6;
      background: #bcc8cc;
      color: #0007E6;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    a {
      color: #0007E6;
    }

    .message {
      min-height: 22px;
      margin-top: 12px;
    }

    .stat {
      margin: 8px 0;
    }

    #loading {
      margin-top: 20px;
    }


    /* WEEBIE IMAGE */

    .weebie-image {
      position: relative;
      width: 100%;
      max-width: 350px;
      aspect-ratio: 1 / 1;
      margin: 20px auto;
    }

    .weebie-layer {
      position: absolute;
      width: 100%;
      height: 100%;
      left: 0;
      top: 0;

      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;

      -webkit-mask-position: center;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-size: contain;

      mask-position: center;
      mask-repeat: no-repeat;
      mask-size: contain;
    }


    /* BOTTOM LAYER */

    #weebieColor1 {
      z-index: 1;

      -webkit-mask-image:
        url("/shared/Weebie-Color1.png");

      mask-image:
        url("/shared/Weebie-Color1.png");
    }


    /* MIDDLE LAYER */

    #weebieColor2 {
      z-index: 2;
    }


    /* TOP LAYER */

    #weebieOutline {
      z-index: 3;
    }


    /* NEW STAT PROMPT */

    #missingStats {
      display: none;
      margin-top: 20px;
      border: 2px solid #0007E6;
      padding: 20px;
    }
  </style>
</head>


<body>

<div class="page">

  <h1>Account</h1>


  <div id="loading">
    Loading account...
  </div>


  <div
    id="loggedOut"
    class="panel"
    style="display:none;"
  >

    <p>
      You are not logged in.
    </p>

    <p>
      <a href="/login/">
        Log in
      </a>
    </p>

    <p>
      <a href="/signup/">
        Create an account
      </a>
    </p>

  </div>



  <div
    id="loggedIn"
    style="display:none;"
  >

    <div class="panel">

      <h2 id="usernameDisplay"></h2>

      <p class="stat">
        Account age:
        <span id="accountAge"></span>
      </p>

      <button id="logoutButton">
        Log Out
      </button>

    </div>



    <div class="panel">

      <h2>Weebies</h2>


      <!-- CREATE WEEBIE -->

      <div
        id="weebieSetup"
        style="display:none;"
      >

        <p>
          Create your first Weebie.
        </p>

        <form id="weebieForm">

          <label for="weebieName">
            Name
          </label>

          <input
            id="weebieName"
            type="text"
            maxlength="30"
            required
          >


          <label for="primaryColor">
            Primary Color
          </label>

          <select
            id="primaryColor"
            required
          >

            <option value="">
              Choose a color
            </option>

            <option>Teal</option>
            <option>Tan</option>
            <option>Red</option>
            <option>Pink</option>
            <option>Blue</option>
            <option>Lime Green</option>
            <option>White</option>
            <option>Purple</option>
            <option>Silver</option>

          </select>


          <label for="secondaryColor">
            Secondary Color
          </label>

          <select
            id="secondaryColor"
            required
          >

            <option value="">
              Choose a color
            </option>

            <option>Teal</option>
            <option>Tan</option>
            <option>Red</option>
            <option>Pink</option>
            <option>Blue</option>
            <option>Lime Green</option>
            <option>White</option>
            <option>Purple</option>
            <option>Silver</option>

          </select>


          <label for="eyelashes">
            Eyelashes
          </label>

          <select
            id="eyelashes"
            required
          >

            <option value="">
              Choose an option
            </option>

            <option value="Yes">
              Yes
            </option>

            <option value="No">
              No
            </option>

          </select>


          <button
            id="createWeebieButton"
            type="submit"
          >
            Create Weebie
          </button>

        </form>


        <div
          id="weebieMessage"
          class="message"
        ></div>

      </div>



      <!-- EXISTING WEEBIE -->

      <div
        id="weebieDisplay"
        style="display:none;"
      >


        <!-- MISSING STAT PROMPT -->

        <div id="missingStats">

          <h2>
            New Weebie Option
          </h2>

          <p>
            Please choose an option for your Weebie.
          </p>

          <form id="missingStatsForm">

            <label for="missingEyelashes">
              Eyelashes
            </label>

            <select
              id="missingEyelashes"
              required
            >

              <option value="">
                Choose an option
              </option>

              <option value="Yes">
                Yes
              </option>

              <option value="No">
                No
              </option>

            </select>

            <button
              id="saveMissingStatsButton"
              type="submit"
            >
              Save
            </button>

          </form>

          <div
            id="missingStatsMessage"
            class="message"
          ></div>

        </div>



        <!-- LAYERED WEEBIE IMAGE -->

        <div class="weebie-image">

          <div
            id="weebieColor1"
            class="weebie-layer"
          ></div>

          <div
            id="weebieColor2"
            class="weebie-layer"
          ></div>

          <div
            id="weebieOutline"
            class="weebie-layer"
          ></div>

        </div>


        <p class="stat">
          Name:
          <span id="displayWeebieName"></span>
        </p>

        <p class="stat">
          Primary Color:
          <span id="displayPrimaryColor"></span>
        </p>

        <p class="stat">
          Secondary Color:
          <span id="displaySecondaryColor"></span>
        </p>


      </div>

    </div>

  </div>

</div>



<script>

const API =
  "https://ratdoodle-accounts.ratdoodle8.workers.dev";


/*
  TEMPORARY COLOR VALUES

  You can change these hex values later
  without changing anything else.
*/

const COLORS = {

  "Teal":
    "#24B5A5",

  "Tan":
    "#C9A875",

  "Red":
    "#E04444",

  "Pink":
    "#ee89f0",

  "Blue":
    "#4A8FE7",

  "Lime Green":
    "#8FD14F",

  "White":
    "#F5F5F5",

  "Purple":
    "#ed15ff",

  "Silver":
    "#B8BEC4"

};



const loading =
  document.getElementById(
    "loading"
  );

const loggedOut =
  document.getElementById(
    "loggedOut"
  );

const loggedIn =
  document.getElementById(
    "loggedIn"
  );

const weebieSetup =
  document.getElementById(
    "weebieSetup"
  );

const weebieDisplay =
  document.getElementById(
    "weebieDisplay"
  );

const missingStats =
  document.getElementById(
    "missingStats"
  );


let currentWeebie = null;



/*
  LOAD ACCOUNT
*/

async function loadAccount() {

  try {

    const response =
      await fetch(
        API + "/account",
        {
          method: "GET",
          credentials: "include"
        }
      );


    const data =
      await response.json();


    loading.style.display =
      "none";


    if (!data.loggedIn) {

      loggedOut.style.display =
        "block";

      return;
    }


    loggedIn.style.display =
      "block";


    document.getElementById(
      "usernameDisplay"
    ).textContent =
      data.username;


    document.getElementById(
      "accountAge"
    ).textContent =
      calculateAccountAge(
        data.createdAt
      );


    if (data.weebie) {

      showWeebie(
        data.weebie
      );

    }

    else {

      weebieSetup.style.display =
        "block";

    }

  }

  catch (error) {

    console.error(error);

    loading.textContent =
      "Unable to load account.";

  }

}



/*
  ACCOUNT AGE
*/

function calculateAccountAge(
  createdAt
) {

  const created =
    new Date(createdAt);

  const now =
    new Date();


  let years =
    now.getFullYear()
    - created.getFullYear();

  let months =
    now.getMonth()
    - created.getMonth();

  let days =
    now.getDate()
    - created.getDate();


  if (days < 0) {

    months--;

    const previousMonth =
      new Date(
        now.getFullYear(),
        now.getMonth(),
        0
      );

    days +=
      previousMonth.getDate();

  }


  if (months < 0) {

    years--;

    months += 12;

  }


  const parts = [];


  if (years > 0) {

    parts.push(
      years +
      (years === 1
        ? " year"
        : " years")
    );

  }


  if (months > 0) {

    parts.push(
      months +
      (months === 1
        ? " month"
        : " months")
    );

  }


  parts.push(
    days +
    (days === 1
      ? " day"
      : " days")
  );


  return parts.join(", ");

}



/*
  DISPLAY WEEBIE
*/

function showWeebie(
  weebie
) {

  currentWeebie =
    weebie;


  weebieSetup.style.display =
    "none";

  weebieDisplay.style.display =
    "block";


  document.getElementById(
    "displayWeebieName"
  ).textContent =
    weebie.name;


  document.getElementById(
    "displayPrimaryColor"
  ).textContent =
    weebie.primary_color;


  document.getElementById(
    "displaySecondaryColor"
  ).textContent =
    weebie.secondary_color;


  document.getElementById(
    "displayEyelashes"
  ).textContent =
    weebie.eyelashes || "Not selected";


  const primaryHex =
    COLORS[
      weebie.primary_color
    ];

  const secondaryHex =
    COLORS[
      weebie.secondary_color
    ];


  /*
    COLOR 1

    Always uses the primary color.
  */

  document.getElementById(
    "weebieColor1"
  ).style.backgroundColor =
    primaryHex;



  /*
    CHECK EYELASHES

    Empty = existing Weebie needs
    to answer the new stat.
  */

  if (
    weebie.eyelashes !== "Yes" &&
    weebie.eyelashes !== "No"
  ) {

    missingStats.style.display =
      "block";


    /*
      We do not know which Color2
      or Outline this Weebie uses yet,
      so hide those two layers.
    */

    document.getElementById(
      "weebieColor2"
    ).style.display =
      "none";

    document.getElementById(
      "weebieOutline"
    ).style.display =
      "none";

    return;
  }


  missingStats.style.display =
    "none";


  document.getElementById(
    "weebieColor2"
  ).style.display =
    "block";

  document.getElementById(
    "weebieOutline"
  ).style.display =
    "block";


  /*
    EYELASHES = YES

    Color2.png
    Outline.png
  */

  if (weebie.eyelashes === "Yes") {

    document.getElementById(
      "weebieColor2"
    ).style.webkitMaskImage =
      'url("/shared/Weebie-Color2.png")';

    document.getElementById(
      "weebieColor2"
    ).style.maskImage =
      'url("/shared/Weebie-Color2.png")';


    document.getElementById(
      "weebieOutline"
    ).style.backgroundImage =
      'url("/shared/Weebie-Outline.png")';

  }


  /*
    EYELASHES = NO

    Color2a.png
    Outline2.png
  */

  else {

    document.getElementById(
      "weebieColor2"
    ).style.webkitMaskImage =
      'url("/shared/Weebie-Color2a.png")';

    document.getElementById(
      "weebieColor2"
    ).style.maskImage =
      'url("/shared/Weebie-Color2a.png")';


    document.getElementById(
      "weebieOutline"
    ).style.backgroundImage =
      'url("/shared/Weebie-Outline2.png")';

  }


  /*
    Color2 OR Color2a
    receives the secondary color.
  */

  document.getElementById(
    "weebieColor2"
  ).style.backgroundColor =
    secondaryHex;

}



/*
  CREATE NEW WEEBIE
*/

document.getElementById(
  "weebieForm"
).addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();


    const message =
      document.getElementById(
        "weebieMessage"
      );

    const button =
      document.getElementById(
        "createWeebieButton"
      );


    const name =
      document.getElementById(
        "weebieName"
      ).value.trim();


    const primaryColor =
      document.getElementById(
        "primaryColor"
      ).value;


    const secondaryColor =
      document.getElementById(
        "secondaryColor"
      ).value;


    const eyelashes =
      document.getElementById(
        "eyelashes"
      ).value;


    button.disabled =
      true;

    message.textContent =
      "Creating Weebie...";


    try {

      const response =
        await fetch(
          API + "/weebie",
          {
            method: "POST",

            credentials:
              "include",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                name,
                primaryColor,
                secondaryColor,
                eyelashes
              })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        message.textContent =
          data.error ||
          "Unable to create Weebie.";

        button.disabled =
          false;

        return;
      }


      showWeebie({

        name:
          name,

        primary_color:
          primaryColor,

        secondary_color:
          secondaryColor,

        eyelashes:
          eyelashes

      });

    }

    catch (error) {

      console.error(error);

      message.textContent =
        "Unable to connect to the account server.";

      button.disabled =
        false;

    }

  }
);



/*
  SAVE NEW STAT FOR EXISTING WEEBIE
*/

document.getElementById(
  "missingStatsForm"
).addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();


    const eyelashes =
      document.getElementById(
        "missingEyelashes"
      ).value;


    const message =
      document.getElementById(
        "missingStatsMessage"
      );


    const button =
      document.getElementById(
        "saveMissingStatsButton"
      );


    button.disabled =
      true;

    message.textContent =
      "Saving...";


    try {

      const response =
        await fetch(
          API + "/weebie/update",
          {
            method: "POST",

            credentials:
              "include",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                eyelashes
              })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        message.textContent =
          data.error ||
          "Unable to save.";

        button.disabled =
          false;

        return;
      }


      currentWeebie.eyelashes =
        eyelashes;


      showWeebie(
        currentWeebie
      );


      message.textContent =
        "";

    }

    catch (error) {

      console.error(error);

      message.textContent =
        "Unable to connect to the account server.";

      button.disabled =
        false;

    }

  }
);



/*
  LOG OUT
*/

document.getElementById(
  "logoutButton"
).addEventListener(
  "click",
  async () => {

    try {

      await fetch(
        API + "/logout",
        {
          method: "POST",
          credentials: "include"
        }
      );

    }

    catch (error) {

      console.error(error);

    }


    window.location.href =
      "/login/";

  }
);



loadAccount();

</script>

</body>
</html>
