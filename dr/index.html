<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarot</title>
<style>
body{background-color:#bcc8cc;color:#0007e6;text-align:center;font-family:Arial,sans-serif}
main{max-width:1000px;margin:24px auto;padding:0 10px}
nav{margin:10px}nav a{margin:0 8px;color:#0007e6}
button{font:inherit;color:#0007e6;cursor:pointer}
#deck{display:block;margin:8px auto 12px;padding:0;border:0;background:none;line-height:0}
#deck img{width:48px;height:68px;display:block}
#spread{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px 8px;margin:20px auto;text-align:center}
.pulled-card{min-width:0;padding:4px}
.pulled-card.pending{visibility:hidden}
.pulled-card img{display:block;width:48px;height:68px;object-fit:contain;margin:0 auto 5px}
.pulled-card h2{font-size:.95rem;margin:4px 0}
.pulled-card .position{font-size:.85rem;margin:3px 0}
.pulled-card .meaning{font-size:.82rem;line-height:1.35;margin:4px 0}
#flight{position:fixed;z-index:1000;pointer-events:none;perspective:700px}
#flight-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d}
#flight img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;backface-visibility:hidden}
#flight .front{transform:rotateY(180deg)}
@media(max-width:500px){#spread{gap:12px 3px}.pulled-card h2{font-size:.78rem}.pulled-card .meaning{font-size:.7rem}.pulled-card .position{font-size:.72rem}.pulled-card img{width:48px;height:68px}}
@media(prefers-reduced-motion:reduce){#flight{animation-duration:1ms!important}}
</style>
</head>
<body>
<nav><a href="/account">Account</a><a href="/">Home</a></nav>
<main>
<h1>Tarot</h1>
<p>Click to pull a random card. Pulled cards stay out of the deck until you reshuffle.</p>
<p>Click the deck to pull a random card. Pulled cards stay out until you reshuffle.</p>
<button id="draw" type="button" aria-label="Pull a card from the deck"><img src="./cards/back.png" alt="Face-down tarot deck"></button>
<p id="count" aria-live="polite"></p>
<div id="spread" aria-live="polite"></div>
<p><button id="shuffle" type="button">Reshuffle</button></p>
</main>
<script>

  ['Death','Major Arcana','☥','An ending that clears space for transformation and renewal.','Clinging to what has ended, fear of change, or a delayed transition.'],
  ['Temperance','Major Arcana','⚗','Balance, patience, and bringing different parts into harmony.','Imbalance, excess, or a need to adjust your approach.'],
  ['The Devil','Major Arcana','⛓','Attachment, temptation, and noticing what has power over you.','Breaking a pattern, reclaiming choice, or facing what you avoid.'],
  ['The Tower','Major Arcana','⚡','A sudden truth, disruption, and the clearing away of false supports.','Avoiding an inevitable change, fear of upheaval, or slow release.'],
  ['The Star','Major Arcana','✶','Hope, healing, and renewed trust in the path ahead.','Discouragement, disconnection, or needing to restore faith in yourself.'],
  ['The Moon','Major Arcana','☽','Dreams, uncertainty, and moving carefully through the unknown.','Confusion lifting, hidden fears, or seeing a situation more clearly.'],
  ['The Sun','Major Arcana','☀','Joy, vitality, confidence, and warm clarity.','Temporary low energy, delayed joy, or a need to make room for play.'],
  ['Judgement','Major Arcana','♧','A wake-up call, honest reflection, and answering a deeper purpose.','Self-criticism, hesitation, or resisting a call to change.'],
  ['The World','Major Arcana','◎','Completion, integration, and a rewarding sense of wholeness.','An unfinished chapter, delays, or needing closure before moving on.'],

  ['Ace of Wands','Wands','♧','A spark of inspiration, bold beginnings, and creative energy.','A delayed start, fading enthusiasm, or an idea needing care.'],
  ['Two of Wands','Wands','♧','Planning ahead and choosing how far you want to reach.','Playing small, fear of the unknown, or plans without action.'],
  ['Three of Wands','Wands','♧','Expansion, looking ahead, and progress beginning to show.','Delays, limited horizons, or revising your expectations.'],
  ['Four of Wands','Wands','♧','Celebration, belonging, and a stable place to enjoy progress.','A postponed gathering, tension at home, or shaky foundations.'],
  ['Five of Wands','Wands','♧','Competition, lively friction, and testing ideas with others.','Avoiding conflict, needless rivalry, or finding common ground.'],
  ['Six of Wands','Wands','♧','Recognition, confidence, and a visible achievement.','Unseen effort, self-doubt, or relying too much on approval.'],
  ['Seven of Wands','Wands','♧','Standing your ground and protecting what matters to you.','Feeling overwhelmed, giving in too quickly, or choosing your battles.'],
  ['Eight of Wands','Wands','♧','Fast movement, news, and momentum gathering.','Delays, mixed messages, or acting before you are ready.'],
  ['Nine of Wands','Wands','♧','Persistence, guarded strength, and being near the finish.','Exhaustion, distrust, or needing rest before the next effort.'],
  ['Ten of Wands','Wands','♧','A heavy responsibility and the need to finish or delegate.','Putting down a burden, asking for help, or avoiding overload.'],
  ['Page of Wands','Wands','♧','Curiosity, adventurous ideas, and an eager new direction.','False starts, impatience, or an idea that needs grounding.'],
  ['Knight of Wands','Wands','♧','Passion, bold action, and a spirited pursuit.','Rushing, inconsistency, or burning energy too quickly.'],
  ['Queen of Wands','Wands','♧','Warm confidence, independence, and magnetic creativity.','Jealousy, insecurity, or hiding your own light.'],
  ['King of Wands','Wands','♧','Vision, inspired leadership, and decisive creative direction.','Impulsiveness, unrealistic plans, or domineering behavior.'],
  // Cups
  ['Ace of Cups','Cups','♡','Emotional renewal, compassion, and a heart opening.','Blocked feelings, emotional depletion, or care turned inward.'],
  ['Two of Cups','Cups','♡','Mutual respect, partnership, and a sincere meeting of hearts.','Misunderstanding, imbalance, or repairing a bond.'],
  ['Three of Cups','Cups','♡','Friendship, shared joy, and celebrating together.','Social strain, overindulgence, or feeling outside the group.'],
  ['Four of Cups','Cups','♡','Reflection, emotional pause, and noticing what is being offered.','Re-engagement, a fresh perspective, or moving past apathy.'],
  ['Five of Cups','Cups','♡','Grief, disappointment, and honoring what has been lost.','Acceptance, support, and seeing what remains.'],
  ['Six of Cups','Cups','♡','Nostalgia, kindness, and memories that shape the present.','Living in the past, growing beyond old patterns, or mixed memories.'],
  ['Seven of Cups','Cups','♡','Many choices, vivid imagination, and sorting wishes from plans.','Clear priorities, fewer illusions, or a grounded decision.'],
  ['Eight of Cups','Cups','♡','Leaving what no longer fulfills you to seek deeper meaning.','Fear of moving on, returning to an old situation, or unfinished feelings.'],
  ['Nine of Cups','Cups','♡','Contentment, pleasure, and a wish coming within reach.','A hollow win, overindulgence, or a wish that needs rethinking.'],
  ['Ten of Cups','Cups','♡','Emotional belonging, shared happiness, and lasting connection.','Tension beneath the surface, unmet expectations, or repairing home ties.'],
  ['Page of Cups','Cups','♡','Tender curiosity, a heartfelt message, and creative dreaming.','Emotional immaturity, blocked inspiration, or a message overlooked.'],
  ['Knight of Cups','Cups','♡','Romance, idealism, and following an emotional invitation.','Moodiness, unrealistic promises, or feelings without follow-through.'],
  ['Queen of Cups','Cups','♡','Empathy, emotional wisdom, and caring without losing yourself.','Overwhelm, weak boundaries, or ignoring your own feelings.'],
  ['King of Cups','Cups','♡','Emotional steadiness, compassion, and calm understanding.','Suppressed feelings, volatility, or emotional distance.'],
  // Swords
  ['Ace of Swords','Swords','⚔','A clear insight, honest conversation, and a decisive new idea.','Confusion, miscommunication, or truth that needs careful handling.'],
  ['Two of Swords','Swords','⚔','A difficult choice, temporary stalemate, and gathering the facts.','Indecision breaking, information emerging, or avoidance becoming costly.'],
  ['Three of Swords','Swords','⚔','Heartbreak, painful truth, and grief that deserves acknowledgement.','Healing, forgiveness, or slowly releasing sorrow.'],
  ['Four of Swords','Swords','⚔','Rest, recovery, and giving your thoughts room to settle.','Returning too soon, restlessness, or a need for a real pause.'],
  ['Five of Swords','Swords','⚔','Conflict, hollow victory, and considering the cost of being right.','Reconciliation, letting go of resentment, or ending a harmful contest.'],
  ['Six of Swords','Swords','⚔','Transition, finding calmer waters, and carrying lessons forward.','Resistance to change, unresolved baggage, or a difficult passage.'],
  ['Seven of Swords','Swords','⚔','Strategy, discretion, and noticing where honesty is needed.','A truth coming out, accountability, or dropping a deceptive plan.'],
  ['Eight of Swords','Swords','⚔','Feeling trapped by fear or assumptions; options may be hidden.','A way out appearing, challenging limiting beliefs, or reclaiming agency.'],
  ['Nine of Swords','Swords','⚔','Anxiety, sleepless thoughts, and worries growing in the dark.','Relief, seeking support, or facing a fear one step at a time.'],
  ['Ten of Swords','Swords','⚔','A painful ending, hitting a limit, and the first light after it.','Recovery, accepting closure, or resisting an ending that has arrived.'],

  ['Knight of Swords','Swords','⚔','Fast decisions, direct action, and pursuing a clear idea.','Recklessness, harsh words, or slowing down to avoid mistakes.'],
  ['Queen of Swords','Swords','⚔','Clear boundaries, discernment, and compassionate honesty.','Coldness, bitterness, or judging before listening.'],

  // Pentacles
  ['Ace of Pentacles','Pentacles','◇','A practical opportunity, material beginning, and seed of stability.','A missed chance, shaky planning, or an offer needing review.'],
  ['Two of Pentacles','Pentacles','◇','Adaptability, balancing priorities, and managing change.','Overcommitment, disorganization, or needing to simplify.'],
  ['Three of Pentacles','Pentacles','◇','Craft, collaboration, and building something with shared skill.','Poor teamwork, overlooked effort, or a need to learn the basics.'],
  ['Four of Pentacles','Pentacles','◇','Security, careful stewardship, and holding on to what you value.','Scarcity fears, possessiveness, or opening up to change.'],
  ['Five of Pentacles','Pentacles','◇','Hardship, feeling shut out, and recognizing where support exists.','Recovery, asking for help, and a gradual return to stability.'],
  ['Six of Pentacles','Pentacles','◇','Generosity, fair exchange, and giving or receiving support.','Unequal terms, strings attached, or restoring balance.'],
  ['Seven of Pentacles','Pentacles','◇','Patience, assessment, and tending work that takes time.','Impatience, poor returns, or changing what is not working.'],
  ['Eight of Pentacles','Pentacles','◇','Practice, diligence, and skill growing through steady effort.','Perfectionism, disengagement, or work without learning.'],
  ['Nine of Pentacles','Pentacles','◇','Self-reliance, earned comfort, and enjoying what you have cultivated.','Dependence, overspending, or success that feels isolating.'],
  ['Ten of Pentacles','Pentacles','◇','Long-term security, shared legacy, and resources across generations.','Family tension, unstable foundations, or redefining success.'],
  ['Page of Pentacles','Pentacles','◇','A practical learner, a useful offer, and a grounded new goal.','Procrastination, impractical plans, or lessons left unattended.'],
  ['Knight of Pentacles','Pentacles','◇','Reliability, patience, and progress through consistent work.','Stagnation, stubborn routine, or taking on too much responsibility.'],
  ['Queen of Pentacles','Pentacles','◇','Practical care, resourcefulness, and comfort rooted in generosity.','Self-neglect, overwork, or worry about material security.'],
  ['King of Pentacles','Pentacles','◇','Stewardship, lasting achievement, and wise use of resources.','Materialism, stubbornness, or success without balance.']
];;
let deck=[];
let pulled=[];
let animationBusy=false;
const drawButton=document.getElementById('draw');
const shuffleButton=document.getElementById('shuffle');
const spread=document.getElementById('spread');
function cardCode(index){if(index<22)return 'MA'+String(index+1).padStart(2,'0');const prefix={Wands:'SW',Cups:'SC',Swords:'SS',Pentacles:'SP'};return prefix[cards[index][1]]+String((index-22)%14+1).padStart(2,'0')}
function updateCount(){document.getElementById('count').textContent=deck.length+' cards left in deck; '+pulled.length+' pulled'}
function makeCard(item){
  const card=cards[item.index];
  const article=document.createElement('article');
  article.className='pulled-card pending';
  const image=document.createElement('img');
  image.className='card-art';
  const code=cardCode(item.index);image.src='./cards/'+code+' - '+card[0]+'.png';
  image.alt=card[0];
  image.width=60; image.height=85;
  const title=document.createElement('h2'); title.textContent=card[0];
  const position=document.createElement('div'); position.className='position'; position.textContent=item.reversed?'Reversed':'Upright';
  const meaning=document.createElement('p'); meaning.className='meaning'; meaning.textContent=card[item.reversed?4:3];
  article.append(image,title,position,meaning);
  return article;
}
function animateDraw(article){
  const deckRect=drawButton.getBoundingClientRect();
  const artRect=article.querySelector('.card-art').getBoundingClientRect();
  const flight=document.createElement('div');
  flight.id='flight';
  flight.style.left=deckRect.left+'px'; flight.style.top=deckRect.top+'px';
  flight.style.width=deckRect.width+'px'; flight.style.height=deckRect.height+'px';
  const inner=document.createElement('div'); inner.id='flight-inner';
  const back=document.createElement('img'); back.src='./cards/back.png'; back.alt='';
  const front=document.createElement('img'); front.className='front'; front.src=article.querySelector('.card-art').src; front.alt='';
  inner.append(back,front); flight.appendChild(inner); document.body.appendChild(flight);
  const duration=window.matchMedia('(prefers-reduced-motion: reduce)').matches?1:650;
  const move=flight.animate([
    {left:deckRect.left+'px',top:deckRect.top+'px',width:deckRect.width+'px',height:deckRect.height+'px'},
    {left:artRect.left+'px',top:artRect.top+'px',width:artRect.width+'px',height:artRect.height+'px'}
  ],{duration,easing:'ease-in-out',fill:'forwards'});
  const flip=inner.animate([{transform:'rotateY(0deg)'},{transform:'rotateY(180deg)'}],{duration,easing:'ease-in-out',fill:'forwards'});
  Promise.all([move.finished,flip.finished]).finally(()=>{
    flight.remove(); article.classList.remove('pending'); animationBusy=false;
    drawButton.disabled=deck.length===0; shuffleButton.disabled=false;
  });
}
function reshuffle(){
  deck=cards.map((_,i)=>i);
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
  pulled=[]; spread.replaceChildren(); updateCount(); drawButton.disabled=false;
}
function draw(){
  if(animationBusy||!deck.length)return;
  animationBusy=true; drawButton.disabled=true; shuffleButton.disabled=true;
  const item={index:deck.pop(),reversed:Math.random()<.28}; pulled.push(item);
  const article=makeCard(item); spread.appendChild(article); updateCount();
  requestAnimationFrame(()=>animateDraw(article));
}
drawButton.addEventListener('click',draw);
shuffleButton.addEventListener('click',reshuffle);
reshuffle();
</script>
</body>
</html>
