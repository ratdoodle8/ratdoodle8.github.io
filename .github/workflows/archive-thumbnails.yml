name: Create Archive Thumbnails

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "shared/ARCIMAGE/*.png"

permissions:
  contents: write

jobs:
  thumbnails:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Create archive thumbnails
        run: |
          mkdir -p shared/ARCIMAGE/thumb

          for image in shared/ARCIMAGE/*.png; do
            [ -f "$image" ] || continue

            filename=$(basename "$image" .png)

            convert "$image" \
              -resize "6%" \
              -resize "100x100>" \
              -quality 45 \
              "shared/ARCIMAGE/thumb/${filename}.webp"
          done

      - name: Commit thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add shared/ARCIMAGE/thumb

          if ! git diff --cached --quiet; then
            git commit -m "Update archive thumbnails"
            git push
          else
            echo "No thumbnail changes."
          fi