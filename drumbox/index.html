<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Drumbox</title>

<style>

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

#drumbox {
  max-width: 90vw;
  max-height: 90vh;
  image-rendering: pixelated;

  transform: scale(1);
  transition: transform 0.04s linear;
}

#start {
  position: fixed;
  inset: 0;

  border: 0;
  background: transparent;
  color: white;

  font: 20px Arial, sans-serif;
  cursor: pointer;
}

</style>
</head>

<body>

<img id="drumbox" src="shared/gifdrumbox.gif" alt="Drumbox">

<button id="start">CLICK TO START</button>

<script>

const gif = document.getElementById("drumbox");
const start = document.getElementById("start");

let audio;

function hitAnimation(amount) {

  gif.style.transform = `scale(${amount})`;

  setTimeout(() => {
    gif.style.transform = "scale(1)";
  }, 45);
}


/* KICK */

function kick() {

  const osc = audio.createOscillator();
  const gain = audio.createGain();

  osc.connect(gain);
  gain.connect(audio.destination);

  const now = audio.currentTime;

  osc.frequency.setValueAtTime(150, now);
  osc.frequency.exponentialRampToValueAtTime(
    45,
    now + 0.12
  );

  gain.gain.setValueAtTime(1, now);
  gain.gain.exponentialRampToValueAtTime(
    0.001,
    now + 0.18
  );

  osc.start(now);
  osc.stop(now + 0.2);

  hitAnimation(1.12);
}


/* SNARE */

function snare() {

  const length = audio.sampleRate * 0.15;
  const buffer = audio.createBuffer(
    1,
    length,
    audio.sampleRate
  );

  const data = buffer.getChannelData(0);

  for (let i = 0; i < length; i++) {
    data[i] = Math.random() * 2 - 1;
  }

  const noise = audio.createBufferSource();
  const filter = audio.createBiquadFilter();
  const gain = audio.createGain();

  noise.buffer = buffer;

  filter.type = "highpass";
  filter.frequency.value = 900;

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audio.destination);

  const now = audio.currentTime;

  gain.gain.setValueAtTime(0.7, now);
  gain.gain.exponentialRampToValueAtTime(
    0.001,
    now + 0.15
  );

  noise.start(now);

  hitAnimation(1.08);
}


/* HI-HAT */

function hihat() {

  const length = audio.sampleRate * 0.04;
  const buffer = audio.createBuffer(
    1,
    length,
    audio.sampleRate
  );

  const data = buffer.getChannelData(0);

  for (let i = 0; i < length; i++) {
    data[i] = Math.random() * 2 - 1;
  }

  const noise = audio.createBufferSource();
  const filter = audio.createBiquadFilter();
  const gain = audio.createGain();

  noise.buffer = buffer;

  filter.type = "highpass";
  filter.frequency.value = 6500;

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audio.destination);

  const now = audio.currentTime;

  gain.gain.setValueAtTime(0.3, now);
  gain.gain.exponentialRampToValueAtTime(
    0.001,
    now + 0.04
  );

  noise.start(now);

  hitAnimation(1.04);
}


/* COMPLETELY RANDOM DRUM LOOP */

function randomDrum() {

  const drums = [
    kick,
    snare,
    hihat
  ];

  const drum =
    drums[
      Math.floor(
        Math.random() * drums.length
      )
    ];

  drum();

  /*
    Random delay from 50ms to 700ms.
    Every hit independently chooses the
    next random delay and random drum.
  */

  const delay =
    50 + Math.random() * 650;

  setTimeout(
    randomDrum,
    delay
  );
}


start.addEventListener("click", async () => {

  audio =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

  await audio.resume();

  start.remove();

  randomDrum();

});

</script>

</body>
</html>
