<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>Weebie Training</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      background: #bcc8cc;
      color: #0007E6;
      overflow-x: hidden;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 10000;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #bcc8cc;
      color: #0007E6;

      font-size: 18px;
    }


    /* =========================================
       PAGE
    ========================================= */

    #page {
      width: 100%;
      max-width: 500px;
      min-height: 100svh;

      margin: 0 auto;

      display: grid;

      grid-template-rows:
        minmax(230px, 1fr)
        minmax(280px, 1.15fr)
        minmax(240px, 0.9fr);
    }


    /* =========================================
       TOP THIRD
    ========================================= */

    #topSection {
      position: relative;
      min-height: 230px;
      overflow: hidden;
    }

    h1 {
      position: absolute;

      top: 14px;
      left: 0;
      right: 0;

      z-index: 5;

      margin: 0;

      text-align: center;

      font-size: 26px;
    }


    /* LARGE / HIGH / RIGHT */

    #gif1 {
      position: absolute;

      width: 58%;
      max-width: 285px;

      right: 3%;
      top: 50px;

      object-fit: contain;

      user-select: none;
      pointer-events: none;
    }


    /* SMALL / LOW / LEFT */

    #gif2 {
      position: absolute;

      width: 30%;
      max-width: 145px;

      left: 6%;
      bottom: 5px;

      object-fit: contain;

      user-select: none;
      pointer-events: none;
    }


    /* =========================================
       MIDDLE THIRD
    ========================================= */

    #middleSection {
      position: relative;
      min-height: 280px;
      overflow: hidden;
    }


    /* =========================================
       WEEBIE
       LARGE / HIGH / RIGHT
    ========================================= */

    #weebieArea {
      position: absolute;

      width: 62%;
      max-width: 310px;

      right: 1%;
      top: 0;

      text-align: center;
    }

    #weebieName {
      margin: 0 0 2px;

      font-size: 19px;
      font-weight: bold;

      min-height: 23px;
    }

    #weebieImage {
      position: relative;

      width: 100%;
      aspect-ratio: 1 / 1;

      margin: 0 auto;
    }

    .weebie-layer {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;

      -webkit-mask-position: center;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-size: contain;

      mask-position: center;
      mask-repeat: no-repeat;
      mask-size: contain;

      pointer-events: none;
    }

    #pushupColor1 {
      z-index: 1;
    }

    #pushupColor2 {
      z-index: 2;
    }

    #pushupOutline {
      z-index: 3;
    }


    /* =========================================
       XP BAR UNDER WEEBIE
    ========================================= */

    #xpArea {
      width: 86%;

      margin:
        -5px
        auto
        0;
    }

    #xpLabel {
      margin-bottom: 3px;

      text-align: left;

      font-size: 11px;
      font-weight: bold;
    }

    #xpBar {
      position: relative;

      width: 100%;
      height: 19px;

      border: 2px solid #0007E6;

      background: white;

      overflow: hidden;
    }

    #xpFill {
      position: absolute;

      left: 0;
      top: 0;
      bottom: 0;

      width: 0%;

      background: #0007E6;
    }

    #xpText {
      position: absolute;

      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      color: black;

      font-size: 10px;
      font-weight: bold;

      pointer-events: none;
    }


    /* =========================================
       PUSHUP INFO
       SMALL / LOW / LEFT
    ========================================= */

    #pushupInfo {
      position: absolute;

      width: 31%;

      left: 6%;
      bottom: 18px;

      border: 2px solid #0007E6;

      padding: 11px 6px;

      background: #bcc8cc;

      text-align: center;
    }

    #currentPushups {
      font-size: clamp(30px, 10vw, 48px);
      font-weight: bold;
      line-height: 1;
    }

    #currentLabel {
      margin-top: 4px;

      font-size: 10px;
      font-weight: bold;
    }

    #dailyPushups {
      margin-top: 12px;

      font-size: 16px;
      font-weight: bold;
    }

    #dailyLabel {
      margin-top: 2px;

      font-size: 10px;
    }

    #status {
      min-height: 14px;

      margin-top: 5px;

      font-size: 11px;
      font-weight: bold;
    }


    /* =========================================
       BOTTOM THIRD
       BUTTON ONLY
    ========================================= */

    #bottomSection {
      position: relative;

      min-height: 240px;

      display: flex;
      align-items: stretch;
      justify-content: center;

      padding:
        8px
        14px
        max(12px, env(safe-area-inset-bottom));
    }

    #trainingButton {
      width: 100%;
      min-height: 100%;

      margin: 0;

      border: 4px solid #0007E6;
      border-radius: 28px;

      background: white;
      color: #0007E6;

      font-family: Arial, sans-serif;

      cursor: pointer;

      user-select: none;
      -webkit-user-select: none;

      touch-action: manipulation;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #trainingButton:active,
    #trainingButton.pressed {
      background: #f3f3f3;
    }

    #buttonText {
      font-size: clamp(28px, 8vw, 42px);
      font-weight: bold;
    }

    #buttonSubtext {
      margin-top: 7px;

      font-size: 14px;
      font-weight: bold;
    }


    /* =========================================
       CONFETTI
    ========================================= */

    .confetti {
      position: fixed;

      width: 9px;
      height: 14px;

      left: 50%;
      top: 50%;

      z-index: 9999;

      pointer-events: none;

      animation:
        confettiBurst
        1100ms
        ease-out
        forwards;
    }

    @keyframes confettiBurst {
      0% {
        transform:
          translate(-50%, -50%)
          rotate(0deg);

        opacity: 1;
      }

      100% {
        transform:
          translate(
            calc(-50% + var(--x)),
            calc(-50% + var(--y))
          )
          rotate(var(--r));

        opacity: 0;
      }
    }


    /* =========================================
       SMALL PHONE ADJUSTMENT
    ========================================= */

    @media (max-height: 720px) {

      #page {
        grid-template-rows:
          210px
          250px
          220px;
      }

      #topSection {
        min-height: 210px;
      }

      #middleSection {
        min-height: 250px;
      }

      #bottomSection {
        min-height: 220px;
      }

      #gif1 {
        width: 53%;
      }

      #weebieArea {
        width: 58%;
      }
    }
  </style>
</head>


<body>

  <div id="loading">
    Loading...
  </div>


  <div id="page">


    <!-- =====================================
         TOP THIRD
    ====================================== -->

    <section id="topSection">

      <h1>
        Weebie Training
      </h1>


      <!-- LARGE / HIGH / RIGHT -->

      <img
        id="gif1"
        src="/shared/gif1.gif"
        alt=""
        draggable="false"
      >


      <!-- SMALL / LOW / LEFT -->

      <img
        id="gif2"
        src="/shared/gif2.gif"
        alt=""
        draggable="false"
      >

    </section>



    <!-- =====================================
         MIDDLE THIRD
    ====================================== -->

    <section id="middleSection">


      <!-- SMALL / LOW / LEFT -->

      <div id="pushupInfo">

        <div id="currentPushups">
          0
        </div>

        <div id="currentLabel">
          CURRENT
        </div>


        <div id="dailyPushups">
          0
        </div>

        <div id="dailyLabel">
          PUSHUPS TODAY
        </div>


        <div id="status"></div>

      </div>



      <!-- LARGE / HIGH / RIGHT -->

      <div id="weebieArea">

        <div id="weebieName">
        </div>


        <div id="weebieImage">

          <div
            id="pushupColor1"
            class="weebie-layer"
          ></div>

          <div
            id="pushupColor2"
            class="weebie-layer"
          ></div>

          <div
            id="pushupOutline"
            class="weebie-layer"
          ></div>

        </div>


        <div id="xpArea">

          <div id="xpLabel">
            XP
          </div>

          <div id="xpBar">

            <div id="xpFill">
            </div>

            <div id="xpText">
              0 XP
            </div>

          </div>

        </div>

      </div>

    </section>



    <!-- =====================================
         BOTTOM THIRD
    ====================================== -->

    <section id="bottomSection">

      <button
        id="trainingButton"
        type="button"
        aria-label="Do pushup"
      >

        <div id="buttonText">
          PUSH
        </div>

        <div id="buttonSubtext">
          Hold or tap
        </div>

      </button>

    </section>

  </div>



  <script>

    const API =
      "https://ratdoodle-accounts.ratdoodle8.workers.dev";


    const PUSHUPS_REQUIRED =
      5000;


    /*
      SAME COLOR VALUES AS ACCOUNT PAGE
    */

    const COLORS = {

      "Teal":
        "#24B5A5",

      "Tan":
        "#C9A875",

      "Red":
        "#E04444",

      "Pink":
        "#ee89f0",

      "Blue":
        "#4A8FE7",

      "Lime Green":
        "#8FD14F",

      "White":
        "#F5F5F5",

      "Purple":
        "#ed15ff",

      "Silver":
        "#B8BEC4"

    };


    const loading =
      document.getElementById(
        "loading"
      );


    const trainingButton =
      document.getElementById(
        "trainingButton"
      );


    const currentPushupsElement =
      document.getElementById(
        "currentPushups"
      );


    const dailyPushupsElement =
      document.getElementById(
        "dailyPushups"
      );


    const status =
      document.getElementById(
        "status"
      );


    const weebieName =
      document.getElementById(
        "weebieName"
      );


    const pushupColor1 =
      document.getElementById(
        "pushupColor1"
      );


    const pushupColor2 =
      document.getElementById(
        "pushupColor2"
      );


    const pushupOutline =
      document.getElementById(
        "pushupOutline"
      );


    const xpFill =
      document.getElementById(
        "xpFill"
      );


    const xpText =
      document.getElementById(
        "xpText"
      );


    let confirmedDailyPushups =
      0;


    let pendingPushups =
      0;


    let sending =
      false;


    let loaded =
      false;


    let currentWeebie =
      null;


    let currentXP =
      0;



    /* =====================================
       AUTH
    ====================================== */

    function getSessionToken() {

      return localStorage.getItem(
        "rd_session"
      );

    }


    function authHeaders(
      includeJson = false
    ) {

      const headers = {};


      const token =
        getSessionToken();


      if (token) {

        headers[
          "Authorization"
        ] =
          "Bearer " +
          token;

      }


      if (includeJson) {

        headers[
          "Content-Type"
        ] =
          "application/json";

      }


      return headers;

    }



    /* =====================================
       PUSHUP DISPLAY
    ====================================== */

    function displayedDailyPushups() {

      return (
        confirmedDailyPushups +
        pendingPushups
      );

    }


    function renderPushups() {

      const total =
        displayedDailyPushups();


      const current =
        total %
        PUSHUPS_REQUIRED;


      currentPushupsElement.textContent =
        current.toLocaleString();


      dailyPushupsElement.textContent =
        total.toLocaleString();

    }



    /* =====================================
       XP DISPLAY
    ====================================== */

    function renderXP() {

      /*
        The account currently has permanent
        total XP rather than an XP level system.

        This fills the visual bar according to
        progress through the current 100 XP
        visual block while still displaying
        the real permanent XP number.
      */

      const blockSize =
        100;


      const progress =
        currentXP %
        blockSize;


      const percentage =
        (
          progress /
          blockSize
        ) *
        100;


      xpFill.style.width =
        percentage +
        "%";


      xpText.textContent =
        currentXP.toLocaleString() +
        " XP";

    }



    /* =====================================
       WEEBIE IMAGE
    ====================================== */

    function setMask(
      element,
      url
    ) {

      element.style.webkitMaskImage =
        'url("' +
        url +
        '")';


      element.style.maskImage =
        'url("' +
        url +
        '")';

    }


    function showPushupUp() {

      if (!currentWeebie) {
        return;
      }


      const primaryHex =
        COLORS[
          currentWeebie.primary_color
        ];


      const secondaryHex =
        COLORS[
          currentWeebie.secondary_color
        ];


      pushupColor1.style.backgroundColor =
        primaryHex;


      pushupColor2.style.backgroundColor =
        secondaryHex;


      /*
        UP POSITION

        Up uses one set regardless
        of eyelashes.
      */

      setMask(
        pushupColor1,
        "/shared/Weebie-PushupUpColor-1.png"
      );


      setMask(
        pushupColor2,
        "/shared/Weebie-PushupUpColor-2.png"
      );


      pushupOutline.style.backgroundImage =
        'url("/shared/Weebie-Pushup-2.png")';

    }


    function showPushupDown() {

      if (!currentWeebie) {
        return;
      }


      const primaryHex =
        COLORS[
          currentWeebie.primary_color
        ];


      const secondaryHex =
        COLORS[
          currentWeebie.secondary_color
        ];


      pushupColor1.style.backgroundColor =
        primaryHex;


      pushupColor2.style.backgroundColor =
        secondaryHex;


      setMask(
        pushupColor1,
        "/shared/Weebie-PushupColor-1.png"
      );


      /*
        EYELASHES = YES

        Default Color2 and Outline.
      */

      if (
        currentWeebie.eyelashes ===
        "Yes"
      ) {

        setMask(
          pushupColor2,
          "/shared/Weebie-PushupColor-2.png"
        );


        pushupOutline.style.backgroundImage =
          'url("/shared/Weebie-Pushup-1.png")';

      }


      /*
        EYELASHES = NO

        Color2a and Outline1a.
      */

      else {

        setMask(
          pushupColor2,
          "/shared/Weebie-PushupColor-2a.png"
        );


        pushupOutline.style.backgroundImage =
          'url("/shared/Weebie-Pushup-1a.png")';

      }

    }



    /* =====================================
       CONFETTI
    ====================================== */

    function confettiBurst() {

      const colors = [
        "#0007E6",
        "#ff4d6d",
        "#ffd60a",
        "#00c853",
        "#9c27b0",
        "#ff7a00"
      ];


      for (
        let i = 0;
        i < 45;
        i++
      ) {

        const piece =
          document.createElement(
            "div"
          );


        piece.className =
          "confetti";


        piece.style.background =
          colors[
            Math.floor(
              Math.random() *
              colors.length
            )
          ];


        const angle =
          Math.random() *
          Math.PI *
          2;


        const distance =
          100 +
          Math.random() *
          240;


        const x =
          Math.cos(
            angle
          ) *
          distance;


        const y =
          Math.sin(
            angle
          ) *
          distance;


        piece.style.setProperty(
          "--x",
          x + "px"
        );


        piece.style.setProperty(
          "--y",
          y + "px"
        );


        piece.style.setProperty(
          "--r",
          (
            Math.random() *
            720 -
            360
          ) +
          "deg"
        );


        document.body.appendChild(
          piece
        );


        setTimeout(
          () => {

            piece.remove();

          },
          1200
        );

      }

    }



    /* =====================================
       ONE PUSHUP
    ====================================== */

    function handlePushup() {

      if (!loaded) {
        return;
      }


      const before =
        displayedDailyPushups();


      pendingPushups++;


      const after =
        before + 1;


      renderPushups();


      if (
        Math.floor(
          after /
          PUSHUPS_REQUIRED
        )
        >
        Math.floor(
          before /
          PUSHUPS_REQUIRED
        )
      ) {

        confettiBurst();

      }


      if (
        pendingPushups >=
        50
      ) {

        flushPushups();

      }

    }



    /* =====================================
       SAVE PUSHUPS
    ====================================== */

    async function flushPushups() {

      if (
        sending ||
        pendingPushups <= 0
      ) {

        return;

      }


      sending =
        true;


      const amount =
        Math.min(
          pendingPushups,
          100
        );


      pendingPushups -=
        amount;


      try {

        const response =
          await fetch(
            API +
            "/training",
            {
              method:
                "POST",

              credentials:
                "include",

              headers:
                authHeaders(
                  true
                ),

              body:
                JSON.stringify(
                  {
                    taps:
                      amount
                  }
                )
            }
          );


        const data =
          await response.json();


        if (
          response.status ===
          401
        ) {

          localStorage.removeItem(
            "rd_session"
          );


          window.location.href =
            "/login/";


          return;

        }


        if (
          data.passwordResetRequired
        ) {

          pendingPushups +=
            amount;


          window.location.href =
            "/account/";


          return;

        }


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Unable to save pushups."
          );

        }


        confirmedDailyPushups =
          Number(
            data.dailyTaps ||
            0
          );


        if (
          data.totalXP !==
          undefined
        ) {

          currentXP =
            Number(
              data.totalXP ||
              0
            );


          renderXP();

        }


        if (
          Number(
            data.xpAwarded ||
            0
          ) >
          0
        ) {

          status.textContent =
            "+" +
            data.xpAwarded +
            " XP";


          setTimeout(
            () => {

              status.textContent =
                "";

            },
            1200
          );

        }


        renderPushups();

      }

      catch (error) {

        pendingPushups +=
          amount;


        console.error(
          error
        );


        status.textContent =
          "Saving...";

      }

      finally {

        sending =
          false;


        if (
          pendingPushups >=
          50
        ) {

          flushPushups();

        }

      }

    }



    /* =====================================
       LOAD ACCOUNT WEEBIE
    ====================================== */

    async function loadWeebie() {

      const response =
        await fetch(
          API +
          "/account",
          {
            method:
              "GET",

            credentials:
              "include",

            headers:
              authHeaders()
          }
        );


      const data =
        await response.json();


      if (
        !data.loggedIn
      ) {

        localStorage.removeItem(
          "rd_session"
        );


        window.location.href =
          "/login/";


        return false;

      }


      if (
        data.passwordResetRequired
      ) {

        window.location.href =
          "/account/";


        return false;

      }


      if (!data.weebie) {

        window.location.href =
          "/account/";


        return false;

      }


      currentWeebie =
        data.weebie;


      weebieName.textContent =
        currentWeebie.name;


      currentXP =
        Number(
          currentWeebie.xp ||
          currentWeebie.stats?.xp ||
          0
        );


      renderXP();


      showPushupUp();


      return true;

    }



    /* =====================================
       LOAD TRAINING
    ====================================== */

    async function loadTraining() {

      try {

        const weebieReady =
          await loadWeebie();


        if (!weebieReady) {
          return;
        }


        const response =
          await fetch(
            API +
            "/training",
            {
              method:
                "GET",

              credentials:
                "include",

              headers:
                authHeaders()
            }
          );


        const data =
          await response.json();


        if (
          response.status ===
          401
        ) {

          localStorage.removeItem(
            "rd_session"
          );


          window.location.href =
            "/login/";


          return;

        }


        if (
          data.passwordResetRequired
        ) {

          window.location.href =
            "/account/";


          return;

        }


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Unable to load training."
          );

        }


        confirmedDailyPushups =
          Number(
            data.dailyTaps ||
            0
          );


        pendingPushups =
          0;


        if (
          data.totalXP !==
          undefined
        ) {

          currentXP =
            Number(
              data.totalXP ||
              0
            );


          renderXP();

        }


        loaded =
          true;


        renderPushups();


        loading.style.display =
          "none";

      }

      catch (error) {

        console.error(
          error
        );


        loading.textContent =
          "Unable to load training.";

      }

    }



    /* =====================================
       BUTTON PRESS / RELEASE

       PRESS:
       down pushup position
       + counts one pushup

       RELEASE:
       returns to up position
    ====================================== */

    function pressButton(
      event
    ) {

      if (!loaded) {
        return;
      }


      event.preventDefault();


      trainingButton.classList.add(
        "pressed"
      );


      showPushupDown();


      handlePushup();

    }


    function releaseButton() {

      trainingButton.classList.remove(
        "pressed"
      );


      showPushupUp();

    }


    trainingButton.addEventListener(
      "pointerdown",
      pressButton
    );


    trainingButton.addEventListener(
      "pointerup",
      releaseButton
    );


    trainingButton.addEventListener(
      "pointercancel",
      releaseButton
    );


    trainingButton.addEventListener(
      "pointerleave",
      releaseButton
    );



    /* =====================================
       REGULAR SAVE
    ====================================== */

    setInterval(
      () => {

        flushPushups();

      },
      1000
    );



    /* =====================================
       SAVE WHEN LEAVING
    ====================================== */

    document.addEventListener(
      "visibilitychange",
      () => {

        if (
          document.visibilityState ===
          "hidden"
        ) {

          flushPushups();

        }

      }
    );


    window.addEventListener(
      "pagehide",
      () => {

        flushPushups();

      }
    );



    /* =====================================
       START
    ====================================== */

    loadTraining();

  </script>

</body>
</html>
