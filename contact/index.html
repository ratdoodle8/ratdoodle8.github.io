<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Socials</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 14px 60px;

            background-color: #bcc8cc;
            color: #0007E6;

            font-family: Arial, sans-serif;
            text-align: center;
        }

        main {
            width: 100%;
            max-width: 400px;

            margin: 0 auto;
        }

        h1,
        p,
        a {
            color: #0007E6;
        }

        h1 {
            margin: 0 0 15px;

            font-size: 32px;
        }

        .email {
            margin: 0 0 30px;

            font-size: 14px;

            overflow-wrap: anywhere;
        }


        /* ============================================= */
        /* BUTTONS                                       */
        /* ============================================= */

        .social-button {
            display: block;

            width: 100%;

            margin: 0 auto 12px;
            padding: 13px 18px;

            background-color: white;
            color: #0007E6;

            border-radius: 25px;

            text-decoration: none;

            font-weight: bold;
        }

        .social-button:hover {
            transform: scale(1.04);
        }


        /* ============================================= */
        /* MOBILE                                        */
        /* ============================================= */

        @media (max-width: 500px) {

            body {
                padding-left: 14px;
                padding-right: 14px;
            }

            h1 {
                font-size: 27px;
            }

        }

    </style>

</head>


<body>

    <main>

        <h1>
            Socials
        </h1>


        <p class="email">
            contactratdoodle@gmail.com
        </p>


        <a
            class="social-button"
            href="/tip"
        >
            TIP
        </a>

    </main>

</body>

</html>
