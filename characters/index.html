<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Characters</title>

    <style>

        body {
            margin: 0;
            padding: 30px;

            background-color: #bcc8cc;

            text-align: center;

            color: #0007E6;

            font-family: Arial, sans-serif;
        }

        a {
            color: #0007E6;
        }

        .corner {
            position: absolute;

            top: 0;
            right: 0;

            border-collapse: collapse;
        }

        .corner td {
            padding: 15px;
        }

        #series-list {
            width: 100%;
            max-width: 400px;

            margin: 30px auto;
        }

        .series-link {
            display: block;

            width: fit-content;

            margin: 18px auto;

            font-size: 18px;
        }

        #status {
            margin-top: 30px;
        }

    </style>

</head>


<body>

    <h1>
        Characters
    </h1>


    <table class="corner">

        <tr>

            <td>
                <a href="../">
                    Back
                </a>
            </td>

            <td>
                <a href="/">
                    Home
                </a>
            </td>

        </tr>

    </table>


    <div id="series-list"></div>

    <p id="status"></p>


    <script>

        async function loadSeries() {

            const seriesList =
                document.getElementById(
                    "series-list"
                );

            const status =
                document.getElementById(
                    "status"
                );


            try {

                const response =
                    await fetch(
                        "/shared/rdwinfo.json"
                    );


                if (!response.ok) {

                    throw new Error(
                        "Could not load character information."
                    );

                }


                const characters =
                    await response.json();


                const prefixes =
                    new Set();


                for (
                    const [id, character]
                    of Object.entries(characters)
                ) {

                    if (
                        !character ||
                        typeof character !== "object"
                    ) {
                        continue;
                    }


                    const match =
                        String(id).match(
                            /^([A-Za-z]+)\d+$/
                        );


                    if (!match) {
                        continue;
                    }


                    const prefix =
                        match[1].toUpperCase();


                    prefixes.add(
                        prefix
                    );

                }


                const sortedPrefixes =
                    Array.from(prefixes)
                        .sort();


                if (
                    sortedPrefixes.length === 0
                ) {

                    status.textContent =
                        "No characters found.";

                    return;

                }


                for (
                    const prefix
                    of sortedPrefixes
                ) {

                    const link =
                        document.createElement(
                            "a"
                        );


                    link.className =
                        "series-link";


                    link.href =
                        "/characters/" +
                        prefix;


                    link.textContent =
                        "Series " +
                        prefix;


                    seriesList.appendChild(
                        link
                    );

                }


            } catch (error) {

                console.error(
                    error
                );


                status.textContent =
                    "Character information could not be loaded.";

            }

        }


        loadSeries();

    </script>

</body>

</html>
