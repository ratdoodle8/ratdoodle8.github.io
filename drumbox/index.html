<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Drumbox</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: black;
  color: white;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

main {
  width: 100%;
  max-width: 760px;
  text-align: center;
}

#drumbox {
  display: block;
  max-width: 90vw;
  max-height: 52vh;
  margin: 0 auto 20px;

  image-rendering: pixelated;

  transform: scale(1);
  transition: transform 0.035s linear;
}

.controls {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.box {
  border: 2px solid white;
  padding: 12px;
}

.box h2 {
  font-size: 15px;
  margin: 0 0 12px;
}

.control {
  margin: 10px 0;
}

.control label {
  display: block;
  font-size: 12px;
  margin-bottom: 5px;
}

input[type="range"] {
  width: 100%;
}

.value {
  font-size: 11px;
  opacity: 0.75;
}

#start {
  position: fixed;
  inset: 0;
  z-index: 1000;

  border: 0;

  background: black;
  color: white;

  font: bold 20px Arial, sans-serif;

  cursor: pointer;
}

@media (max-width: 650px) {

  .controls {
    grid-template-columns: repeat(2, 1fr);
  }

}

@media (max-width: 400px) {

  .controls {
    grid-template-columns: 1fr;
  }

}

</style>
</head>


<body>

<button id="start">
  CLICK TO START
</button>


<main>

<img
  id="drumbox"
  src="/shared/gifdrumbox.gif"
  alt="Drumbox"
>


<div class="controls">


  <!-- MASTER -->

  <div class="box">

    <h2>MASTER</h2>

    <div class="control">

      <label>
        VOLUME
      </label>

      <input
        id="volume"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.8"
      >

      <div
        id="volumeValue"
        class="value"
      >
        80%
      </div>

    </div>

  </div>



  <!-- RHYTHM -->

  <div class="box">

    <h2>RHYTHM</h2>

    <div class="control">

      <label>
        SPEED
      </label>

      <input
        id="speed"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.42"
      >

      <div
        id="speedValue"
        class="value"
      >
        42%
      </div>

    </div>

  </div>



  <!-- EFFECTS -->

  <div class="box">

    <h2>EFFECTS</h2>


    <div class="control">

      <label>
        UNDERWATER
      </label>

      <input
        id="underwater"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0"
      >

      <div
        id="underwaterValue"
        class="value"
      >
        0%
      </div>

    </div>


    <div class="control">

      <label>
        WROBLY
      </label>

      <input
        id="wrobly"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0"
      >

      <div
        id="wroblyValue"
        class="value"
      >
        0%
      </div>

    </div>

  </div>



  <!-- EQ -->

  <div class="box">

    <h2>EQ</h2>


    <div class="control">

      <label>
        LOW
      </label>

      <input
        id="low"
        type="range"
        min="-18"
        max="18"
        step="1"
        value="0"
      >

      <div
        id="lowValue"
        class="value"
      >
        0 dB
      </div>

    </div>


    <div class="control">

      <label>
        MID
      </label>

      <input
        id="mid"
        type="range"
        min="-18"
        max="18"
        step="1"
        value="0"
      >

      <div
        id="midValue"
        class="value"
      >
        0 dB
      </div>

    </div>


    <div class="control">

      <label>
        HIGH
      </label>

      <input
        id="high"
        type="range"
        min="-18"
        max="18"
        step="1"
        value="0"
      >

      <div
        id="highValue"
        class="value"
      >
        0 dB
      </div>

    </div>

  </div>


</div>

</main>


<script>

const gif =
  document.getElementById(
    "drumbox"
  );


const start =
  document.getElementById(
    "start"
  );


const speedControl =
  document.getElementById(
    "speed"
  );


let audio;

let inputBus;

let lowEQ;
let midEQ;
let highEQ;

let underwaterFilter;
let wroblyFilter;

let masterGain;

let wobblePhase = 0;

let visualTimer = null;



/* =====================================================
   AUDIO SYSTEM
===================================================== */

function buildAudio() {

  audio =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();


  inputBus =
    audio.createGain();



  /* LOW EQ */

  lowEQ =
    audio.createBiquadFilter();

  lowEQ.type =
    "lowshelf";

  lowEQ.frequency.value =
    250;



  /* MID EQ */

  midEQ =
    audio.createBiquadFilter();

  midEQ.type =
    "peaking";

  midEQ.frequency.value =
    1200;

  midEQ.Q.value =
    0.8;



  /* HIGH EQ */

  highEQ =
    audio.createBiquadFilter();

  highEQ.type =
    "highshelf";

  highEQ.frequency.value =
    4500;



  /* UNDERWATER */

  underwaterFilter =
    audio.createBiquadFilter();

  underwaterFilter.type =
    "lowpass";

  underwaterFilter.frequency.value =
    20000;

  underwaterFilter.Q.value =
    1;



  /* WROBLY */

  wroblyFilter =
    audio.createBiquadFilter();

  wroblyFilter.type =
    "lowpass";

  wroblyFilter.frequency.value =
    20000;

  wroblyFilter.Q.value =
    1;



  /* MASTER */

  masterGain =
    audio.createGain();

  masterGain.gain.value =
    1;



  /* AUDIO ROUTING */

  inputBus.connect(
    lowEQ
  );

  lowEQ.connect(
    midEQ
  );

  midEQ.connect(
    highEQ
  );

  highEQ.connect(
    underwaterFilter
  );

  underwaterFilter.connect(
    wroblyFilter
  );

  wroblyFilter.connect(
    masterGain
  );

  masterGain.connect(
    audio.destination
  );


  updateEffects();

  wobbleLoop();
}



/* =====================================================
   GIF MOVEMENT
===================================================== */

function hitAnimation(
  amount
) {

  gif.style.transform =
    `scale(${amount})`;


  clearTimeout(
    visualTimer
  );


  visualTimer =
    setTimeout(
      () => {

        gif.style.transform =
          "scale(1)";

      },

      45
    );
}



/* =====================================================
   KICK
===================================================== */

function kick(
  strength = 1
) {

  const osc =
    audio.createOscillator();


  const gain =
    audio.createGain();


  osc.connect(
    gain
  );


  gain.connect(
    inputBus
  );


  const now =
    audio.currentTime;


  osc.frequency.setValueAtTime(
    155,
    now
  );


  osc.frequency.exponentialRampToValueAtTime(
    42,
    now + 0.15
  );


  gain.gain.setValueAtTime(
    0.9 * strength,
    now
  );


  gain.gain.exponentialRampToValueAtTime(
    0.001,
    now + 0.22
  );


  osc.start(
    now
  );


  osc.stop(
    now + 0.23
  );


  hitAnimation(
    1.08 +
    0.05 * strength
  );
}



/* =====================================================
   SNARE
===================================================== */

function snare(
  strength = 1
) {

  const length =
    audio.sampleRate *
    0.16;


  const buffer =
    audio.createBuffer(
      1,
      length,
      audio.sampleRate
    );


  const data =
    buffer.getChannelData(
      0
    );


  for (
    let i = 0;
    i < length;
    i++
  ) {

    data[i] =
      Math.random() * 2 - 1;
  }


  const noise =
    audio.createBufferSource();


  const filter =
    audio.createBiquadFilter();


  const gain =
    audio.createGain();


  noise.buffer =
    buffer;


  filter.type =
    "highpass";


  filter.frequency.value =
    850;


  noise.connect(
    filter
  );


  filter.connect(
    gain
  );


  gain.connect(
    inputBus
  );


  const now =
    audio.currentTime;


  gain.gain.setValueAtTime(
    0.55 * strength,
    now
  );


  gain.gain.exponentialRampToValueAtTime(
    0.001,
    now + 0.16
  );


  noise.start(
    now
  );


  hitAnimation(
    1.05 +
    0.035 * strength
  );
}



/* =====================================================
   HI-HAT
===================================================== */

function hihat(
  strength = 1
) {

  const length =
    audio.sampleRate *
    0.045;


  const buffer =
    audio.createBuffer(
      1,
      length,
      audio.sampleRate
    );


  const data =
    buffer.getChannelData(
      0
    );


  for (
    let i = 0;
    i < length;
    i++
  ) {

    data[i] =
      Math.random() * 2 - 1;
  }


  const noise =
    audio.createBufferSource();


  const filter =
    audio.createBiquadFilter();


  const gain =
    audio.createGain();


  noise.buffer =
    buffer;


  filter.type =
    "highpass";


  filter.frequency.value =
    6000;


  noise.connect(
    filter
  );


  filter.connect(
    gain
  );


  gain.connect(
    inputBus
  );


  const now =
    audio.currentTime;


  gain.gain.setValueAtTime(
    0.25 * strength,
    now
  );


  gain.gain.exponentialRampToValueAtTime(
    0.001,
    now + 0.05
  );


  noise.start(
    now
  );


  hitAnimation(
    1.025 +
    0.025 * strength
  );
}



/* =====================================================
   RANDOM DRUM CHOICE
===================================================== */

function chooseDrum() {

  const r =
    Math.random();


  /*
    Loose psychedelic-rock weighting.

    Kick:   40%
    Hi-hat: 35%
    Snare:  25%

    There is still no fixed sequence.
  */


  if (
    r < 0.40
  ) {

    return kick;
  }


  if (
    r < 0.75
  ) {

    return hihat;
  }


  return snare;
}



/* =====================================================
   RANDOM HIT STRENGTH
===================================================== */

function randomStrength() {

  const random =
    Math.random();


  /*
    Most hits are moderate.

    Occasional hits are much stronger.
  */

  return (
    0.40 +
    random *
    random *
    0.75
  );
}



/* =====================================================
   RANDOM TIMING
===================================================== */

function getRandomDelay() {

  const speed =
    Number(
      speedControl.value
    );


  /*
    EXTREME SPEED RANGE

    0% speed:
    approximately 500–3600 ms

    100% speed:
    approximately 28–250 ms

    This makes the slowest setting
    roughly twice as slow as before
    and the fastest roughly twice
    as fast.
  */


  const slowMinimum =
    500;


  const slowMaximum =
    3600;


  const fastMinimum =
    28;


  const fastMaximum =
    250;



  /*
    Curved knob response.

    This leaves more usable territory
    around the middle of the knob.
  */

  const speedCurve =
    Math.pow(
      speed,
      1.15
    );


  const minimum =
    slowMinimum +
    (
      fastMinimum -
      slowMinimum
    ) *
    speedCurve;


  const maximum =
    slowMaximum +
    (
      fastMaximum -
      slowMaximum
    ) *
    speedCurve;



  /*
    Shorter spaces are favored,
    but every event receives a
    new random delay.
  */

  const random =
    Math.random();


  let delay =
    minimum +
    (
      maximum -
      minimum
    ) *
    Math.pow(
      random,
      2.4
    );



  /*
    Occasional breathing space.
  */

  if (
    Math.random() <
    0.065
  ) {

    delay *=
      1.5 +
      Math.random() *
      1.8;
  }



  /*
    Occasional abrupt quick hit.

    This helps create loose fills
    without locking into a pattern.
  */

  if (
    Math.random() <
    0.10
  ) {

    delay *=
      0.35 +
      Math.random() *
      0.30;
  }


  return delay;
}



/* =====================================================
   RANDOM PSYCHEDELIC RHYTHM
===================================================== */

function randomDrum() {

  const drum =
    chooseDrum();


  drum(
    randomStrength()
  );


  const speed =
    Number(
      speedControl.value
    );



  /*
    SECONDARY HIT

    Roughly one fifth of primary hits
    produce another nearby hit.

    Timing and instrument remain random.
  */

  if (
    Math.random() <
    0.22
  ) {

    const clusterDelay =
      45 +
      Math.random() *
      (
        210 -
        speed * 130
      );


    setTimeout(
      () => {

        chooseDrum()(
          randomStrength() *
          0.72
        );

      },

      clusterDelay
    );
  }



  /*
    RANDOM FILL

    Occasionally creates a group
    of 2–4 additional hits.

    The fill does not use a stored
    or repeating pattern.
  */

  if (
    Math.random() <
    0.055
  ) {

    const hits =
      2 +
      Math.floor(
        Math.random() *
        3
      );


    let position =
      60 +
      Math.random() *
      80;


    for (
      let i = 0;
      i < hits;
      i++
    ) {

      position +=
        45 +
        Math.random() *
        (
          150 -
          speed * 70
        );


      const hitTime =
        position;


      setTimeout(
        () => {

          /*
            Fills favor kick and snare
            slightly more than hats.
          */

          const r =
            Math.random();


          let fillDrum;


          if (
            r < 0.42
          ) {

            fillDrum =
              kick;
          }


          else if (
            r < 0.76
          ) {

            fillDrum =
              snare;
          }


          else {

            fillDrum =
              hihat;
          }


          fillDrum(
            randomStrength() *
            (
              0.55 +
              Math.random() *
              0.35
            )
          );

        },

        hitTime
      );
    }
  }



  /*
    OCCASIONAL EXTRA KICK

    This gives the generator more of
    the grounded pulse associated with
    a rock kit without establishing a
    repeating kick pattern.
  */

  if (
    Math.random() <
    0.08
  ) {

    const kickDelay =
      80 +
      Math.random() *
      (
        260 -
        speed * 120
      );


    setTimeout(
      () => {

        kick(
          randomStrength() *
          0.75
        );

      },

      kickDelay
    );
  }



  /*
    Schedule the next completely
    independent primary hit.
  */

  setTimeout(
    randomDrum,
    getRandomDelay()
  );
}



/* =====================================================
   EFFECT SETTINGS
===================================================== */

function updateEffects() {

  if (!audio) {

    return;
  }


  const volume =
    Number(
      document.getElementById(
        "volume"
      ).value
    );


  const underwater =
    Number(
      document.getElementById(
        "underwater"
      ).value
    );


  const low =
    Number(
      document.getElementById(
        "low"
      ).value
    );


  const mid =
    Number(
      document.getElementById(
        "mid"
      ).value
    );


  const high =
    Number(
      document.getElementById(
        "high"
      ).value
    );



  /*
    LOUDER MASTER

    Maximum volume now reaches
    1.5x gain.
  */

  masterGain.gain.setTargetAtTime(
    volume * 1.5,
    audio.currentTime,
    0.02
  );



  /*
    UNDERWATER

    Progressively closes the
    low-pass filter.
  */

  const underwaterFrequency =
    20000 *
    Math.pow(
      350 / 20000,
      underwater
    );


  underwaterFilter
    .frequency
    .setTargetAtTime(
      underwaterFrequency,
      audio.currentTime,
      0.03
    );


  underwaterFilter
    .Q
    .setTargetAtTime(
      1 +
      underwater * 3,
      audio.currentTime,
      0.03
    );



  /* EQ */

  lowEQ.gain.setTargetAtTime(
    low,
    audio.currentTime,
    0.02
  );


  midEQ.gain.setTargetAtTime(
    mid,
    audio.currentTime,
    0.02
  );


  highEQ.gain.setTargetAtTime(
    high,
    audio.currentTime,
    0.02
  );
}



/* =====================================================
   WROBLY EFFECT
===================================================== */

function wobbleLoop() {

  if (!audio) {

    return;
  }


  const amount =
    Number(
      document.getElementById(
        "wrobly"
      ).value
    );


  wobblePhase +=
    0.05 +
    amount *
    0.13;


  const movement =
    (
      Math.sin(
        wobblePhase
      ) +
      1
    ) /
    2;


  const minimum =
    350 +
    (
      1 -
      amount
    ) *
    12000;


  const frequency =
    minimum +
    (
      20000 -
      minimum
    ) *
    movement;


  wroblyFilter
    .frequency
    .setTargetAtTime(
      frequency,
      audio.currentTime,
      0.03
    );


  wroblyFilter
    .Q
    .setTargetAtTime(
      1 +
      amount *
      8,
      audio.currentTime,
      0.03
    );


  requestAnimationFrame(
    wobbleLoop
  );
}



/* =====================================================
   PERCENT CONTROL
===================================================== */

function percentDisplay(
  inputId,
  outputId
) {

  const input =
    document.getElementById(
      inputId
    );


  const output =
    document.getElementById(
      outputId
    );


  input.addEventListener(
    "input",
    () => {

      output.textContent =
        Math.round(
          Number(
            input.value
          ) *
          100
        ) +
        "%";


      updateEffects();
    }
  );
}



/* =====================================================
   DB CONTROL
===================================================== */

function dbDisplay(
  inputId,
  outputId
) {

  const input =
    document.getElementById(
      inputId
    );


  const output =
    document.getElementById(
      outputId
    );


  input.addEventListener(
    "input",
    () => {

      const value =
        Number(
          input.value
        );


      output.textContent =
        (
          value > 0
            ? "+"
            : ""
        ) +
        value +
        " dB";


      updateEffects();
    }
  );
}



/* =====================================================
   CONNECT CONTROLS
===================================================== */

percentDisplay(
  "volume",
  "volumeValue"
);


percentDisplay(
  "speed",
  "speedValue"
);


percentDisplay(
  "underwater",
  "underwaterValue"
);


percentDisplay(
  "wrobly",
  "wroblyValue"
);


dbDisplay(
  "low",
  "lowValue"
);


dbDisplay(
  "mid",
  "midValue"
);


dbDisplay(
  "high",
  "highValue"
);



/* =====================================================
   START
===================================================== */

start.addEventListener(
  "click",
  async () => {

    buildAudio();


    await audio.resume();


    start.remove();


    randomDrum();
  }
);

</script>

</body>
</html>
