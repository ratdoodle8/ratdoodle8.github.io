<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | Ratdoodle</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 30px 15px;
    background: #bcc8cc;
    color: #0007E6;
    font-family: Arial, sans-serif;
    text-align: center;
  }

  .page {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
  }

  h1, h2 {
    margin-top: 0;
  }

  form, .panel {
    border: 2px solid #0007E6;
    padding: 20px;
    margin-top: 20px;
    background: #bcc8cc;
  }

  label {
    display: block;
    text-align: left;
    margin-top: 14px;
    margin-bottom: 5px;
  }

  input, select, button {
    width: 100%;
    font-family: Arial, sans-serif;
    font-size: 16px;
    padding: 10px;
  }

  input, select {
    border: 2px solid #0007E6;
    background: white;
    color: black;
  }

  button {
    margin-top: 18px;
    border: 2px solid #0007E6;
    background: #bcc8cc;
    color: #0007E6;
    cursor: pointer;
    font-weight: bold;
  }

  button:disabled {
    opacity: 0.6;
    cursor: default;
  }

  a {
    color: #0007E6;
  }

  .message {
    min-height: 22px;
    margin-top: 12px;
  }

  .small {
    font-size: 14px;
  }
</style>

</head>

<body>

<div class="page">

  <h1>Log In</h1>

  <form id="loginForm">

    <label for="username">
      Username
    </label>

    <input
      id="username"
      name="username"
      type="text"
      autocomplete="username"
      required
    >


    <label for="password">
      Password
    </label>

    <input
      id="password"
      name="password"
      type="password"
      autocomplete="current-password"
      required
    >


    <button id="loginButton" type="submit">
      Log In
    </button>

  </form>


  <div id="message" class="message"></div>


  <p class="small">
    Don't have an account?
    <a href="/signup/">Sign up</a>
  </p>

</div>


<script>

const API =
  "https://ratdoodle-accounts.ratdoodle8.workers.dev";


const form =
  document.getElementById("loginForm");

const message =
  document.getElementById("message");

const loginButton =
  document.getElementById("loginButton");


form.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();


    const username =
      document.getElementById(
        "username"
      ).value.trim();


    const password =
      document.getElementById(
        "password"
      ).value;


    message.textContent =
      "Logging in...";

    loginButton.disabled = true;


    try {

      const response = await fetch(
        API + "/login",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            username,
            password
          })
        }
      );


      const data =
        await response.json();


      if (!response.ok) {

        message.textContent =
          data.error ||
          "Unable to log in.";

        loginButton.disabled = false;

        return;
      }


      /*
        SAVE SESSION TOKEN

        This avoids relying on Safari
        accepting a cross-site Worker cookie.
      */

      if (data.sessionToken) {

        localStorage.setItem(
          "rd_session",
          data.sessionToken
        );

      } else {

        message.textContent =
          "Login server did not return a session.";

        loginButton.disabled = false;

        return;
      }


      message.textContent =
        "Logged in.";


      window.location.href =
        "/account/";

  }

    catch (error) {

      console.error(error);

      message.textContent =
        "Unable to connect to the account server.";

      loginButton.disabled = false;

    }

  }
);

</script>

</body>
</html>
