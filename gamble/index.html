<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peecoin Slots</title><style>
:root{color-scheme:light;--blue:#0007e6}*{box-sizing:border-box}body{margin:0;background:#bcc8cc;color:var(--blue);font:16px Arial,sans-serif;min-height:100svh;display:grid;place-items:center;padding:32px 24px}main{width:min(100%,360px);text-align:center}a{color:inherit}nav{text-align:right;font-size:13px;margin-bottom:38px}h1{font-size:21px;font-weight:normal;margin:0 0 12px}.balance{font-size:14px;margin-bottom:26px}.machine{border:2px solid;border-radius:30px 30px 12px 12px;padding:25px 18px 20px;position:relative;margin-right:22px}.title{font-size:12px;letter-spacing:4px;margin-bottom:22px}.reels{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid;border-radius:8px;overflow:hidden}.reel{height:94px;display:grid;place-items:center}.reel+.reel{border-left:2px solid}.reel svg{width:45px;height:45px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.lever{position:absolute;right:-24px;top:64px;width:22px;height:85px;border-right:2px solid;transform-origin:bottom right}.lever:before{content:'';position:absolute;right:-8px;top:-10px;border:2px solid;border-radius:50%;width:15px;height:15px;background:#bcc8cc}.lever:after{content:'';position:absolute;bottom:0;left:0;width:22px;border-bottom:2px solid}.spinning .lever{animation:pull .6s ease}.spinning .reel svg{animation:bob .18s linear infinite}.spinning .reel:nth-child(2) svg{animation-delay:.06s}.spinning .reel:nth-child(3) svg{animation-delay:.12s}.tray{height:9px;width:75px;border:2px solid;border-radius:8px;margin:23px auto 0}form{margin:26px 22px 0 0}label{display:block;font-size:14px;margin-bottom:10px}input,button{font:inherit;color:inherit;border:2px solid;background:transparent;border-radius:6px;padding:11px}input{width:100%;text-align:center}button{width:100%;margin-top:10px;cursor:pointer}button:hover:enabled{background:#0007e60d}button:disabled{opacity:.45;cursor:default}input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid;outline-offset:4px}#result{min-height:45px;margin:20px 22px 0 0;font-size:15px;line-height:1.5}.rules{font-size:12px;line-height:1.8;margin-right:22px}#login{font-size:14px}@keyframes pull{50%{transform:rotate(30deg)}}@keyframes bob{50%{transform:translateY(10px);opacity:.4}}@media(prefers-reduced-motion:reduce){.spinning .lever,.spinning .reel svg{animation:none}}
</style></head><body><main><nav><a href="/homereal">Home</a> · <a href="/account">Account</a></nav><h1>Peecoin Slots</h1><div class="balance">Your Peecoins: <span id="balance">…</span></div><div class="machine" id="machine"><div class="title">GOOD LUCK</div><div class="reels" aria-label="Slot machine"><div class="reel"></div><div class="reel"></div><div class="reel"></div></div><div class="tray"></div><div class="lever" aria-hidden="true"></div></div><form id="form"><label for="bet">How many Peecoins?</label><input id="bet" type="number" min="1" max="10000" step="1" value="1" required inputmode="numeric"><button id="pull" disabled>Pull Lever</button></form><p id="result" role="status" aria-live="polite">Checking your Peecoins…</p><p id="login" hidden><a href="/login">Log in to play</a></p><div class="rules">Two matching = 1× · Three matching = 5×<br>Three stars = 10× · No match = 0×<br>Payout includes your bet.</div></main><script>
const API='https://ratdoodle-accounts.ratdoodle8.workers.dev';
const symbols=['<circle cx="24" cy="24" r="15"/><path d="M24 14v20m5-17h-7a4 4 0 0 0 0 8h4a4 4 0 0 1 0 8h-8"/>','<path d="M24 39S5 27 5 16a10 10 0 0 1 19-4 10 10 0 0 1 19 4c0 11-19 23-19 23Z"/>','<path d="m24 5 17 19-17 19L7 24Z"/>','<path d="m24 4 6 13 14 2-10 10 3 15-13-7-13 7 3-15L4 19l14-2Z"/>'];
const names=['coin','heart','diamond','star'];
const reels=[...document.querySelectorAll('.reel')],pull=document.querySelector('#pull'),betInput=document.querySelector('#bet'),result=document.querySelector('#result'),balance=document.querySelector('#balance'),machine=document.querySelector('#machine');
let coins=0,busy=false,pending=null;const key='ratdoodle-pending-slot';
try{const saved=JSON.parse(sessionStorage.getItem(key));if(saved&&Number.isSafeInteger(saved.bet)&&typeof saved.spinId==='string')pending=saved;}catch{}
function show(values){values.forEach((v,i)=>{reels[i].innerHTML='<svg viewBox="0 0 48 48" role="img" aria-label="'+names[v]+'">'+symbols[v]+'</svg>';});}
show([0,1,3]);
function ready(){pull.disabled=busy||(!pending&&coins<1);betInput.disabled=busy||!!pending;pull.textContent=pending?'Retry Spin':'Pull Lever';}
async function api(method,body){const r=await fetch(API+'/gamble',{method,credentials:'include',headers:body?{'Content-Type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined});let d;try{d=await r.json();}catch{throw Error('Unable to connect to the slot machine.');}if(!r.ok){const e=Error(d.error||'Unable to spin.');e.status=r.status;e.coins=d.coins;throw e;}return d;}
async function load(){try{const d=await api('GET');coins=d.coins;balance.textContent=coins.toLocaleString();result.textContent=pending?'Your last spin needs to be checked. Tap Retry Spin.':coins?'Ready when you are ♡':'You need at least 1 Peecoin.';ready();}catch(e){result.textContent=e.message;if(e.status===401)document.querySelector('#login').hidden=false;}}
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const bet=pending?pending.bet:Number(betInput.value);if(!Number.isSafeInteger(bet)||bet<1||bet>10000||(!pending&&bet>coins)){result.textContent='Choose a whole amount you have, up to 10,000.';return;}if(!pending){pending={bet,spinId:crypto.randomUUID()};try{sessionStorage.setItem(key,JSON.stringify(pending));}catch{}}
busy=true;ready();machine.classList.add('spinning');result.textContent='Round and round…';let timer=setInterval(()=>show(reels.map(()=>Math.floor(Math.random()*4))),110);
try{const [d]=await Promise.all([api('POST',pending),delay(matchMedia('(prefers-reduced-motion: reduce)').matches?0:1800)]);clearInterval(timer);show(d.reels);coins=d.coins;balance.textContent=coins.toLocaleString();result.textContent=d.multiplier===10?'Star jackpot! '+d.payout+' Peecoins ♡':d.multiplier===5?'So lucky! '+d.payout+' Peecoins ♡':d.multiplier===1?'A little match! Your '+d.bet+' Peecoins back ♡':'No match this time ♡';pending=null;try{sessionStorage.removeItem(key);}catch{}}
catch(err){clearInterval(timer);result.textContent=err.status?err.message:'Connection interrupted. Retry to check this same spin.';if(err.coins!==undefined){coins=err.coins;balance.textContent=coins.toLocaleString();}if(err.status){pending=null;try{sessionStorage.removeItem(key);}catch{}if(err.status===401)document.querySelector('#login').hidden=false;}}
finally{clearInterval(timer);machine.classList.remove('spinning');busy=false;ready();}});
load();
</script></body></html>
