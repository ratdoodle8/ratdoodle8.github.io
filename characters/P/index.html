<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	>

	<title>Characters</title>

	<style>

		body {
			background-color: #bcc8cc;
			text-align: center;
			color: #0007E6;
			font-family: Arial, sans-serif;
		}

		img.sizing {
			max-width: 100%;
			max-height: 600px;
			height: auto;
			display: block;
			margin: auto;
		}

		tr,
		th,
		td {
			border: none;
			padding: 10px;
		}

		body,
		table {
			background-color: #bcc8cc;
			text-align: center;
			font-family: Arial, sans-serif;
		}

		table {
			width: 399px;
			margin-left: auto;
			margin-right: auto;
			table-layout: fixed;
			border-collapse: collapse;
		}

		th,
		td {
			width: 113px;
			padding: 10px;
			text-align: center;
			vertical-align: middle;
		}

		#empty-message {
			display: none;
		}

	</style>

</head>


<body>

	<h1 id="page-title">
		Characters
	</h1>

	<p id="list-label">
		(List with images)
	</p>

	<table id="character-table"></table>

	<p id="empty-message">
		No characters in this series.
	</p>


	<script>

		// ======================================================
		// DETECT SERIES FROM FOLDER
		// ======================================================

		const pathParts =
			window.location.pathname
				.split("/")
				.filter(Boolean);


		let series =
			pathParts[
				pathParts.length - 1
			];


		if (
			series.toLowerCase() ===
			"index.html"
		) {

			series =
				pathParts[
					pathParts.length - 2
				];

		}


		series =
			series.toUpperCase();


		// ======================================================
		// PAGE TITLE
		// ======================================================

		document.title =
			"Series " + series;


		document.getElementById(
			"page-title"
		).textContent =
			"Characters Series " +
			series;


		// ======================================================
		// LOAD CHARACTERS
		// ======================================================

		fetch(
			"/shared/rdwinfo.json"
		)

			.then(response => {

				if (!response.ok) {

					throw new Error(
						"Could not load rdwinfo.json"
					);

				}


				return response.json();

			})


			.then(data => {

				const characters =
					Object.values(data)

						.filter(character => {

							if (
								!character ||
								typeof character.number !==
									"string"
							) {

								return false;

							}


							const match =
								character.number
									.toUpperCase()
									.match(
										/^([A-Z]+)\d+$/
									);


							if (!match) {

								return false;

							}


							return (
								match[1] ===
								series
							);

						})


						.sort(
							(first, second) =>

								first.number.localeCompare(
									second.number,
									undefined,
									{
										numeric: true,
										sensitivity: "base"
									}
								)
						);


				const table =
					document.getElementById(
						"character-table"
					);


				const emptyMessage =
					document.getElementById(
						"empty-message"
					);


				const listLabel =
					document.getElementById(
						"list-label"
					);


				// ==============================================
				// NO CHARACTERS
				// ==============================================

				if (
					characters.length === 0
				) {

					table.style.display =
						"none";

					listLabel.style.display =
						"none";

					emptyMessage.style.display =
						"block";

					return;

				}


				// ==============================================
				// BUILD TABLE
				// ==============================================

				for (
					let index = 0;
					index < characters.length;
					index += 3
				) {

					const group =
						characters.slice(
							index,
							index + 3
						);


					const imageRow =
						document.createElement(
							"tr"
						);


					const nameRow =
						document.createElement(
							"tr"
						);


					for (
						let column = 0;
						column < 3;
						column++
					) {

						const imageCell =
							document.createElement(
								"td"
							);


						const nameCell =
							document.createElement(
								"td"
							);


						const character =
							group[column];


						if (character) {

							const characterLink =
								document.createElement(
									"a"
								);


							characterLink.href =
								"/" +
								character.number +
								"/";


							characterLink.style.cssText =
								"display:inline-block; width:113px; height:110px; line-height:0;";


							const characterImage =
								document.createElement(
									"img"
								);


							characterImage.src =
								"/" +
								character.number +
								"/CHARIMAGE/1.png";


							characterImage.alt =
								character.name || character.number;


							characterImage.style.cssText =
								"display:block; width:113px; height:140px; object-fit:cover; object-position:center;";


							characterLink.appendChild(
								characterImage
							);


							imageCell.appendChild(
								characterLink
							);


							nameCell.textContent =
								character.name ||
								character.number;

						}


						imageRow.appendChild(
							imageCell
						);


						nameRow.appendChild(
							nameCell
						);

					}


					table.appendChild(
						imageRow
					);


					table.appendChild(
						nameRow
					);

				}

			})


			.catch(error => {

				console.error(
					error
				);


				document.getElementById(
					"character-table"
				).style.display =
					"none";


				document.getElementById(
					"list-label"
				).style.display =
					"none";


				const emptyMessage =
					document.getElementById(
						"empty-message"
					);


				emptyMessage.style.display =
					"block";


				emptyMessage.textContent =
					"Character information could not be loaded.";

			});

	</script>

</body>

</html>
