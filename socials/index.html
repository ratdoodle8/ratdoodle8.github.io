        /* ============================================= */
        /* BUTTONS                                       */
        /* ============================================= */

        .social-button {

            padding: 13px 18px;

            background-color: white;
            color: #0007E6;

            border-radius: 25px;

            text-decoration: none;

            font-weight: bold;
        }

        .social-button:hover {
            transform: scale(1.04);
        }


        /* ============================================= */
        /* MOBILE                                        */
        /* ============================================= */

        @media (max-width: 500px) {

            body {
                padding-left: 14px;
                padding-right: 14px;
            }

            h1 {
                font-size: 27px;
