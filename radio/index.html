<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ratdoodle Radio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#bcc8cc;color:#0007e6;font-family:Arial,sans-serif;text-align:center}a{color:inherit}.home{position:absolute;top:18px;right:20px}main{max-width:560px;margin:90px auto 35px;padding:20px}h1{font-size:28px}.radio{position:relative;background:#d8dce6;border:4px solid #0007e6;border-radius:36px;padding:26px 22px 24px;box-shadow:8px 10px 0 #727f9a;transform:rotate(-1deg)}.antenna{position:absolute;width:7px;height:68px;background:#0007e6;top:-62px;right:65px;border-radius:5px;transform:rotate(20deg);transform-origin:bottom}.antenna:before{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#0007e6;top:-5px;left:-3px}.screen{background:#e9f4cc;border:3px solid #0007e6;border-radius:18px;padding:18px;box-shadow:inset 0 0 0 4px #c8d3a9}.track{display:flex;align-items:center;gap:16px;text-align:left}.art{width:100px;height:100px;flex-shrink:0;border:2px solid #0007e6;border-radius:10px;background:#d6dfb8;display:grid;place-items:center;overflow:hidden;padding:0;color:inherit;cursor:pointer}.art img{width:100%;height:100%;object-fit:cover}.art:disabled{cursor:default}.note{font-size:44px}.info{min-width:0}#title{font-size:20px;font-weight:bold;overflow-wrap:anywhere;margin:0 0 7px}#album{font-size:14px;margin:0;overflow-wrap:anywhere}.time{display:flex;justify-content:space-between;gap:8px;font:14px monospace;margin:16px 0 6px}.progress{height:12px;background:#bbc79d;border:1px solid #0007e6;border-radius:8px;overflow:hidden}.fill{width:0;height:100%;background:#0007e6}.hardware{display:flex;align-items:center;gap:20px;margin-top:20px}.speaker{height:105px;flex:1;background:radial-gradient(#0007e6 2px,transparent 2.5px) 0 0/9px 9px;border:3px solid #0007e6;border-radius:50%;max-width:135px}.controls{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px}button{font:inherit;border:2px solid #0007e6;background:#fff;color:#0007e6;border-radius:12px;padding:11px 8px;cursor:pointer;box-shadow:0 3px 0 #727f9a}button:active{transform:translateY(3px);box-shadow:none}button:focus-visible{outline:3px solid #ae42cc;outline-offset:3px}button:disabled{opacity:.5;cursor:default}.dial{width:42px;height:42px;border:3px solid #0007e6;border-radius:50%;background:#f6f4e7;margin:12px auto 0;position:relative}.dial:after{content:'';width:3px;height:12px;background:#0007e6;position:absolute;left:17px;top:3px}.on-air{font-size:12px;font-weight:bold;margin:14px 0 0;letter-spacing:2px}.playing .dial{animation:bop 1.4s ease-in-out infinite}.playing .speaker{animation:pulse .8s ease-in-out infinite}#status{min-height:38px;font-size:14px;line-height:1.4;margin-top:24px}.volume{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:24px}input{accent-color:#0007e6}dialog{max-width:92vw;border:3px solid #0007e6;border-radius:16px;background:#bcc8cc;color:#0007e6}dialog::backdrop{background:#111827bb}dialog img{display:block;max-width:80vw;max-height:75vh;margin-bottom:16px}footer{font-size:13px;line-height:1.6}@keyframes bop{50%{transform:rotate(12deg)}}@keyframes pulse{50%{transform:scale(1.03)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:400px){main{padding:14px}.radio{padding:18px 14px}.art{width:78px;height:78px}.hardware{gap:12px}.speaker{max-width:85px;height:85px}#title{font-size:17px}}
</style></head><body><a class="home" href="/">Home</a><main><h1>Ratdoodle Radio</h1><div class="radio" id="radio"><div class="antenna" aria-hidden="true"></div><div class="screen"><div class="track"><button class="art" id="art" disabled aria-label="Open song artwork"><span class="note">♫</span></button><div class="info"><p id="title">Tuning in…</p><p id="album">One shared station · all albums</p></div></div><div class="time"><span id="elapsed">0:00</span><span id="duration">0:00</span></div><div class="progress" id="progress" role="progressbar" aria-label="Song progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div></div><div class="hardware"><div class="speaker" aria-hidden="true"></div><div class="controls"><button id="play" disabled>▶ Play</button><button id="pause" disabled>Ⅱ Pause</button></div></div><div class="dial" aria-hidden="true"></div><p class="on-air" id="air">READY TO TUNE IN</p></div><div class="volume"><label for="volume">Volume</label><input id="volume" type="range" min="0" max="100" value="70"></div><p id="status" role="status" aria-live="polite">Loading songs…</p><footer>Play unmutes. Pause mutes. Everyone hears the same station.<br>Click the artwork to open it.</footer><audio id="audio" preload="metadata"></audio></main><dialog id="artDialog"><img id="largeArt" alt=""><button id="closeArt">Close</button></dialog>
<script>
const $=id=>document.getElementById(id),audio=$('audio');
let tracks=[],current=null,clockBase=Date.now(),clockTick=performance.now(),loading=false;
const epoch=Date.UTC(2026,0,1),clock=s=>{s=Number.isFinite(s)?Math.max(0,Math.floor(s)):0;return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function stationNow(){return clockBase+performance.now()-clockTick}
function hash(text){let h=2166136261;for(const c of text){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function orderForCycle(list,cycle){let seed=hash('ratdoodle-radio-'+cycle),out=[...list];const random=()=>{seed=(seed+0x6D2B79F5)|0;let n=Math.imul(seed^(seed>>>15),1|seed);n^=n+Math.imul(n^(n>>>7),61|n);return ((n^(n>>>14))>>>0)/4294967296};for(let i=out.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function stationAt(list,time){const total=list.reduce((s,t)=>s+t.durationMs,0);if(!total)return null;const passed=Math.max(0,time-epoch),cycle=Math.floor(passed/total);let position=passed%total;for(const track of orderForCycle(list,cycle)){if(position<track.durationMs)return {track,offset:position/1000};position-=track.durationMs}return null}
async function calibrate(){try{const before=performance.now(),r=await fetch('/songs/playlist.json?clock='+Date.now(),{method:'HEAD',cache:'no-store'});const stamp=Date.parse(r.headers.get('Date'));if(Number.isFinite(stamp)){clockBase=stamp+500+(performance.now()-before)/2;clockTick=performance.now()}}catch(e){console.warn('Radio clock check failed',e)}}
function measure(track){return new Promise((resolve,reject)=>{if(track.durationMs>0){resolve(track);return}const probe=new Audio();probe.preload='metadata';const timer=setTimeout(()=>finish(Error('Could not read '+track.title)),30000);function finish(error){clearTimeout(timer);probe.onloadedmetadata=null;probe.onerror=null;probe.removeAttribute('src');probe.load();error?reject(error):resolve(track)}probe.onloadedmetadata=()=>{if(!Number.isFinite(probe.duration)||probe.duration<=0){finish(Error('Invalid song duration'));return}track.durationMs=Math.max(1000,Math.round(probe.duration)*1000);finish()};probe.onerror=()=>finish(Error('Could not read '+track.title));probe.src=track.src})}
function show(t){current=t;$('title').textContent=t.title;$('album').textContent=[t.artist,t.album].filter(Boolean).join(' · ');const art=$('art');art.replaceChildren();art.disabled=!t.cover;if(t.cover){const image=new Image();image.alt=t.title+' artwork';image.src=t.cover;image.onerror=()=>{art.textContent='♫';art.disabled=true};art.append(image)}else art.textContent='♫';audio.src=t.src;audio.load()}
function status(){const audible=!audio.muted&&!audio.paused;$('radio').classList.toggle('playing',audible);$('air').textContent=audible?'ON AIR':'ON AIR · MUTED';$('status').textContent=audio.paused?'Press Play to hear the live station.':audio.muted?'Muted. The station keeps going.':'You’re tuned into the live station.'}
function follow(){const live=stationAt(tracks,stationNow());if(!live)return;if(current?.src!==live.track.src)show(live.track);if(audio.readyState>=1&&Math.abs(audio.currentTime-live.offset)>1.25){try{audio.currentTime=live.offset}catch(e){}}$('elapsed').textContent=clock(live.offset);$('duration').textContent=clock(live.track.durationMs/1000);const p=Math.min(100,live.offset*100000/live.track.durationMs);$('fill').style.width=p+'%';$('progress').setAttribute('aria-valuenow',Math.round(p));if(audio.paused&&!loading){loading=true;audio.play().then(status).catch(status).finally(()=>loading=false)}}
audio.muted=true;audio.volume=.7;
$('play').onclick=()=>{audio.muted=false;follow();audio.play().then(status).catch(()=>{$('status').textContent='Tap Play again to allow audio.'})};
$('pause').onclick=()=>{audio.muted=true;status()};
$('volume').oninput=e=>audio.volume=Number(e.target.value)/100;
audio.addEventListener('loadedmetadata',follow);audio.addEventListener('ended',follow);audio.addEventListener('error',()=>{$('status').textContent='This song cannot load. The station will continue at the next scheduled song.'});
$('art').onclick=()=>{if(current?.cover){$('largeArt').src=current.cover;$('largeArt').alt=current.title+' artwork';$('artDialog').showModal()}};$('closeArt').onclick=()=>$('artDialog').close();
async function init(){try{const r=await fetch('/songs/playlist.json',{cache:'no-store'});if(!r.ok)throw Error('Song index unavailable');const data=await r.json();tracks=(data.tracks||[]).filter(t=>typeof t.src==='string'&&t.src.startsWith('/songs/')).sort((a,b)=>a.src<b.src?-1:a.src>b.src?1:0);if(!tracks.length)throw Error('No songs in the song index');$('status').textContent='Tuning the shared station…';for(let i=0;i<tracks.length;i+=4)await Promise.all(tracks.slice(i,i+4).map(measure));await calibrate();$('play').disabled=false;$('pause').disabled=false;follow();setInterval(follow,1000);setInterval(calibrate,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)calibrate().then(follow)});window.addEventListener('pageshow',follow)}catch(e){tracks=[];$('title').textContent='Radio is waiting';$('status').textContent=e.message+' — check songs/playlist.json and your audio files.'}}
init();

</script></body></html>
