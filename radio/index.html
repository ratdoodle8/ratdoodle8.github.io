<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ratdoodle Radio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#bcc8cc;color:#0007e6;font-family:Arial,sans-serif;text-align:center}a{color:inherit}.home{position:absolute;top:18px;right:20px}main{max-width:560px;margin:90px auto 35px;padding:20px}h1{font-size:28px}.radio{position:relative;background:#d8dce6;border:4px solid #0007e6;border-radius:36px;padding:26px 22px 24px;box-shadow:8px 10px 0 #727f9a;transform:rotate(-1deg)}.antenna{position:absolute;width:7px;height:68px;background:#0007e6;top:-62px;right:65px;border-radius:5px;transform:rotate(20deg);transform-origin:bottom}.antenna:before{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#0007e6;top:-5px;left:-3px}.screen{background:#e9f4cc;border:3px solid #0007e6;border-radius:18px;padding:18px;box-shadow:inset 0 0 0 4px #c8d3a9}.track{display:flex;align-items:center;gap:16px;text-align:left}.art{width:100px;height:100px;flex-shrink:0;border:2px solid #0007e6;border-radius:10px;background:#d6dfb8;display:grid;place-items:center;overflow:hidden;padding:0;color:inherit;cursor:pointer}.art img{width:100%;height:100%;object-fit:cover}.art:disabled{cursor:default}.note{font-size:44px}.info{min-width:0}#title{font-size:20px;font-weight:bold;overflow-wrap:anywhere;margin:0 0 7px}#album{font-size:14px;margin:0;overflow-wrap:anywhere}.time{display:flex;justify-content:space-between;gap:8px;font:14px monospace;margin:16px 0 6px}.progress{height:12px;background:#bbc79d;border:1px solid #0007e6;border-radius:8px;overflow:hidden}.fill{width:0;height:100%;background:#0007e6}.hardware{display:flex;align-items:center;gap:20px;margin-top:20px}.speaker{height:105px;flex:1;background:radial-gradient(#0007e6 2px,transparent 2.5px) 0 0/9px 9px;border:3px solid #0007e6;border-radius:50%;max-width:135px}.controls{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px}button{font:inherit;border:2px solid #0007e6;background:#fff;color:#0007e6;border-radius:12px;padding:11px 8px;cursor:pointer;box-shadow:0 3px 0 #727f9a}button:active{transform:translateY(3px);box-shadow:none}button:focus-visible{outline:3px solid #ae42cc;outline-offset:3px}button:disabled{opacity:.5;cursor:default}.dial{width:42px;height:42px;border:3px solid #0007e6;border-radius:50%;background:#f6f4e7;margin:12px auto 0;position:relative}.dial:after{content:'';width:3px;height:12px;background:#0007e6;position:absolute;left:17px;top:3px}.on-air{font-size:12px;font-weight:bold;margin:14px 0 0;letter-spacing:2px}.playing .dial{animation:bop 1.4s ease-in-out infinite}.playing .speaker{animation:pulse .8s ease-in-out infinite}#status{min-height:38px;font-size:14px;line-height:1.4;margin-top:24px}.volume{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:24px}input{accent-color:#0007e6}dialog{max-width:92vw;border:3px solid #0007e6;border-radius:16px;background:#bcc8cc;color:#0007e6}dialog::backdrop{background:#111827bb}dialog img{display:block;max-width:80vw;max-height:75vh;margin-bottom:16px}footer{font-size:13px;line-height:1.6}@keyframes bop{50%{transform:rotate(12deg)}}@keyframes pulse{50%{transform:scale(1.03)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:400px){main{padding:14px}.radio{padding:18px 14px}.art{width:78px;height:78px}.hardware{gap:12px}.speaker{max-width:85px;height:85px}#title{font-size:17px}}
</style></head><body><a class="home" href="/">Home</a><main><h1>Ratdoodle Radio</h1><div class="radio" id="radio"><div class="antenna" aria-hidden="true"></div><div class="screen"><div class="track"><button class="art" id="art" disabled aria-label="Open song artwork"><span class="note">♫</span></button><div class="info"><p id="title">Tuning in…</p><p id="album">Random songs from every album</p></div></div><div class="time"><span id="elapsed">0:00</span><span id="duration">0:00</span></div><div class="progress" id="progress" role="progressbar" aria-label="Song progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div></div><div class="hardware"><div class="speaker" aria-hidden="true"></div><div class="controls"><button id="play" disabled>▶ Play</button><button id="pause" disabled>Ⅱ Pause</button><button id="previous" disabled>◀ Previous</button><button id="next" disabled>Next ▶</button></div></div><div class="dial" aria-hidden="true"></div><p class="on-air" id="air">READY TO TUNE IN</p></div><div class="volume"><label for="volume">Volume</label><input id="volume" type="range" min="0" max="100" value="70"></div><p id="status" role="status" aria-live="polite">Loading songs…</p><footer>Pause mutes the radio. The song keeps going.<br>Click the artwork to open it.</footer><audio id="audio" preload="metadata"></audio></main><dialog id="artDialog"><img id="largeArt" alt=""><button id="closeArt">Close</button></dialog>
<script>
const $=id=>document.getElementById(id), audio=$('audio');
let tracks=[],bag=[],history=[],cursor=-1,current=null,started=false,busy=false,failed=new Set();
const clock=s=>{s=Number.isFinite(s)?Math.max(0,Math.floor(s)):0;return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function pick(){if(!bag.length){bag=shuffle(tracks.filter(t=>!failed.has(t.src)));if(bag.length>1&&bag.at(-1)===current)[bag[0],bag[bag.length-1]]=[bag.at(-1),bag[0]];}return bag.pop()}
function show(t){current=t;$('title').textContent=t.title;$('album').textContent=[t.artist,t.album].filter(Boolean).join(' · ');const art=$('art');art.replaceChildren();art.disabled=!t.cover;if(t.cover){const image=new Image();image.alt=t.title+' artwork';image.src=t.cover;image.onerror=()=>{art.textContent='♫';art.disabled=true};art.append(image)}else{art.textContent='♫'}audio.src=t.src;audio.load();update()}
async function resume(){try{await audio.play();started=true;$('radio').classList.toggle('playing',!audio.muted);$('air').textContent=audio.muted?'ON AIR · MUTED':'ON AIR';$('status').textContent=audio.muted?'Muted. The music keeps going.':'Now playing.'}catch(e){$('radio').classList.remove('playing');$('air').textContent='PRESS PLAY';$('status').textContent='Press Play to start the radio.'}}
async function next(){if(busy)return;busy=true;try{let t;if(cursor<history.length-1)t=history[++cursor];else{t=pick();if(t){history.push(t);cursor=history.length-1}}if(!t){$('status').textContent='No playable songs available.';return}show(t);if(started)await resume()}finally{busy=false}}
function update(){const duration=audio.duration,pos=audio.currentTime,percent=duration>0&&Number.isFinite(duration)?Math.min(100,pos/duration*100):0;$('elapsed').textContent=clock(pos);$('duration').textContent=clock(duration);$('fill').style.width=percent+'%';$('progress').setAttribute('aria-valuenow',String(Math.round(percent)))}
$('play').onclick=async()=>{audio.muted=false;if(!current)await next();await resume()};
$('pause').onclick=()=>{audio.muted=true;$('radio').classList.remove('playing');$('air').textContent=started?'ON AIR · MUTED':'READY TO TUNE IN';$('status').textContent=started?'Muted. The music keeps going.':'Press Play to start the radio.'};
$('next').onclick=next;$('previous').onclick=async()=>{if(cursor>0){show(history[--cursor]);if(started)await resume()}else audio.currentTime=0};
$('volume').oninput=e=>audio.volume=Number(e.target.value)/100;audio.volume=.7;
for(const event of ['timeupdate','loadedmetadata','durationchange'])audio.addEventListener(event,update);
audio.addEventListener('ended',next);
audio.addEventListener('error',()=>{if(!current)return;failed.add(current.src);$('status').textContent='This song could not load. Trying another…';setTimeout(next,300)});
$('art').onclick=()=>{if(current?.cover){$('largeArt').src=current.cover;$('largeArt').alt=current.title+' artwork';$('artDialog').showModal()}};$('closeArt').onclick=()=>$('artDialog').close();
async function init(){try{const response=await fetch('/songs/playlist.json',{cache:'no-cache'});if(!response.ok)throw Error('Song index unavailable');const data=await response.json();tracks=(data.tracks||[]).filter(t=>typeof t.src==='string'&&t.src.startsWith('/songs/'));if(!tracks.length){$('title').textContent='No songs yet';$('status').textContent='Add songs to /songs/ and let the song index update.';return}for(const id of ['play','pause','next','previous'])$(id).disabled=false;await next();$('status').textContent='Press Play to tune in.'}catch(e){$('title').textContent='Radio is waiting';$('status').textContent='The song index is not available yet. Run the Index radio songs workflow.'}}
init();
</script></body></html>
